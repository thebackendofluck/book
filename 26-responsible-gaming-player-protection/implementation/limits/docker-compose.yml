# Chapter 10 - Responsible Gaming: Limits Service Infrastructure
#
# Provides PostgreSQL (limit definitions, audit logs) and Redis (real-time
# usage counters, session tracking, cool-off state) for the limits service.
#
# Usage:
#   docker-compose up -d
#   docker-compose exec postgres psql -U rg_service -d responsible_gaming
#
# Production notes:
# - Replace default passwords with secrets management (Vault, AWS SSM, etc.)
# - Enable TLS for Redis and PostgreSQL connections
# - Configure PostgreSQL replication for HA
# - Set Redis maxmemory-policy to allkeys-lru for production

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rg-limits-postgres
    environment:
      POSTGRES_USER: rg_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: responsible_gaming
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rg_service -d responsible_gaming"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: rg-limits-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"

  # Redis Insight for monitoring usage counters during development
  redis-insight:
    image: redislabs/redisinsight:2.52.0
    container_name: rg-redis-insight
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    profiles:
      - dev

  # pgAdmin for database inspection during development
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: rg-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    profiles:
      - dev

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: rg-limits-network
