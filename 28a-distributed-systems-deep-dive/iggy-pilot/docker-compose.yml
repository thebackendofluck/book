services:
  iggy-server:
    image: apache/iggy:latest
    container_name: chapter28a-iggy-server
    restart: unless-stopped
    environment:
      IGGY_ROOT_USERNAME: ${IGGY_ROOT_USERNAME:-iggy}
      IGGY_ROOT_PASSWORD: ${IGGY_ROOT_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - iggy-data:/local_data
    networks:
      - iggy-casino

  iggy-web-ui:
    image: apache/iggy-web-ui:latest
    container_name: chapter28a-iggy-web-ui
    restart: unless-stopped
    environment:
      PORT: 3050
      ORIGIN: ${IGGY_WEB_ORIGIN:-http://localhost:3050}
      PUBLIC_IGGY_API_URL: ${PUBLIC_IGGY_API_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3050:3050"
    depends_on:
      - iggy-server
    networks:
      - iggy-casino

networks:
  iggy-casino:
    driver: bridge

volumes:
  iggy-data:
