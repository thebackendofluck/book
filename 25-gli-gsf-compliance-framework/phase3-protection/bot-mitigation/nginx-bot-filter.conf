# =============================================================================
# GLI-GSF Phase 3 - Nginx Bot Mitigation Configuration
# iGaming Platform Bot Detection and Filtering
#
# Purpose: Block malicious bots, scrapers, and automated abuse tools
# while allowing legitimate traffic and approved crawlers.
#
# GLI-GSF-5 Reference: Section 4.1 - Automated Threat Protection
#
# Installation:
#   1. Copy to /etc/nginx/conf.d/bot-filter.conf
#   2. Include in server block: include /etc/nginx/conf.d/bot-filter.conf;
#   3. Reload: nginx -t && nginx -s reload
# =============================================================================

# ---------------------------------------------------------------------------
# Rate limiting zones
# ---------------------------------------------------------------------------
# General API rate limit: 30 req/sec per IP
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;

# Auth endpoint: 5 req/sec per IP (brute-force prevention)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Bet placement: 10 req/sec per IP
limit_req_zone $binary_remote_addr zone=bet_limit:10m rate=10r/s;

# Registration: 1 req/min per IP
limit_req_zone $binary_remote_addr zone=reg_limit:10m rate=1r/m;

# Withdrawal: 2 req/min per IP
limit_req_zone $binary_remote_addr zone=withdraw_limit:10m rate=2r/m;

# KYC document upload: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=kyc_limit:10m rate=5r/m;

# ---------------------------------------------------------------------------
# Connection limiting
# ---------------------------------------------------------------------------
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ---------------------------------------------------------------------------
# GeoIP blocking (requires ngx_http_geoip2_module)
# ---------------------------------------------------------------------------
# Uncomment and configure with your GeoIP2 database
# geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
#     auto_reload 24h;
#     $geoip2_country_code country iso_code;
# }

# ---------------------------------------------------------------------------
# Bot detection map - User-Agent classification
# ---------------------------------------------------------------------------
map $http_user_agent $is_bad_bot {
    default 0;

    # Known malicious bots and scrapers
    ~*(?:80legs|Abonti|AhrefsBot|Alexibot|Anarchie|Asterias) 1;
    ~*(?:BackDoorBot|Badass|Bandit|BatchFTP|BlackWidow) 1;
    ~*(?:BLEXBot|Bolt|BotALot|Buddy|BuiltBotTough) 1;
    ~*(?:Bullseye|BunnySlippers|Cegbfeieh|CheeseBot|CherryPicker) 1;
    ~*(?:ChinaClaw|Collector|Copier|CopyRightCheck|cosmos) 1;
    ~*(?:Crescent|Custo|DISCo|DittoSpyder|DotBot) 1;
    ~*(?:Download\sDemon|Download\sDevil|Download\sWonder|dragonfly) 1;
    ~*(?:EasyDL|ebingbong|EirGrabber|EmailCollector|EmailSiphon) 1;
    ~*(?:EmailWolf|EroCrawler|Exabot|Express\sWebPictures|ExtractorPro) 1;
    ~*(?:EyeNetIE|Foobot|FrontPage|GetRight|GetWeb) 1;
    ~*(?:Go-Ahead-Got-It|gotit|Grabber|GrabNet|Grafula) 1;
    ~*(?:Harvest|HMView|HTTrack|httplib|humanlinks) 1;
    ~*(?:ia_archiver|IlseBot|Image\sStripper|Image\sSucker|InfoNaviRobot) 1;
    ~*(?:InterGET|Internet\sNinja|Iria|JennyBot|JetCar) 1;
    ~*(?:JOC\sWeb\sSpider|Kenjin\sSpider|KeywordDensity|larbin|LeechFTP) 1;
    ~*(?:LexiBot|libwww-perl|LinkextractorPro|LinkScan|LNSpiderguy) 1;
    ~*(?:Magnet|Mata\sHari|Memo|MFC_Tear_Sample|Microsoft\sURL) 1;
    ~*(?:MIDown\stool|MIIxpc|Mister\sPiX|moget|MSIECrawler) 1;
    ~*(?:NetAnts|NICErsPRO|Niki-Bot|NPBot|Nutch) 1;
    ~*(?:Octopus|Offline\sExplorer|Offline\sNavigator|Openfind) 1;
    ~*(?:PageGrabber|Papa\sFoto|pavuk|pcBrowser|PeoplePal) 1;
    ~*(?:planetwork|ProPowerBot|ProWebWalker|Purebot|PycURL) 1;
    ~*(?:RealDownload|ReGet|Rippers|RocketCrawler|SBIder) 1;
    ~*(?:Scrapy|SemrushBot|SeekerspiderBot|SiteSnagger|SmartDownload) 1;
    ~*(?:SpankBot|spanner|Sqworm|Stripper|Sucker) 1;
    ~*(?:SuperBot|SuperHTTP|Surfbot|Szukacz|tAkeOut) 1;
    ~*(?:Teleport|Telesoft|TurnitinBot|TheNomad|URLy\.Warning) 1;
    ~*(?:VCI|Vacuum|VoidEYE|Web\sImage\sCollector|Web\sSucker) 1;
    ~*(?:WebAuto|WebBandit|WebCopier|WebEnhancer|WebFetch) 1;
    ~*(?:WebGo\sIS|WebLeacher|WebReaper|WebSauger|WebStripper) 1;
    ~*(?:WebWhacker|WebZIP|Widow|WWW-Mechanize|WWWOFFLE) 1;
    ~*(?:Xaldon|Xenu|Zeus|ZmEu|Zyborg) 1;

    # Gambling-specific scrapers and odds bots
    ~*(?:OddsScraper|BetBot|OddsBot|ArbitrageBot|SureBet) 1;
    ~*(?:BetFinder|OddsHarvester|BookieScraper|LineBot) 1;

    # Empty or suspicious user agents
    ~*^$ 1;
    ~*^-$ 1;
    ~*(?:^Mozilla/4\.0$) 1;
    ~*(?:^Java/) 1;
    ~*(?:^Python-urllib) 1;
}

# Classify request for logging
map $http_user_agent $bot_type {
    default "human";
    ~*(?:Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider) "search_engine";
    ~*(?:facebookexternalhit|Twitterbot|LinkedInBot) "social";
    ~*(?:UptimeRobot|Pingdom|StatusCake|Datadog) "monitoring";
    ~*(?:curl|wget|HTTPie) "cli_tool";
}

# ---------------------------------------------------------------------------
# Referer spam blocking
# ---------------------------------------------------------------------------
map $http_referer $is_bad_referer {
    default 0;
    ~*(?:semalt\.com|buttons-for-website|darodar\.com) 1;
    ~*(?:makemoneyonline|ilovevitaly|hulfingtonpost) 1;
    ~*(?:econom\.co|free-social-buttons|buy-cheap) 1;
}

# ---------------------------------------------------------------------------
# Gambling-specific endpoint protection
# ---------------------------------------------------------------------------
map $uri $gambling_endpoint_class {
    default "standard";
    ~^/api/v[0-9]+/auth "auth";
    ~^/api/v[0-9]+/bets "betting";
    ~^/api/v[0-9]+/register "registration";
    ~^/api/v[0-9]+/withdraw "financial";
    ~^/api/v[0-9]+/kyc "kyc";
    ~^/api/v[0-9]+/wallet "financial";
    ~^/api/v[0-9]+/bonus "bonus";
    ~^/api/v[0-9]+/odds "odds";
    ~^/api/v[0-9]+/games/launch "gaming";
}

