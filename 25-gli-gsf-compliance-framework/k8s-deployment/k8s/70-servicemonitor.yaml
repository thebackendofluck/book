apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gli-compliance-runner
  namespace: gli-compliance
  labels:
    app.kubernetes.io/name: gli-compliance-runner
    # Required by the kube-prometheus-stack Prometheus serviceMonitorSelector
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gli-compliance-runner
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - gli-compliance
