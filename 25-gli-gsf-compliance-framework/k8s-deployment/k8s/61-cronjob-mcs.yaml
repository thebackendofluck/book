apiVersion: batch/v1
kind: CronJob
metadata:
  name: gli-13-mcs-connector-probe
  namespace: gli-compliance
  labels:
    app.kubernetes.io/name: gli-compliance-runner
    gli-standard: GLI-13
spec:
  # GLI-13 v3.0 (2024) MCS connector liveness probe — every 5 minutes.
  # Hits the in-pod runner /healthz as a stub MCS for this proof-of-deploy. In a real
  # cluster the env vars below come from OpenBao and point at the regulator MCS.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        spec:
          serviceAccountName: gli-compliance
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mcs-probe
              image: registry.internal.example:5000/gli-compliance-runner:0.1.1
              imagePullPolicy: IfNotPresent
              command: ["bash"]
              args:
                - /app/scripts/chapter-25/gli-13/mcs-connector-test.sh
              env:
                # Stub host/port — these come from secret/gli-compliance/mcs in OpenBao
                # and are synced into the mcs-mtls Secret by the pre-deploy step. The
                # connector test script reads the certs from the mounted volume below.
                - name: MCS_HOST
                  valueFrom:
                    secretKeyRef:
                      name: mcs-mtls-runtime
                      key: host
                - name: MCS_PORT
                  valueFrom:
                    secretKeyRef:
                      name: mcs-mtls-runtime
                      key: port
                - name: MCS_CLIENT_CERT
                  value: /etc/mcs-mtls/client.crt
                - name: MCS_CLIENT_KEY
                  value: /etc/mcs-mtls/client.key
                - name: MCS_CA_BUNDLE
                  value: /etc/mcs-mtls/ca.crt
                - name: STALL_WINDOW_SEC
                  value: "999999"
              volumeMounts:
                - name: mcs-mtls
                  mountPath: /etc/mcs-mtls
                  readOnly: true
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits:   { cpu: "100m", memory: "128Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: mcs-mtls
              secret:
                secretName: mcs-mtls
                defaultMode: 0440
