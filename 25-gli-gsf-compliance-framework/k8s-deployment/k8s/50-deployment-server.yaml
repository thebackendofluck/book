apiVersion: apps/v1
kind: Deployment
metadata:
  name: gli-compliance-runner
  namespace: gli-compliance
  labels:
    app.kubernetes.io/name: gli-compliance-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gli-compliance-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gli-compliance-runner
    spec:
      serviceAccountName: gli-compliance
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: registry.internal.example:5000/gli-compliance-runner:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gli-compliance-runtime
          env:
            - name: JACKPOT_CONFIG
              value: /etc/gli/jackpot-config.json
            - name: JACKPOT_LEDGER
              value: /etc/gli/jackpot-ledger.csv
            - name: RECON_PROVIDER
              value: /etc/gli/provider.csv
            - name: RECON_OPERATOR
              value: /etc/gli/operator.csv
          volumeMounts:
            - name: stub-data
              mountPath: /etc/gli
              readOnly: true
            - name: evidence
              mountPath: /var/lib/gli-evidence
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: stub-data
          configMap:
            name: gli-compliance-stub-data
        - name: evidence
          persistentVolumeClaim:
            claimName: gli-evidence
        - name: tmp
          emptyDir: {}
