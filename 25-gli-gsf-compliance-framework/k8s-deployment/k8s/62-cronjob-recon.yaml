apiVersion: batch/v1
kind: CronJob
metadata:
  name: gli-16-wallet-reconciliation
  namespace: gli-compliance
  labels:
    app.kubernetes.io/name: gli-compliance-runner
    gli-standard: GLI-16
spec:
  # GLI-16 v3.0 (2024) cashless reconciliation — daily 03:00.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: gli-compliance
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recon
              image: registry.internal.example:5000/gli-compliance-runner:0.1.1
              imagePullPolicy: IfNotPresent
              command: ["python"]
              args:
                - /app/scripts/chapter-06/gli-16/wallet-reconciliation-check.py
                - --provider
                - /etc/gli/provider.csv
                - --operator
                - /etc/gli/operator.csv
                - --report
                - /var/lib/gli-evidence/recon-$(date +%F).json
              volumeMounts:
                - name: stub-data
                  mountPath: /etc/gli
                  readOnly: true
                - name: evidence
                  mountPath: /var/lib/gli-evidence
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: stub-data
              configMap:
                name: gli-compliance-stub-data
            - name: evidence
              persistentVolumeClaim:
                claimName: gli-evidence
