# =============================================================================
# Redis Configuration for RTC Timestamp Caching
# =============================================================================
# Optimized for sub-millisecond TTL operations in the RTC timestamp service.
#
# This configuration targets the specific access patterns of the RTC cache:
#   - High-frequency reads (10,000+ ops/s per game server)
#   - Short TTL values (100ms to 60s depending on data type)
#   - Small payloads (typically < 1KB per timestamp)
#   - Pub/Sub for anomaly notifications
#   - Distributed locking for consensus operations
#
# GLI-11 Note: Cached timestamps are ephemeral copies; the authoritative
# source is always the hardware RTC consensus. Cache misses fall through
# to the RTC service transparently.
#
# Deploy: redis-server /etc/redis/rtc-cache.conf
# =============================================================================

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# Bind to internal network only (never expose to public)
bind 10.50.0.0/16 127.0.0.1 ::1
port 6379

# Protected mode: require authentication
protected-mode yes
requirepass REPLACE_WITH_VAULT_SECRET

# TLS configuration for production
# tls-port 6380
# tls-cert-file /etc/redis/tls/redis.crt
# tls-key-file /etc/redis/tls/redis.key
# tls-ca-cert-file /etc/redis/tls/ca.crt
# tls-auth-clients optional
# tls-protocols "TLSv1.2 TLSv1.3"

# TCP keepalive (detect dead connections)
tcp-keepalive 60
tcp-backlog 511

# Maximum client connections
maxclients 10000

# Timeout for idle connections (0 = disabled for persistent game server connections)
timeout 0

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# Maximum memory allocation (adjust per deployment)
maxmemory 2gb

# Eviction policy: remove keys with shortest TTL first
# This ensures that stale timestamps are evicted before active ones
maxmemory-policy volatile-ttl

# Memory sampling for eviction decisions
maxmemory-samples 10

# Active defragmentation for long-running instances
activedefrag yes
active-defrag-enabled yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# RDB snapshots (for disaster recovery, not data integrity)
# The RTC cache can be fully reconstructed from hardware modules
save 3600 1
save 300 100

# RDB file configuration
dbfilename rtc-cache.rdb
dir /var/lib/redis/rtc

# Disable AOF (cache data is ephemeral)
appendonly no

# ---------------------------------------------------------------------------
# Performance Tuning
# ---------------------------------------------------------------------------
# Lazy freeing (non-blocking key deletion)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# I/O threads for multi-core utilization
io-threads 4
io-threads-do-reads yes

# Jemalloc background thread
jemalloc-bg-thread yes

# Disable slow operations that block the event loop
# RTC caching uses simple GET/SET/EXPIRE operations
latency-monitor-threshold 50

# ---------------------------------------------------------------------------
# Key Expiration
# ---------------------------------------------------------------------------
# Active expiration: percentage of CPU time to spend on key expiration
# Higher values reduce stale keys but increase CPU usage
hz 100

# Dynamic HZ: auto-adjust based on connected clients
dynamic-hz yes

# ---------------------------------------------------------------------------
# Pub/Sub Configuration
# ---------------------------------------------------------------------------
# Used for real-time anomaly notifications
# Game servers subscribe to rtc:anomalies channel

# Output buffer limits for pub/sub clients
# Hard limit: 32MB, Soft limit: 8MB for 60 seconds
client-output-buffer-limit pubsub 32mb 8mb 60

# Normal clients (game servers)
client-output-buffer-limit normal 0 0 0

# Replica clients
client-output-buffer-limit replica 256mb 64mb 60

# ---------------------------------------------------------------------------
# Lua Scripting
# ---------------------------------------------------------------------------
# Used for atomic consensus state updates
lua-time-limit 100

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
loglevel notice
logfile /var/log/redis/rtc-cache.log

# Slow log: capture commands taking more than 1ms
slowlog-log-slower-than 1000
slowlog-max-len 1024

# ---------------------------------------------------------------------------
# Cluster Configuration (for multi-node deployments)
# ---------------------------------------------------------------------------
# Uncomment for Redis Cluster mode
# cluster-enabled yes
# cluster-config-file nodes-rtc.conf
# cluster-node-timeout 5000
# cluster-require-full-coverage no
# cluster-allow-reads-when-down yes

# ---------------------------------------------------------------------------
# Replication (for HA deployments)
# ---------------------------------------------------------------------------
# Uncomment and configure for replica instances
# replicaof rtc-redis-primary 6379
# masterauth REPLACE_WITH_VAULT_SECRET

# Replica configuration
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 5

# ---------------------------------------------------------------------------
# Keyspace Notifications
# ---------------------------------------------------------------------------
# Enable keyspace notifications for expired key events
# Used by monitoring to track cache TTL behavior
notify-keyspace-events Ex

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "RTC_CONFIG_INTERNAL"

# ACL configuration (Redis 6+)
# Application user: limited to RTC key patterns
# user rtc-app on >REPLACE_WITH_APP_PASSWORD ~rtc:* &rtc:* +@read +@write +@pubsub +eval +evalsha -@admin -@dangerous
# Admin user: full access for operations
# user rtc-admin on >REPLACE_WITH_ADMIN_PASSWORD ~* &* +@all
