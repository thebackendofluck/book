##############################################################################
# Suricata Suppress Configuration - iGaming Platform
# Ongoing False Positive Management
#
# File: /etc/suricata/suppress.conf
#
# Purpose:
#   This file is the operational "living document" for false positive
#   management. Unlike threshold.conf (which tunes alert rates), this file
#   entirely silences specific rule+IP combinations that have been reviewed,
#   confirmed as false positives, and approved for suppression.
#
#   For each suppression added, document:
#     - Date added (YYYY-MM-DD)
#     - Reviewer initials / ITSM ticket reference
#     - Reason (why this is a confirmed false positive)
#     - Expiry review date (suppressions should be reviewed periodically)
#
# Usage:
#   This file is included by threshold.conf via the 'include' directive,
#   or referenced directly in suricata.yaml under detect.threshold-file.
#
#   To include this file from threshold.conf, add at the end of that file:
#     include /etc/suricata/suppress.conf
#
# WARNING:
#   Every suppression is a blind spot. An attacker who learns about suppressed
#   rules can exploit them to evade detection. Treat this file as a
#   security-sensitive document — restrict write access to the security team,
#   version-control it (Git), and review all changes in your change management
#   process.
#
# Syntax:
#   suppress gen_id <gid>, sig_id <sid>[, track <by_src|by_dst>, ip <addr>]
#
##############################################################################

##############################################################################
# CATEGORY 1: CDN AND REVERSE PROXY SUPPRESSIONS
#
# Suppressions for confirmed CDN IP ranges that produce persistent false
# positives on specific low-severity informational rules.
#
# Rule of thumb:
#   - NEVER suppress threat rules (malware, C2, exploit) for CDN IPs
#   - OK to suppress: informational POLICY rules about request rates,
#     user-agent anomalies, and header anomalies
#
# How to add a new CDN suppression:
#   1. Confirm the IP is in a published CDN range (check ASN + IP ranges doc)
#   2. Confirm the rule is generating confirmed false positives (verify in SIEM)
#   3. Add an entry below with date, ticket, reason, and review date
#   4. Submit a pull request for review by a second security engineer
##############################################################################

# Example CDN suppression (replace with your confirmed false positives):
#
# suppress gen_id 1, sig_id 2013028, track by_src, ip 104.16.0.0/13
# # Added: 2024-01-15 | Ticket: SECSUP-1042 | Reviewed by: JD
# # Reason: Cloudflare 104.16.0.0/13 triggers ET POLICY "HTTP User-Agent
# #         contains Unusual Characters" due to Cloudflare's health probe UA.
# # Expiry review: 2024-04-15

# ---- ADD CDN SUPPRESSIONS BELOW THIS LINE ----


# ---- END CDN SUPPRESSIONS ----

##############################################################################
# CATEGORY 2: PAYMENT PROCESSOR SUPPRESSIONS
#
# Suppressions for confirmed payment processor and banking partner IPs.
# These are machine-to-machine connections with predictable patterns that
# trigger rate and behaviour rules.
#
# Requirements before adding:
#   1. PSP must provide a signed document listing their IP ranges
#   2. Entry must reference the PSP name, contact, and document date
#   3. Approval from Head of Payments and CISO (or delegate)
#   4. Re-verify IP ranges every 6 months (PSPs change infrastructure)
#
# CRITICAL: Do NOT suppress any of the following rule categories for PSP IPs:
#   - SQL injection / command injection in payment payloads
#   - TLS certificate anomalies (could indicate MitM)
#   - Payload containing known malware signatures
##############################################################################

# Template for PSP suppression:
#
# suppress gen_id 1, sig_id <SID>, track by_src, ip <PSP_IP_RANGE>
# # PSP: <PSP Name>
# # Added: <YYYY-MM-DD> | Ticket: <ITSM-REF> | Reviewed by: <INITIALS>
# # IP range source: <PSP document reference, e.g., "Adyen IP Allowlist v2.3 dated 2024-01-01">
# # Reason: <e.g., "Adyen settlement callbacks trigger ET POLICY connection rate rule 2019401">
# # Expiry review: <YYYY-MM-DD — recommend 6 months>

# ---- ADD PAYMENT PROCESSOR SUPPRESSIONS BELOW THIS LINE ----


# ---- END PAYMENT PROCESSOR SUPPRESSIONS ----

##############################################################################
# CATEGORY 3: MONITORING AND AUTOMATION SUPPRESSIONS
#
# Suppressions for synthetic monitoring, load testing, and internal
# automation that intentionally mimics attack patterns.
#
# Includes:
#   - Datadog / New Relic / Pingdom synthetic checks
#   - Internal Selenium / Playwright end-to-end test runners
#   - Performance testing tools (k6, Gatling, JMeter)
#   - CI/CD pipeline integration test runners
#
# Segregate monitoring IPs into a dedicated subnet (e.g., 10.10.50.0/24)
# and suppress by subnet rather than individual IP for maintainability.
#
# Compensating controls required:
#   - Monitoring hosts must have EDR/FIM deployed
#   - Monitoring subnet must have egress ACLs (only to known destinations)
#   - Any deviation in monitoring host behaviour triggers a host-based alert
##############################################################################

# Example monitoring suppressions:
#
# suppress gen_id 1, sig_id 2002816, track by_src, ip 10.10.50.0/24
# # Added: 2024-01-15 | Ticket: SECSUP-1043 | Reviewed by: JD
# # Reason: Datadog synthetic login checks from 10.10.50.0/24 trigger
# #         ET WEB_SPECIFIC "Multiple Failed Logins" (SID 2002816) because
# #         synthetics test both success and failure flows in quick succession.
# # Compensating control: EDR on all hosts in 10.10.50.0/24 (CrowdStrike policy: MONITORING-TIER)
# # Expiry review: 2024-07-15

# ---- ADD MONITORING SUPPRESSIONS BELOW THIS LINE ----


# ---- END MONITORING SUPPRESSIONS ----

##############################################################################
# CATEGORY 4: GAMING-SPECIFIC SUPPRESSIONS
#
# Suppressions unique to the iGaming domain.
#
# Common scenarios:
#
# 4a. Sports data feed providers (Sportradar, Stats Perform, Genius Sports)
#     These providers establish persistent high-frequency connections to push
#     live event data. Their traffic volume and connection patterns trigger
#     many ET POLICY and custom API-rate rules.
#
# 4b. Live casino streaming providers (Evolution, Pragmatic Play, Playtech)
#     Video streaming CDN nodes generate sustained high-throughput flows
#     that may trigger DDoS and flood detection rules.
#
# 4c. RNG certification and audit connections (eCogra, BMM Testlabs, GLI)
#     Periodic connections from certification body servers during audits.
#
# 4d. B2B affiliate tracking platforms
#     Affiliate postback calls from networks like Income Access, Affiliate
#     Future, and similar generate automated callback traffic.
#
# Requirements before adding:
#   1. Confirm IP ranges with the third-party vendor's technical documentation
#   2. Verify ASN ownership matches the expected vendor
#   3. Approval from Head of Technology and Compliance Officer
#   4. Annual re-verification of IP ranges
##############################################################################

# Template for gaming-specific suppression:
#
# suppress gen_id 1, sig_id <SID>, track by_src, ip <VENDOR_IP_RANGE>
# # Vendor: <Vendor Name> | Service: <e.g., "Live odds feed">
# # Added: <YYYY-MM-DD> | Ticket: <ITSM-REF> | Reviewed by: <INITIALS>
# # Approved by: <Role, Name>
# # IP range source: <Document reference>
# # Reason: <Specific reason this rule fires on this vendor's traffic>
# # Expiry review: <YYYY-MM-DD — recommend 12 months>

# ---- ADD GAMING-SPECIFIC SUPPRESSIONS BELOW THIS LINE ----


# ---- END GAMING-SPECIFIC SUPPRESSIONS ----

##############################################################################
# CATEGORY 5: TEMPORARY / INCIDENT-RESPONSE SUPPRESSIONS
#
# Short-term suppressions added during incidents to reduce noise while
# investigating. These MUST have an explicit expiry date and MUST be
# removed within 72 hours unless escalated for permanent review.
#
# Process:
#   1. Security engineer adds suppression with INCIDENT ticket reference
#   2. SOC manager approves via ITSM
#   3. Automatic review ticket created for 72 hours later
#   4. Either remove the suppression or move it to the appropriate category above
#
# NEVER leave temporary suppressions in place indefinitely.
# Quarterly suppression audits should catch any stale entries here.
##############################################################################

# Template for temporary suppression:
#
# suppress gen_id 1, sig_id <SID>, track by_src, ip <IP_OR_RANGE>
# # TEMPORARY - Expires: <YYYY-MM-DD HH:MM UTC>
# # Incident: <INC-REF>
# # Added: <YYYY-MM-DD> | Added by: <INITIALS>
# # Reason: <Brief reason; reference incident ticket for details>
# # Action required: Review by <YYYY-MM-DD> — remove or promote to permanent category

# ---- ADD TEMPORARY SUPPRESSIONS BELOW THIS LINE ----


# ---- END TEMPORARY SUPPRESSIONS ----

