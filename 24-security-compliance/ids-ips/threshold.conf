##############################################################################
# Suricata Threshold & Suppress Configuration - iGaming Platform
#
# File: /etc/suricata/threshold.conf
# Referenced by suricata.yaml: detect.threshold-file
#
# Purpose:
#   This file controls how frequently Suricata fires alerts for matching rules
#   and which sources/destinations should be silenced to reduce false positives.
#
#   For iGaming operators, proper tuning of this file is critical because:
#     1. High-traffic events (World Cup, Super Bowl, major horse racing) cause
#        legitimate login and bet-placement spikes that mimic brute force.
#     2. Cloudflare and other CDN proxies appear as single IPs generating
#        enormous request volumes — normal for a CDN, not an attacker.
#     3. Payment processor IPs perform automated settlement reconciliation
#        that triggers transaction-frequency rules.
#     4. Synthetic monitoring continuously tests the platform, triggering
#        login, payment, and session rules.
#
# Syntax:
#   threshold   gen_id <gid>, sig_id <sid>, type <limit|threshold|both>,
#               track <by_src|by_dst|by_rule|by_both>, count <N>, seconds <N>
#
#   suppress    gen_id <gid>, sig_id <sid>[, track <by_src|by_dst>,
#               ip <address/cidr>]
#
# GID 1 = standard Suricata detection engine (most rules)
# GID 3 = Flowbits-based rules
#
# IMPORTANT: Test changes in a staging environment before deploying to
# production. Overly aggressive suppression can mask real attacks.
# Document every suppression with the date added and the reviewer's initials.
##############################################################################

##############################################################################
# SECTION A - Cloudflare CDN IP Ranges
#
# Why: Cloudflare proxies all HTTP/HTTPS traffic from a shared IP pool.
#      Rules that fire on request volume (e.g., ET rules for HTTP flood,
#      scanner detection) will constantly alert on Cloudflare IPs, generating
#      enormous false-positive volumes and drowning out real alerts.
#
# Cloudflare's published IPv4 ranges (as of 2024):
#   https://www.cloudflare.com/ips-v4
#
# NOTE: These suppressions apply only to specific signature categories.
#       Do NOT suppress all rules for Cloudflare IPs — you still want to
#       detect malicious payloads that Cloudflare passes through (e.g.,
#       SQLi, RCE in POST bodies, malicious file uploads).
#
# Review quarterly: Cloudflare may add new IP ranges.
# Script to refresh: curl -s https://www.cloudflare.com/ips-v4 > cf_ips.txt
##############################################################################

# ---------- Cloudflare IP Range: 103.21.244.0/22 ----------
# ET POLICY rules for HTTP scanner / user-agent anomalies
# Cloudflare uses automated health probes that trigger these
suppress gen_id 1, sig_id 2013028, track by_src, ip 103.21.244.0/22
suppress gen_id 1, sig_id 2013029, track by_src, ip 103.21.244.0/22
# ET WEB_SERVER HTTP flood detection
suppress gen_id 1, sig_id 2019401, track by_src, ip 103.21.244.0/22

