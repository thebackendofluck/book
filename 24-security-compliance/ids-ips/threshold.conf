# Triggers on some legitimate partner APIs — review and tune per your env
# suppress gen_id 1, sig_id 2014520

# ET INFO Outbound HTTP non-standard port
# Common with internal microservices on non-standard ports
suppress gen_id 1, sig_id 2010937, track by_src, ip 10.0.0.0/8
suppress gen_id 1, sig_id 2010937, track by_src, ip 172.16.0.0/12

# ET POLICY Reserved IP space (RFC 1918 internal)
suppress gen_id 1, sig_id 2001219, track by_src, ip 10.0.0.0/8
suppress gen_id 1, sig_id 2001219, track by_src, ip 172.16.0.0/12
suppress gen_id 1, sig_id 2001219, track by_src, ip 192.168.0.0/16

# ET POLICY ICMP echo request flood (load balancer health checks)
suppress gen_id 1, sig_id 2100408, track by_src, ip 10.0.0.0/8
suppress gen_id 1, sig_id 2100408, track by_src, ip 172.16.0.0/12

