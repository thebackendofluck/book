##############################################################################
# SECTION C - Login / Authentication Thresholds
#
# Why: Gaming platforms experience legitimate login surges during:
#       - Major sporting events (World Cup, Champions League finals)
#       - Casino jackpot promotions
#       - Deposit bonus periods
#
#      During these events, standard brute-force detection thresholds will
#      fire on the sheer volume of legitimate logins originating from CDN
#      proxy IPs (same source IP, thousands of users behind NAT).
#
# Strategy: Raise thresholds for CDN-proxied traffic; keep tight thresholds
#           for direct client IPs (mobile apps, desktop clients not via CDN).
#
# Adjust count and seconds based on your peak concurrency metrics.
# Recommended: review during post-event analysis each quarter.
##############################################################################

# ET WEB_SPECIFIC login brute force via POST (SID 2002816)
# Default: 5 attempts in 60s. During major events raise to 30 in 60s.
# Track by source IP to still catch concentrated attacks.
# Uncomment and adjust the threshold line appropriate to your event calendar:

# Standard threshold (apply outside major event windows)
threshold gen_id 1, sig_id 2002816, type threshold, track by_src, count 10, seconds 60

# High-traffic event threshold — enable during peak events, revert after
# threshold gen_id 1, sig_id 2002816, type threshold, track by_src, count 50, seconds 60

# ET WEB_SPECIFIC multiple failed logins (SID 2002036)
threshold gen_id 1, sig_id 2002036, type threshold, track by_src, count 15, seconds 60

# Custom iGaming login failure rule (adjust SID to match your igaming-account.rules)
# IGAMING-ACCT-001: Repeated failed account login
threshold gen_id 1, sig_id 9000001, type both, track by_src, count 10, seconds 30

# IGAMING-ACCT-002: Password reset request flood
threshold gen_id 1, sig_id 9000002, type threshold, track by_src, count 5, seconds 300

# IGAMING-API-001: Odds API scraping detection
# Allow legitimate odds comparison aggregators (bet365, Oddschecker) — they
# hit the API at high rates. Tune this based on your B2B partner agreements.
threshold gen_id 1, sig_id 9001001, type threshold, track by_src, count 100, seconds 60

# IGAMING-PAY-001: Card testing velocity (multiple card numbers, same IP)
# Keep this tight — legitimate users don't try 5 different cards in 60s
threshold gen_id 1, sig_id 9002001, type both, track by_src, count 3, seconds 60

##############################################################################
# SECTION D - Internal Monitoring / Synthetic Transaction IPs
#
# Why: Synthetic monitoring tools (Datadog Synthetics, Pingdom, New Relic,
#      internal Selenium/Playwright runners) constantly execute scripted
#      user journeys: login, deposit, bet placement, withdrawal, logout.
#      This activity perfectly mimics attack patterns and will flood your
#      SIEM with false positives from known-good internal hosts.
#
# Best practice: Use a dedicated monitoring subnet and suppress all
#                application-layer alerts from it. Continue monitoring
#                network-layer anomalies (DDoS, routing changes) from these IPs.
#
# IMPORTANT: If a monitoring host is compromised, this suppression masks it.
#            Ensure monitoring hosts have strict egress controls and host-based
#            monitoring (EDR/FIM) as a compensating control.
##############################################################################

# 10.10.50.0/24 - Synthetic monitoring / health-check subnet
# Suppress all application-layer rule categories from this range

# ET WEB_SERVER SQL injection
suppress gen_id 1, sig_id 2006445, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 2006446, track by_src, ip 10.10.50.0/24

# ET POLICY HTTP user-agent anomalies (Selenium/Playwright have unusual UAs)
suppress gen_id 1, sig_id 2013028, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 2013029, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 2013031, track by_src, ip 10.10.50.0/24

# ET WEB_SPECIFIC login/auth rules
suppress gen_id 1, sig_id 2002816, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 2002036, track by_src, ip 10.10.50.0/24

# iGaming custom rules - suppress all from monitoring subnet
suppress gen_id 1, sig_id 9000001, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 9000002, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 9001001, track by_src, ip 10.10.50.0/24
suppress gen_id 1, sig_id 9002001, track by_src, ip 10.10.50.0/24

