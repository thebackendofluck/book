##############################################################################
# SECTION F - AML and Compliance Rule Tuning
#
# Custom iGaming rules for AML/compliance monitoring.
# These are fine-tuned to catch genuine regulatory red flags without
# flooding the compliance team with low-value noise.
##############################################################################

# IGAMING-AML-001: Rapid large withdrawal pattern
# Alert once per player per 1-hour window (track by_dst to key on player's
# account endpoint; adjust if your API routing differs)
threshold gen_id 1, sig_id 9003001, type limit, track by_dst, count 1, seconds 3600

# IGAMING-AML-002: Multiple small deposits (structuring indicator)
# Alert after 5 occurrences in 24 hours from the same IP
threshold gen_id 1, sig_id 9003002, type threshold, track by_src, count 5, seconds 86400

# IGAMING-AML-003: Unusual country-of-origin for payment method
# Limit to 3 alerts per source in 4 hours to avoid noise from roaming players
threshold gen_id 1, sig_id 9003003, type limit, track by_src, count 3, seconds 14400

# IGAMING-COMPL-001: VPN/proxy detection evasion attempt
# Alert immediately; every instance is potentially reportable
# (no threshold — each event should be reviewed by compliance)

# IGAMING-COMPL-002: Restricted jurisdiction access attempt
# Alert on first attempt, then suppress for 1 hour per IP to avoid noise
# from persistent VPN users (compliance team follows up on SIEM dashboard)
threshold gen_id 1, sig_id 9004002, type limit, track by_src, count 1, seconds 3600

##############################################################################
# SECTION G - Low-signal Infrastructure Noise
#
# Suppress known-noisy low-severity rules that add volume without value
# in a typical iGaming production environment.
##############################################################################

