# roles/suricata/tasks/main.yml
# Orchestration entry point — includes task files in dependency order.

- name: Include installation tasks
  ansible.builtin.include_tasks: install.yml
  tags: [suricata, install]

- name: Include configuration tasks
  ansible.builtin.include_tasks: configure.yml
  tags: [suricata, configure]

- name: Include performance tuning tasks
  ansible.builtin.include_tasks: tuning.yml
  tags: [suricata, tuning]

- name: Include rule management tasks
  ansible.builtin.include_tasks: rules.yml
  tags: [suricata, rules]

- name: Include monitoring and health check tasks
  ansible.builtin.include_tasks: monitoring.yml
  tags: [suricata, monitoring]

- name: Include hardening tasks
  ansible.builtin.include_tasks: hardening.yml
  tags: [suricata, hardening]
