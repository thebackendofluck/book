# roles/suricata/handlers/main.yml
# Handlers are only executed when a task notifies them, and only once
# per play regardless of how many tasks fire the notification.

- name: restart suricata
  ansible.builtin.systemd:
    name: suricata
    state: restarted
    daemon_reload: true
  listen: restart suricata

- name: reload suricata rules
  # Send SIGUSR2 to trigger a hot rule reload without dropping packets.
  # Falls back to a restart if the PID file is missing (first deploy).
  ansible.builtin.shell: |
    if [ -f /var/run/suricata/suricata.pid ]; then
      kill -USR2 $(cat /var/run/suricata/suricata.pid)
    else
      systemctl restart suricata
    fi
  listen: reload suricata rules

- name: validate suricata config
  ansible.builtin.command: >
    suricata -T -c /etc/suricata/suricata.yaml -l /tmp
  register: validate_result
  changed_when: false
  failed_when: validate_result.rc != 0
  listen: validate suricata config

- name: apply sysctl settings
  ansible.builtin.command: sysctl --system
  listen: apply sysctl settings

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  listen: restart rsyslog
