# group_vars/vault.yml
# !! ENCRYPT THIS FILE with ansible-vault before committing to version control !!
#
#   ansible-vault encrypt group_vars/vault.yml
#   ansible-vault edit   group_vars/vault.yml
#   ansible-vault decrypt group_vars/vault.yml   # temporary; re-encrypt after
#
# Reference these variables in other var files as {{ vault_<name> }}.

# Emerging Threats Pro subscription oinkcode
vault_et_pro_oinkcode: "REPLACE_WITH_YOUR_ET_PRO_OINKCODE"

# Slack incoming webhook URL for operational notifications
vault_slack_webhook_url: "https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK"

# PagerDuty Events API v2 integration key (critical-severity alerts only)
vault_pagerduty_integration_key: "REPLACE_WITH_PAGERDUTY_KEY"

# Optional: GeoIP2 MaxMind license key (for geolocation in EVE JSON)
vault_maxmind_license_key: "REPLACE_WITH_MAXMIND_KEY"
