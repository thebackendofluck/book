# =============================================================================
# nginx geo-blocking configuration with GeoIP2 module
# =============================================================================
#
# Prerequisites:
#   apt-get install nginx libnginx-mod-http-geoip2
#   # Download MaxMind GeoLite2-Country database (free) or GeoIP2-Country (paid)
#   # https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
#
# Place this file at: /etc/nginx/conf.d/geo-blocking.conf
# Include from nginx.conf with: include /etc/nginx/conf.d/*.conf;
#
# Tested with: nginx 1.24+, ngx_http_geoip2_module 3.4+
# =============================================================================

# Load the GeoIP2 module (compiled as dynamic module on Ubuntu/Debian)
load_module modules/ngx_http_geoip2_module.so;

# =============================================================================
# GeoIP2 database configuration
# =============================================================================
geoip2 /var/lib/geoip2/GeoLite2-Country.mmdb {
    auto_reload 7d;                     # Reload DB weekly (MaxMind updates weekly)
    $geoip2_metadata_country_build  metadata build_epoch;
    $geoip2_data_country_code       default=XX source=$remote_addr country iso_code;
    $geoip2_data_country_name       default=Unknown source=$remote_addr country names en;
    $geoip2_data_continent_code     default=-- source=$remote_addr continent code;
    $geoip2_data_is_anonymous_proxy default=0 source=$remote_addr traits is_anonymous_proxy;
    $geoip2_data_is_satellite       default=0 source=$remote_addr traits is_satellite_provider;
}

# =============================================================================
# Jurisdiction block list
# Countries where online gambling is either totally prohibited or where
# the operator holds no license. Update this list to match your license portfolio.
#
# Sources consulted:
#   - UKGC licensees list: https://www.gamblingcommission.gov.uk/
#   - MGA registered operators: https://www.mga.org.mt/
#   - US Wire Act 18 U.S.C. § 1084 (federal prohibition on wire communications for sports wagering)
#   - Unlawful Internet Gambling Enforcement Act (UIGEA), 31 U.S.C. §§ 5361-5367
# =============================================================================
geo $blocked_country {
    default                 0;  # Allow by default; deny listed countries

    # ---- Complete prohibition jurisdictions ----
    # United Arab Emirates: Federal Law No. 6 of 2018 (UAE Gambling Law)
    AE                      1;
    # Saudi Arabia: Royal Decree M/33 (Anti-Cybercrime Law) + Islamic law
    SA                      1;
    # Qatar: Law No. 14 of 2014 (Qatar Anti-Gambling Law)
    QA                      1;
    # Kuwait: Law No. 31 of 1970
    KW                      1;
    # Bahrain: Decree-Law No. 15 of 1976
    BH                      1;
    # Oman: Penal Code Article 263
    OM                      1;
    # Yemen: Islamic law provisions in the Penal Code
    YE                      1;
    # Libya: Penal Code Chapter 4
    LY                      1;
    # Sudan: Gambling Act 1974 + Sharia codification 1983
    SD                      1;
    # Mainland China: Criminal Law Article 303 + Regulations on the Prohibition of Gambling 2000
    CN                      1;
    # North Korea: complete prohibition, no legal framework for private gambling
    KP                      1;
    # Cambodia: Sub-Decree No. 176 (2019) prohibiting online gambling
    KH                      1;
    # Algeria: Ordinance No. 75-58 Article 395
    DZ                      1;
    # Morocco: Dahir of 12 Hija 1342 (gambling code) as amended
    MA                      1;
    # Pakistan: Prevention of Gambling Act 1977
    PK                      1;
    # Bangladesh: Public Gambling Act 1867 (inherited British legislation)
    BD                      1;
    # Afghanistan: Penal Code Article 277 + Taliban decree 2021
    AF                      1;
    # Iraq: Penal Code No. 111 of 1969, Articles 388-394
    IQ                      1;
    # Iran: Islamic Penal Code, Chapter 20
    IR                      1;

    # ---- Jurisdictions where operator holds no license ----
    # Add country codes here for markets you are not licensed to serve
    # Example: US (add state-level blocking at application layer -- see geoip-middleware.py)
    # US                    1;
}

# Map for X-Forwarded-For / CloudFront country header support
# When behind CloudFront, use CloudFront-Viewer-Country header instead of GeoIP
map $http_cloudfront_viewer_country $cf_blocked_country {
    default 0;
    AE      1;
    SA      1;
    QA      1;
    KW      1;
    BH      1;
    OM      1;
    YE      1;
    LY      1;
    SD      1;
    CN      1;
    KP      1;
    KH      1;
    DZ      1;
    MA      1;
    PK      1;
    BD      1;
    AF      1;
    IQ      1;
    IR      1;
}

# Combine both GeoIP and CloudFront signals
map "$blocked_country$cf_blocked_country" $access_blocked {
    default  0;
    "~1"     1;   # Block if either signal is 1
}

# =============================================================================
# Rate limiting zones
# =============================================================================
limit_req_zone $binary_remote_addr zone=geo_block_log:10m rate=1r/s;

# =============================================================================
# HTTP server: redirect to HTTPS
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Main HTTPS server block
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name casino.example.com www.casino.example.com;

    # TLS configuration
    ssl_certificate     /etc/ssl/certs/casino.example.com.crt;
    ssl_certificate_key /etc/ssl/private/casino.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Pass geolocation metadata downstream for application-layer checks
    add_header X-GeoIP-Country-Code  $geoip2_data_country_code always;
    add_header X-GeoIP-Country-Name  $geoip2_data_country_name always;
    add_header X-GeoIP-Continent     $geoip2_data_continent_code always;

    # Pass to upstream as request headers
    proxy_set_header X-Real-IP              $remote_addr;
    proxy_set_header X-Forwarded-For        $proxy_add_x_forwarded_for;
    proxy_set_header X-GeoIP-Country        $geoip2_data_country_code;
    proxy_set_header X-GeoIP-Country-Name   $geoip2_data_country_name;
    proxy_set_header X-GeoIP-Continent      $geoip2_data_continent_code;
    proxy_set_header X-Is-Anonymous-Proxy   $geoip2_data_is_anonymous_proxy;

    # -------------------------------------------------------------------
    # GEO-BLOCKING: evaluate before any other routing
    # -------------------------------------------------------------------
    if ($access_blocked = 1) {
        # Log the block event (regulatory audit requirement)
        access_log /var/log/nginx/geo_blocked.log geo_block_format;

        # Return a static compliance page; do NOT redirect to a 3rd party URL
        # (some regulators require you to display a specific notice)
        return 451 '{"error":"access_restricted","message":"This service is not available in your jurisdiction.","code":"GEO_BLOCK","country":"$geoip2_data_country_code"}';
    }

    # Block anonymous proxies and satellite ISPs at the edge
    # These are high-risk signals for geo-circumvention attempts
    if ($geoip2_data_is_anonymous_proxy = 1) {
        access_log /var/log/nginx/geo_blocked.log geo_block_format;
        return 403 '{"error":"proxy_detected","message":"Proxy/VPN connections are not permitted.","code":"PROXY_BLOCK"}';
    }

    # Root and static assets
    root   /var/www/casino/public;
    index  index.html;

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass         http://casino_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API endpoints: stricter geo enforcement + rate limiting
    location /api/ {
        if ($access_blocked = 1) {
            return 451 '{"error":"access_restricted","code":"GEO_BLOCK","country":"$geoip2_data_country_code"}';
        }

        proxy_pass http://casino_backend;
    }

    # Compliance/block notice endpoint — always accessible regardless of geo
    location /blocked {
        root  /var/www/casino/public;
        try_files /blocked.html =404;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # Health check — accessible globally (load balancer probes)
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# =============================================================================
# Upstream backend pool
# =============================================================================
upstream casino_backend {
    least_conn;
    server 10.0.1.10:8080 weight=5;
    server 10.0.1.11:8080 weight=5;
    server 10.0.1.12:8080 weight=5 backup;
    keepalive 64;
}

# =============================================================================
# Geo-block audit log format
# Captured fields are required for regulatory audit trails.
# Format: timestamp | remote_ip | country_code | country_name | requested_uri | user_agent
# =============================================================================
log_format geo_block_format
    '$time_iso8601 '
    'remote_addr=$remote_addr '
    'country=$geoip2_data_country_code '
    'country_name="$geoip2_data_country_name" '
    'uri="$request_uri" '
    'method=$request_method '
    'status=$status '
    'is_anon_proxy=$geoip2_data_is_anonymous_proxy '
    'user_agent="$http_user_agent" '
    'referer="$http_referer"';
