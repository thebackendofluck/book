# WireGuard VPN configuration — inter-datacenter tunnel
#
# Establishes an encrypted overlay network between the NJ (New Jersey) and
# PA (Pennsylvania) Continent 8 datacenters and the central DevOps bastion
# host at the Isle of Man C8 facility.
#
# Topology:
#   10.200.0.1/24  — Isle of Man C8 (DevOps bastion / hub)
#   10.200.0.2/24  — New Jersey C8 (nj-platform.live.acmetocasino.com)
#   10.200.0.3/24  — Pennsylvania C8 (pa-platform.live.acmetocasino.com)
#   10.200.0.10/24 — Development jump box
#
# This file ships with the NJ production node configuration.
# Replace [REPLACE_WITH_NJ_PRIVATE_KEY] with the output of:
#   wg genkey | tee nj-private.key | wg pubkey
# Store the private key in HashiCorp Vault, NOT on disk.
#
# Reference: Chapter 24 — Security and Compliance / Network Encryption
#            Chapter 20 — HSM Infrastructure / WireGuard mTLS setup
#
# Regulatory note: Inter-jurisdiction traffic between NJ and PA must remain
# encrypted at all times per DGE and PGCB data residency requirements.
# WireGuard ChaCha20-Poly1305 satisfies NIST SP 800-52 Rev 2 requirements.

[Interface]
# NJ production node — 10.200.0.2
Address = 10.200.0.2/24
PrivateKey = [REPLACE_WITH_NJ_PRIVATE_KEY]
ListenPort = 51820
DNS = 10.200.0.1

# Kernel routing: send inter-datacenter traffic via the WireGuard tunnel
PreUp   = sysctl -w net.ipv4.ip_forward=1
PostUp  = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Minimal MTU for inter-datacenter traffic (1420 avoids fragmentation over
# standard Ethernet links with WireGuard header overhead)
MTU = 1420

# Save peer configuration on wg-quick down (disable in prod — use Vault)
SaveConfig = false

# ---------------------------------------------------------------------------
# Peer: Isle of Man C8 — DevOps bastion and hub node
# ---------------------------------------------------------------------------
[Peer]
PublicKey = [REPLACE_WITH_IOM_PUBLIC_KEY]
# Hub endpoint — replace with the actual IOM C8 public IP
Endpoint = 203.0.113.137:51820
# Allow all VPN subnet traffic plus management CIDR
AllowedIPs = 10.200.0.0/24, 192.168.200.0/24
# Send a keepalive every 25 seconds to maintain NAT mappings
PersistentKeepalive = 25

# ---------------------------------------------------------------------------
# Peer: Pennsylvania C8 — pa-platform.live.acmetocasino.com
# ---------------------------------------------------------------------------
[Peer]
PublicKey = [REPLACE_WITH_PA_PUBLIC_KEY]
# PA C8 public IP — replace with actual value
Endpoint = 203.0.113.136:51820
# Only route PA VPN address and PA internal CIDR through this peer
AllowedIPs = 10.200.0.3/32, 10.10.3.0/24
PersistentKeepalive = 25

# ---------------------------------------------------------------------------
# Peer: Development jump box (optional — disable in strict prod)
# ---------------------------------------------------------------------------
# [Peer]
# PublicKey = [REPLACE_WITH_DEVJUMP_PUBLIC_KEY]
# AllowedIPs = 10.200.0.10/32
# PersistentKeepalive = 25
