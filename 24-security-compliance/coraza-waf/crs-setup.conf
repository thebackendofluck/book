# =============================================================================
# OWASP CRS Setup Configuration — iGaming Platform
# =============================================================================
# This file is a customised version of the CRS crs-setup.conf.example.
# Do not replace it by copying the upstream example — the iGaming exclusions
# below are deliberate.
#
# Reference: https://coreruleset.org/docs/
# =============================================================================

# -----------------------------------------------------------------------------
# Anomaly Scoring Mode (recommended over traditional mode)
# -----------------------------------------------------------------------------
# In anomaly scoring mode, each matched rule adds to the request's score
# rather than blocking immediately. The request is only blocked if the total
# score exceeds the inbound threshold. This dramatically reduces false
# positives compared to traditional "block on first match" mode.

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Inbound anomaly threshold:
# Score at which an inbound request is blocked.
# Default: 5 (one critical-severity rule hit, or five low-severity hits).
# Recommended starting value for a new deployment: 10 (more permissive).
# Tighten to 5 after two weeks of tuning.
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.inbound_anomaly_score_threshold=5"

# Outbound anomaly threshold: score at which a response is blocked.
# We have SecResponseBodyAccess Off, so this only fires on response headers.
SecAction \
    "id:900120,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.outbound_anomaly_score_threshold=4"

# -----------------------------------------------------------------------------
# Paranoia Level
# -----------------------------------------------------------------------------
# PL1 — Essential protection, very low false positives. Start here.
# PL2 — More rules, minor false positives. Move here after 2 weeks of PL1.
# PL3 — Aggressive; requires significant tuning for most applications.
# PL4 — Maximum coverage; not recommended for production without deep tuning.
#
# To change: update the value below AND update crs-setup.conf in the container.
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.paranoia_level=1"

# Executing paranoia level (can be higher than paranoia_level during testing):
SecAction \
    "id:900001,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.executing_paranoia_level=1"

# -----------------------------------------------------------------------------
# HTTP Policy
# -----------------------------------------------------------------------------

# Allowed HTTP methods. Remove TRACE and TRACK (legacy debug methods).
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Allowed request content types
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/jsonp| |application/x-amf| |application/octet-stream| |application/csp-report| |application/xss-auditor-report| |text/plain|'"

# Allowed HTTP versions
SecAction \
    "id:900230,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# Restricted request headers (headers that should NEVER appear in legitimate requests)
SecAction \
    "id:900240,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:'tx.restricted_headers=/proxy/ /lock-token/ /content-range/ /if/'"

# -----------------------------------------------------------------------------
# Request Body Settings
# -----------------------------------------------------------------------------

# Max number of files in a multipart upload
SecAction \
    "id:900300,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.max_num_args=512"

# Max length of a single argument name
SecAction \
    "id:900310,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.arg_name_length=150"

# Max length of a single argument value (game state blobs can be large)
SecAction \
    "id:900320,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.arg_length=8192"

# Max total combined size of all arguments
SecAction \
    "id:900330,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.total_arg_length=131072"

# Max file upload size (before the per-endpoint overrides in coraza.conf)
SecAction \
    "id:900340,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.max_file_size=1048576"

# Max total size of all uploaded files
SecAction \
    "id:900350,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.combined_file_sizes=1048576"

# -----------------------------------------------------------------------------
# Sampling Percentage (useful during initial rollout)
# -----------------------------------------------------------------------------
# Set to 100 in production. During initial rollout you can set this to a lower
# value (e.g. 10) to apply WAF rules to only 10% of traffic while you tune.
SecAction \
    "id:900400,\
    phase:1,\
    pass,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    setvar:tx.sampling_percentage=100"

# -----------------------------------------------------------------------------
# Known False Positive Exclusions — iGaming specific
# -----------------------------------------------------------------------------
# These are CRS rule exclusions for patterns that are common in iGaming
# platforms but trigger false positives. Each exclusion is documented.
#
# Format: SecRuleUpdateTargetById <rule_id> "!ARGS:<param>"
# This removes a specific argument from a specific rule's target list.

# Game round IDs often look like hex strings — disable hex encoding check for them
SecRuleUpdateTargetById 920120 "!ARGS:round_id"
SecRuleUpdateTargetById 920120 "!ARGS:session_id"
SecRuleUpdateTargetById 920120 "!ARGS:game_id"

# Bonus code fields — discount codes can contain special chars
SecRuleUpdateTargetById 942430 "!ARGS:bonus_code"
SecRuleUpdateTargetById 942431 "!ARGS:promo_code"

# Player search fields — names with apostrophes (O'Brien) trigger SQLi rules
SecRuleUpdateTargetById 942100 "!ARGS:player_name"
SecRuleUpdateTargetById 942100 "!ARGS:search_query"

# Chat messages in live casino — contain arbitrary text
SecRuleUpdateTargetById 941100 "!ARGS:chat_message"
SecRuleUpdateTargetById 941160 "!ARGS:chat_message"

# Payment reference fields — may contain bank-generated strings with SQL-like chars
SecRuleUpdateTargetById 942200 "!ARGS:payment_reference"
SecRuleUpdateTargetById 942260 "!ARGS:payment_reference"

# -----------------------------------------------------------------------------
# End of CRS setup
# -----------------------------------------------------------------------------
