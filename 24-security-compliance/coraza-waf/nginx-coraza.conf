# =============================================================================
# nginx-coraza.conf — Base nginx configuration with ModSecurity/Coraza WAF
# =============================================================================
#
# This file replaces /etc/nginx/nginx.conf inside the nginx-coraza Docker image.
# It can also be used on bare-metal by adding the load_module line to the
# existing /etc/nginx/nginx.conf.
#
# For bare-metal usage, add only these lines to your existing nginx.conf:
#
#   # At the TOP of nginx.conf (before events{} block):
#   load_module modules/ngx_http_modsecurity_module.so;
#
#   # Inside the http{} block:
#   modsecurity on;
#   modsecurity_rules_file /etc/nginx/coraza/coraza.conf;
#
# =============================================================================

# Load the WAF module — must be at the top level, before any block
load_module modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens  off;

    # -------------------------------------------------------------------------
    # Coraza WAF (via ModSecurity v3 nginx module)
    # -------------------------------------------------------------------------
    # Enable globally. Individual server{} or location{} blocks can override:
    #   modsecurity off;   — disable for a specific location
    # -------------------------------------------------------------------------
    modsecurity on;
    modsecurity_rules_file /etc/nginx/coraza/coraza.conf;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers (applied globally; override per server block as needed)
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Health check endpoint — bypasses WAF inspection
    # Matches the HEALTHCHECK instruction in Dockerfile.nginx-coraza.
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # WAF health probe — always respond 200, no WAF inspection
        location = /health {
            modsecurity off;
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Default: load site-specific configs from conf.d
        # In Docker, mount your site config at /etc/nginx/conf.d/default.conf
        include /etc/nginx/conf.d/*.conf;
    }
}
