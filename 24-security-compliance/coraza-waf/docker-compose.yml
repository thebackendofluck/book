# =============================================================================
# docker-compose.yml — WAF-enabled nginx (nginx-coraza image)
# =============================================================================
#
# Replaces the previous docker-compose.coraza.yml (Caddy sidecar approach).
#
# Architecture:
#   Internet → nginx-coraza (:80/:443)
#               └─► ModSecurity v3 WAF (inline, same nginx process)
#                    └─► upstream handlers / static files
#
# No sidecar. No Caddy. No iptables redirects. One container.
#
# Usage:
#   # Build the image (first time or after changing Dockerfile):
#   docker build -f Dockerfile.nginx-coraza -t nginx-coraza:1.27.4 .
#
#   # Start:
#   docker compose up -d
#
#   # Tail WAF audit log:
#   docker compose exec nginx-coraza tail -f /var/log/coraza/audit.log
#
#   # Test:
#   ./test-coraza.sh localhost 80
#
# To use as a drop-in in other docker-compose files in this book:
#   Replace:  image: nginx:latest
#   With:     image: nginx-coraza:1.27.4
#   Keep:     the security_opt, cap_drop, read_only, tmpfs sections below
#
# =============================================================================

networks:
  # User-defined bridge network — containers can reach each other by name.
  # Do NOT use the default bridge (CIS 5.29).
  frontend:
    driver: bridge

services:
  nginx-coraza:
    build:
      context: .
      dockerfile: Dockerfile.nginx-coraza
      args:
        NGINX_VERSION: "1.27.4"
        CRS_VERSION: "4.7.0"
    image: nginx-coraza:1.27.4
    container_name: nginx-coraza
    restart: unless-stopped

    networks:
      - frontend

    ports:
      # Bind only to localhost on dev; remove the 127.0.0.1: prefix on production
      # where a load balancer or Cloudflare hits this directly.
      - "127.0.0.1:80:80"
      # Uncomment if terminating TLS in this container:
      # - "127.0.0.1:443:443"

    volumes:
      # WAF configuration — bind-mount to override the baked-in defaults
      - ./coraza.conf:/etc/nginx/coraza/coraza.conf:ro
      - ./crs-setup.conf:/etc/nginx/coraza/crs/crs-setup.conf:ro
      - ./crs-rules:/etc/nginx/coraza/crs/rules:ro

      # Site configuration — add your server block here
      # - ./your-site.conf:/etc/nginx/conf.d/default.conf:ro

      # TLS certificates (if terminating SSL here)
      # - /etc/letsencrypt:/etc/letsencrypt:ro

      # Persistent WAF audit log (writable named volume)
      - coraza-logs:/var/log/coraza

      # Persistent nginx access/error logs
      - nginx-logs:/var/log/nginx

    # -------------------------------------------------------------------------
    # Security hardening (CIS Docker Benchmark)
    # -------------------------------------------------------------------------

    # CIS 5.25 / 4.5: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
      # Optionally enable AppArmor profile (CIS 5.2):
      # - apparmor:nginx-coraza

    # CIS 5.12: Read-only root filesystem
    # Runtime directories that nginx writes to are mounted as tmpfs below.
    read_only: true

    # tmpfs for nginx runtime directories (required when read_only: true)
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /var/run/nginx:mode=0755,uid=101,gid=101

    # CIS 4.1: Container runs as UID 101 (nginx) — set in Dockerfile USER nginx
    user: "101:101"

    # CIS 5.x: Drop all Linux capabilities; add back only what nginx needs
    cap_drop:
      - ALL
    cap_add:
      # Required to bind ports < 1024 (80/443) as non-root
      - NET_BIND_SERVICE

    # No privileged mode (CIS 5.4)
    # privileged: false  # false is already the default

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Resource limits (CIS 5.10 / prevents runaway memory on attack traffic)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  coraza-logs:
    driver: local
  nginx-logs:
    driver: local
