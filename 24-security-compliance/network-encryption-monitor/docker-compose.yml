version: "3.8"

services:
  encryption-monitor:
    build: .
    container_name: encryption-monitor
    network_mode: host          # Required for raw packet capture
    privileged: true            # Required for libpcap access
    environment:
      - MIKROTIK_HOST=${MIKROTIK_HOST:-}
      - MIKROTIK_USER=${MIKROTIK_USER:-}
      - MIKROTIK_PASS=${MIKROTIK_PASS:-}
      - MERAKI_API_KEY=${MERAKI_API_KEY:-}
      - MERAKI_NETWORK_ID=${MERAKI_NETWORK_ID:-}
    command: >
      python monitor.py --interface eth0
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
