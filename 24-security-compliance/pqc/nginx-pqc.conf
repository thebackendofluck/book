# nginx-pqc.conf
# Nginx SSL configuration with Post-Quantum Cryptography (PQC) hybrid cipher suites
# Chapter 24g: Post-Quantum Cryptography for iGaming
#
# Prerequisites:
#   - Nginx built with OQS provider (liboqs): https://github.com/open-quantum-safe/oqs-provider
#   - OpenSSL 3.x with oqs-provider loaded
#   - Certificate issued by a CA supporting hybrid algorithms (or classical cert for interop)
#
# Tested with: nginx/1.25+ + openssl 3.x + oqs-provider 0.6+

# ------------------------------------------------------------------
# HTTP → HTTPS redirect
# ------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Permanent redirect; HSTS picks up from there
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------
# Main HTTPS server block
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name igaming.example.com;

    # ------------------------------------------------------------------
    # Certificate chain
    # ------------------------------------------------------------------
    # Use a hybrid or classical certificate.  For PQC-hybrid issuance see
    # step-ca-pqc-setup.sh in this directory.
    ssl_certificate     /etc/nginx/ssl/igaming.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/igaming.example.com.key.pem;

    # ------------------------------------------------------------------
    # Protocol versions
    # Only TLS 1.2 and 1.3 are permitted.
    # TLS 1.3 is required for the PQC key-exchange extensions (RFC 8446 §4.2.7).
    # TLS 1.0 / 1.1 are disabled – they pre-date the extension mechanism that
    # carries ML-KEM key shares and are forbidden by PCI-DSS 4.0.
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;

    # ------------------------------------------------------------------
    # TLS 1.3 named groups (key-exchange curves) – ordered by preference
    #
    # X25519Kyber768Draft00 (OID 1.3.9999.999.1):
    #   NIST-PQC finalist ML-KEM-768 hybridised with X25519.
    #   Largest ClientHello key_share (~1232 bytes extra), but provides
    #   harvest-now-decrypt-later protection for session keys.
    #   Chrome ≥124, Firefox ≥132, Cloudflare, AWS support this group.
    #
    # x25519mlkem768 (final IETF name after FIPS 203 publication):
    #   The standardised name; include both during the transition period.
    #
    # X25519:
    #   Classical fallback for clients that don't support PQC groups.
    #   Still provides 128-bit classical security.
    #
    # secp384r1:
    #   ECDH P-384 as a secondary classical fallback; satisfies
    #   some regulatory requirements that mandate 192-bit-equivalent.
    # ------------------------------------------------------------------
    ssl_ecdh_curve X25519Kyber768Draft00:x25519mlkem768:X25519:secp384r1;

    # ------------------------------------------------------------------
    # TLS 1.3 cipher suites
    # In TLS 1.3 the cipher suite only specifies AEAD + HKDF hash; the
    # key-exchange algorithm is determined by the named group above.
    #
    # AES-256-GCM-SHA384  – primary; FIPS-approved, 256-bit key
    # CHACHA20-POLY1305-SHA256 – preferred on hardware without AES-NI
    # AES-128-GCM-SHA256  – fallback for constrained clients
    # ------------------------------------------------------------------
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    # ------------------------------------------------------------------
    # TLS 1.2 cipher suites (classical fallback only)
    # PQC key exchange is NOT available in TLS 1.2; these are kept for
    # legacy compatibility while the estate migrates.
    # Use server preference to enforce ordering.
    # ------------------------------------------------------------------
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # ------------------------------------------------------------------
    # Session cache and tickets
    #
    # PQC handshakes are ~20-50 ms more expensive than classical ECDH due
    # to the larger ML-KEM key material (1184-byte public key, 1088-byte
    # ciphertext for ML-KEM-768).  Aggressive session reuse is therefore
    # more important than in classical deployments.
    #
    # ssl_session_cache:
    #   shared:SSL:50m   – 50 MB shared cache; ~200,000 sessions.
    #   Sized up from the typical 10 MB to absorb the larger session
    #   metadata associated with PQC key shares.
    #
    # ssl_session_timeout:
    #   5m recommended for forward-secrecy; increase to 10-15m if your
    #   telemetry shows excessive full-handshake rates.
    #
    # ssl_session_tickets:
    #   off – session tickets can undermine forward secrecy because the
    #   ticket-encryption key persists.  Disable unless your load-balancer
    #   performs centralised ticket-key rotation every 1 h.
    # ------------------------------------------------------------------
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # OCSP stapling
    # Reduces per-connection latency by bundling the OCSP response in the
    # TLS handshake.  Especially important with PQC since the handshake is
    # already heavier; an extra round-trip to the CA OCSP responder would
    # compound the overhead.
    # ------------------------------------------------------------------
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Trusted CA bundle used to verify the OCSP response signature
    ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.pem;

    # OCSP responder DNS resolver (use your internal resolver if on a
    # private network; 1.1.1.1 is Cloudflare's public resolver)
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS)
    # max-age=31536000  → 1 year
    # includeSubDomains → covers api.igaming.example.com etc.
    # preload           → eligible for browser preload lists
    #
    # Do NOT set this header until you are certain all sub-domains are on
    # HTTPS; once a browser receives it, HTTP connections fail for the
    # entire domain for 1 year.
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ------------------------------------------------------------------
    # Additional security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

    # ------------------------------------------------------------------
    # TLS record size optimisation for PQC
    #
    # PQC key shares inflate the ClientHello and ServerHello records
    # significantly (ML-KEM-768 adds ~2.3 KB to the handshake).
    # Setting ssl_buffer_size to 4k (instead of the default 16k) causes
    # nginx to send smaller TLS records, improving time-to-first-byte for
    # the HTTP response payload while slightly increasing CPU cost.
    # Use 16k for bulk-download endpoints (e.g. game asset CDN origins).
    # ------------------------------------------------------------------
    ssl_buffer_size 4k;

    # ------------------------------------------------------------------
    # Application proxy (adjust upstream block below)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://igaming_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Longer read timeout: PQC handshakes on slow CPUs can push
        # initial connect time beyond the default 60 s on very busy
        # servers.  15 s is conservative; monitor and tune.
        proxy_connect_timeout 15s;
        proxy_read_timeout    90s;
    }

    # Health-check endpoint (no auth required by load balancer)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ------------------------------------------------------------------
# Upstream backend pool
# ------------------------------------------------------------------
upstream igaming_backend {
    # Keepalive to backend – reduces TCP overhead on the server side
    keepalive 64;

    server 10.0.1.10:8080;
    server 10.0.1.11:8080;
    server 10.0.1.12:8080;
}
