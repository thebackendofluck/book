# Drop-in nginx snippet for thebackendofluck.com server block.
# Adds /api/regulator-reports/* reverse-proxy to the FastAPI container.
#
# Install:
#   1. Append the contents of this file to /etc/nginx/sites-available/thebackendofluck.com
#      INSIDE the existing `server { ... }` block (the one with listen 443 ssl).
#   2. nginx -t && systemctl reload nginx
#
# Same-origin → no CORS preflight; fits the existing CSP `connect-src 'self'`.

    location /api/regulator-reports/ {
        proxy_pass http://127.0.0.1:8200/api/regulator-reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # API is already cached by Redis, but a tiny edge cache hint helps repeat
        # client renders (the dashboard fetches three endpoints in parallel).
        add_header Cache-Control "public, max-age=60" always;
    }
