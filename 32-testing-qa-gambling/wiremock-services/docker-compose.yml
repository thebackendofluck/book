version: "3.8"
services:
  wiremock:
    image: "holomekc/wiremock-gui:3.9.1"
    container_name: wiremock
    ports:
      - "127.0.0.1:8098:8098"
      - "127.0.0.1:8099:8099"
    volumes:
      - .:/home/wiremock/storage
    environment:
      WIREMOCK_OPTIONS: "--port=8099,--https-port=8098,--global-response-templating,--root-dir=/home/wiremock/storage,--container-threads=50,--jetty-acceptor-threads=10,--async-response-enabled=true,--async-response-threads=50,--max-request-journal-entries=1000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
