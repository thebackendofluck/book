apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-schemas
  namespace: load-testing
  labels:
    app: locust
    version: v2
data:
  aggressive.yaml: |
    type: aggressive
    events:
      register:
        profile:
          average_wait: 15
        transitions:
          login: 1.0
      place_bet:
        profile:
          average_wait: 90
          sports:
            basketball: 0.7
            ice_hockey: 0.2
            ufc_mma: 0.1
          bet_types:
            moneyline: 0.6
            over_under: 0.3
            spread: 0.1
        transitions:
          place_bet: 0.4
          logout: 0.2
          get_balance: 0.4
  casual.yaml: |
    type: casual
    events:
      register:
        profile:
          average_wait: 30
        transitions:
          login: 1.0
      place_bet:
        profile:
          average_wait: 180
          sports:
            basketball: 0.8
            football: 0.1
            baseball: 0.1
          bet_types:
            moneyline: 0.7
            over_under: 0.2
            spread: 0.1
        transitions:
          place_bet: 0.2
          logout: 0.3
          get_homepage: 0.5