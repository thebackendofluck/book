type: peruser
events:
  register:
    profile:
      average_wait: 2
      url: /users/register/
    transitions:
      login: 1
  login:
    profile:
      average_wait: 1
      url: /users/login/
    transitions:
      get_config: 1
  
  get_config:
    profile:
      url: /main/config/
      average_wait: 0
    transitions: 
      get_profile: 1

  get_profile:
    profile:
      url: /users/profile/
      average_wait: 0
    transitions:
      logout: 0.2
      login: 0.8     

  logout:
    profile:
      average_wait: 0
    transitions:
      logout: 1
