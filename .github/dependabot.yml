        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories: ["**/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "go"]
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-security:
        applies-to: security-updates
