# Telegraf Configuration - Hardware Monitoring Stack - Chapter 23: Operational Playbooks
#
# Data collection agent that pulls Docker container metrics, procstat process
# metrics, and network interface statistics, then forwards them to both
# InfluxDB (time-series storage) and Elasticsearch (log/search storage).
#
# A custom Starlark processor calculates a composite risk score from
# age_days, error_count, and wear_level, and tags each metric with
# a risk_level (critical / high / medium / low).
#
# Key configuration:
#   Agent interval:       30s collection, 10s flush
#   InfluxDB:             igaming org, hardware_metrics bucket, token auth
#   Elasticsearch:        daily rolling index hardware-metrics-%Y.%m.%d
#   Risk score thresholds: age > 3 years (+30), errors > 10 (+40), wear > 80% (+30)
#
# Part of the iGaming Platform Engineering book.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

# Input plugins
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  total = false
  docker_label_include = []
  docker_label_exclude = []

[[inputs.procstat]]
  exe = "hardware_monitor"
  pid_finder = "native"

[[inputs.net]]
  interfaces = ["eth*", "en*"]

# Output plugins - Send to both InfluxDB and Elasticsearch
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "token123"
  organization = "igaming"
  bucket = "hardware_metrics"

[[outputs.elasticsearch]]
  urls = ["http://elasticsearch:9200"]
  index_name = "hardware-metrics-%Y.%m.%d"
  timeout = "5s"
  health_check_interval = "10s"
  manage_template = true
  template_name = "hardware_metrics_template"
  overwrite_template = false

# Custom hardware metrics processor - calculates composite risk scores
[[processors.starlark]]
  source = '''
def apply(metric):
    # Add custom tags and fields for hardware monitoring
    if metric.name == "hardware_metrics":
        # Calculate risk scores
        age_days = metric.fields.get("age_days", 0)
        error_count = metric.fields.get("error_count", 0)
        wear_level = metric.fields.get("wear_level", 0)

        # Risk scoring logic
        risk_score = 0
        if age_days > 1095:  # 3 years
            risk_score += 30
        if error_count > 10:
            risk_score += 40
        if wear_level > 80:
            risk_score += 30

        metric.fields["risk_score"] = risk_score

        # Categorize risk level
        if risk_score >= 70:
            metric.tags["risk_level"] = "critical"
        elif risk_score >= 40:
            metric.tags["risk_level"] = "high"
        elif risk_score >= 20:
            metric.tags["risk_level"] = "medium"
        else:
            metric.tags["risk_level"] = "low"

    return metric
'''
