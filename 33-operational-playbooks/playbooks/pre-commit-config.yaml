# Pre-commit Configuration - Chapter 23: Operational Playbooks
#
# Pre-commit hooks configuration for iGaming platform code quality.
# Enforces trailing whitespace, YAML validity, Python formatting (black),
# Python linting (flake8), and JavaScript/TypeScript linting (eslint).
#
# Install: pip install pre-commit && pre-commit install
#
# Part of the iGaming Platform Engineering book.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.40.0
    hooks:
      - id: eslint
        files: \.(js|ts|jsx|tsx)$
        types: [file]
