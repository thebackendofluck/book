# /etc/smartd.conf
# SMART daemon configuration for iGaming on-premises servers
# Deployed via Ansible hardware-monitoring role (smartd.conf.j2 template)
# Validated with: smartd -q onecheck -c /etc/smartd.conf
#
# Alert email: security-ops@acmetocasino.com
# Chapter 33: Hardware Monitoring and Predictive Maintenance

# ---------------------------------------------------------------------------
# NVMe drives (game server primary storage)
# Monitor with 5°C/10°C warning/failure thresholds above 45°C baseline
# Run short self-test daily at 02:00, long test weekly Sunday 03:00
# ---------------------------------------------------------------------------
/dev/nvme0 -a \
    -W 5,45,55 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../0/03) \
    -n standby,15

/dev/nvme1 -a \
    -W 5,45,55 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../0/03) \
    -n standby,15

/dev/nvme2 -a \
    -W 5,45,55 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../0/03) \
    -n standby,15

/dev/nvme3 -a \
    -W 5,45,55 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../0/03) \
    -n standby,15

# ---------------------------------------------------------------------------
# SAS/SATA drives (bulk storage, backup, audit log archive)
# Lower temperature thresholds: warn at 40°C, fail at 50°C
# Run short self-test daily at 02:30, long test weekly Saturday 03:00
# Alert on any reallocated sectors, pending sectors, or uncorrectable errors
# ---------------------------------------------------------------------------
/dev/sda -a \
    -W 5,40,50 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../6/03) \
    -n standby,15

/dev/sdb -a \
    -W 5,40,50 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../6/03) \
    -n standby,15

/dev/sdc -a \
    -W 5,40,50 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../6/03) \
    -n standby,15

/dev/sdd -a \
    -W 5,40,50 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././02|L/../../6/03) \
    -n standby,15

# ---------------------------------------------------------------------------
# Global defaults for any drives not listed above (catch-all)
# Monitors all drives detected by the kernel with standard SMART attributes
# ---------------------------------------------------------------------------
DEVICESCAN -a \
    -W 5,40,55 \
    -m security-ops@acmetocasino.com \
    -M exec /usr/local/bin/smartd-alert.sh \
    -s (S/../.././04|L/../../0/04) \
    -n standby,15
