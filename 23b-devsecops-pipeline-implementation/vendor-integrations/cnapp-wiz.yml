# GitHub Actions: Wiz IaC scan on Terraform changes.
# Wiz also runs continuously against the connected cloud accounts; this stub
# catches misconfigurations before they reach Terraform apply.
name: wiz-iac

on:
  pull_request:
    paths: ["**/*.tf", "**/*.tfvars", "**/*.yaml", "**/*.yml"]

jobs:
  wiz-iac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Wiz CLI
        run: |
          curl -sL https://wizcli.app.wiz.io/latest/wizcli-linux-amd64 -o wizcli
          chmod +x wizcli
      - name: Wiz auth
        run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      - name: Wiz IaC scan
        run: ./wizcli iac scan --path . --policy "iGaming IaC policy" --output wiz-iac.sarif,sarif
