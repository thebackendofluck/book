# GitLab CI stub: Checkmarx One scan with policy gate.
# Fails the pipeline on any HIGH or CRITICAL finding in payment / RNG paths.
checkmarx-one:
  stage: sast
  image: checkmarx/ast-cli:latest
  timeout: 30 minutes
  variables:
    CX_BRANCH: $CI_COMMIT_REF_NAME
    CX_PROJECT_NAME: "casino-platform"
  script:
    - cx configure set --prop-name cx_apikey --prop-value "$CX_CLIENT_SECRET"
    - cx scan create
        --project-name "$CX_PROJECT_NAME"
        --branch "$CX_BRANCH"
        --tenant "$CX_TENANT"
        --client-id "$CX_CLIENT_ID"
        --client-secret "$CX_CLIENT_SECRET"
        --scan-types sast,sca,iac-security,api-security
        --report-format sarif
        --output-name checkmarx-results
        --filter "severity=HIGH;severity=CRITICAL"
  artifacts:
    when: always
    paths: [checkmarx-results.sarif]
    reports:
      sast: checkmarx-results.sarif
  allow_failure: false
