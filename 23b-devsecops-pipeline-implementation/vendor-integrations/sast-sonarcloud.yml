# GitHub Actions: SonarCloud analysis with quality gate.
# Blocks the PR when the gate fails (zero critical issues, coverage >= 80%).
name: sonarcloud

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=acme-casino
            -Dsonar.projectKey=acme-casino_platform
            -Dsonar.qualitygate.wait=true
