# GitHub Actions: Snyk SAST (Code) + SCA (Open Source) on every pull request.
# Uploads SARIF to GitHub code scanning and forwards findings to DefectDojo.
name: snyk

on:
  pull_request:
  push:
    branches: [main]

jobs:
  snyk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk Code (SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - name: Snyk Open Source (SCA)
        run: snyk test --sarif-file-output=snyk-oss.sarif --severity-threshold=high --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
