# =============================================================================
# Docker Configuration Role -- Container Runtime Setup
# =============================================================================
# CONTEXT: Before cloud migration, Docker was installed and configured on every
# application server through this role. It handled OS-specific package
# installation and created the shared network that all containers joined.
#
# After migration to EKS, Docker configuration became part of the AMI build
# process (Packer) and the container runtime was managed by Kubernetes.
# This role shows the manual approach that preceded the managed service.
# =============================================================================
---
- name: Docker | Include {{ ansible_distribution }} specific variables
  include_vars: "vars/os/{{ ansible_distribution.split(' ', 1)[0]|lower }}.yml"

- name: Docker | Start Installation
  include_tasks: "pkg_mgr/{{ ansible_pkg_mgr }}.yml"

- name: Create a main network
  docker_network:
    name: main
