# =============================================================================
# Instance Configuration Role -- User, Group, and Access Setup
# =============================================================================
# CONTEXT: On-premises, every server needed users, groups, SSH keys, and AWS
# CLI configuration provisioned through this role. The role handles the full
# lifecycle: creating per-user groups, provisioning home directories, deploying
# SSH authorized_keys, and configuring AWS CLI profiles for cross-account access.
#
# After cloud migration, this role was replaced by:
#   - AWS SSM Session Manager for shell access (no SSH keys to manage)
#   - IAM roles attached to EC2 instances (no AWS credentials on disk)
#   - Launch template user-data scripts for initial configuration
# =============================================================================
---
- name: Docker | Include {{ ansible_distribution }} specific variables
  include_vars: "vars/os/{{ ansible_distribution.split(' ', 1)[0]|lower }}.yml"

- name: Docker | Start Installation
  include_tasks: "pkg_mgr/{{ ansible_pkg_mgr }}.yml"

- name: Load vars
  include_vars: "vars/automation.yml"

- name: If sudo group exist, configure passwordless sudo
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%sudo'
    line: '%sudo ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'

- name: If wheel group exist, configure passwordless sudo
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%wheel'
    line: '%wheel ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'

- name: Creating groups
  group: name="{{ item.0.name }}"
  when: "inventory_hostname == item.1.hostname"
  with_subelements:
    - "{{ groups_to_create }}"
    - servers
  tags: ['users', 'groups', 'configuration']

- name: Per-user group creation
  group:
    name: "{{ item.0.username }}"
    gid: "{{ item.0.gid | default(item.0.uid) | default(omit) }}"
  when: "'group' not in item and users_create_per_user_group and inventory_hostname == item.1.hostname"
  with_subelements:
    - "{{ users }}"
    - servers
  tags: ['users', 'configuration']

- name: User creation
  user:
    name: "{{ item.0.username }}"
    group: "{{ item.0.group | default(item.0.username if users_create_per_user_group else users_group) }}"
    groups: "{{ item.1.groups | join(',') if 'groups' in item.1 else '' }}"
    append: "{{ item.0.append | default(omit) }}"
    shell: "{{ item.0.shell if item.0.shell is defined else users_default_shell }}"
    comment: "{{ item.0.name if item.0.name is defined else '' }}"
    uid: "{{ item.0.uid | default(omit) }}"
    home: "{{ item.0.home }}"
    createhome: "{{ 'yes' if users_create_homedirs else 'no' }}"
    generate_ssh_key: "{{ item.0.generate_ssh_key | default(omit) }}"
    update_password: "{{ item.0.update_password | default(omit) }}"
  when: "inventory_hostname == item.1.hostname"
  with_subelements:
    - "{{ users }}"
    - servers
  tags: ['users', 'configuration']

- name: Create .ssh directory in /home/
  file:
    path: "{{ item.0.home }}/.ssh"
    state: directory
    owner: "{{ item.0.username }}"
    group: "{{ item.0.username }}"
  when: "inventory_hostname == item.1.hostname"
  with_subelements:
    - "{{ users }}"
    - servers

- name: SSH Keys
  include_tasks: ssh-keys.yml
  loop_control:
    loop_var: user
  when: "inventory_hostname == user.1.hostname"
  with_subelements:
    - "{{ users }}"
    - servers
  tags: ['users', 'configuration']

- name: Deleted user removal
  user:
    name: "{{ item.username }}"
    state: absent
    remove: "{{ item.remove | default(omit) }}"
    force: "{{ item.force | default(omit) }}"
  with_items: "{{ users_deleted }}"
  tags: ['users', 'configuration']

- name: Deleted per-user group removal
  group:
    name: "{{ item.username }}"
    state: absent
  with_items: "{{ users_deleted }}"
  when: users_create_per_user_group
  tags: ['users', 'configuration']

- name: Install awscli
  apt:
    name: awscli
    state: present
    install_recommends: true

- name: Create .aws root
  file:
    path: "/home/{{ automation_user }}/.aws"
    state: directory
    owner: "{{ automation_user }}"
    mode: '0755'

- name: Set up AWS config
  template:
    src: "files/config.j2"
    dest: "/home/{{ automation_user }}/.aws/config"
    owner: "{{ automation_user }}"

- name: Set up AWS credentials
  template:
    src: "files/credentials.j2"
    dest: "/home/{{ automation_user }}/.aws/credentials"
    owner: "{{ automation_user }}"
