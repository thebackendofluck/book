# igaming-rules-advanced.conf
# Advanced ModSecurity rules for iGaming -- AML pattern detection,
# multi-account fraud, withdrawal velocity, and API abuse.
#
# Include after igaming-rules.conf:
#   Include /etc/nginx/modsecurity.d/igaming-rules-advanced.conf
#
# Chapter 38: AWS Platform Deployment -- WAF rules (advanced)

# ---------------------------------------------------------------------------
# AML: DEPOSIT-WITHDRAWAL CYCLING DETECTION
# Detects wash transactions: large deposit immediately followed by withdrawal
# with minimal or no wagering (money laundering indicator).
#
# Note: Full AML detection requires backend correlation across sessions.
# These rules flag API patterns; the backend AML engine makes final decisions.
# ---------------------------------------------------------------------------

# Track rapid deposit-then-withdraw sequences (within same session)
SecRule REQUEST_URI "@streq /api/v1/payments/deposit" \
    "id:2001, \
     phase:2, \
     chain, \
     pass, \
     nolog, \
     setvar:session.deposit_seen=1, \
     expirevar:session.deposit_seen=1800"
    SecRule REQUEST_BODY "@rx \"amount\":[[:space:]]*[0-9]+" ""

SecRule REQUEST_URI "@streq /api/v1/payments/withdraw" \
    "id:2002, \
     phase:2, \
     chain, \
     log, \
     msg:'Withdrawal within 30min of deposit — AML cycling flag for %{REMOTE_ADDR}', \
     tag:'iGaming/AML', \
     tag:'iGaming/DepositWithdrawalCycling', \
     severity:'HIGH'"
    SecRule SESSION:DEPOSIT_SEEN "@eq 1" ""

# Large withdrawal without minimum wager — flag for AML review
SecRule REQUEST_URI "@streq /api/v1/payments/withdraw" \
    "id:2003, \
     phase:2, \
     chain, \
     pass, \
     log, \
     msg:'Large withdrawal amount — routing to AML manual review queue', \
     tag:'iGaming/AML', \
     severity:'MEDIUM'"
    SecRule REQUEST_BODY "@rx \"amount\":[[:space:]]*([5-9][0-9]{4}|[0-9]{6,})" ""

# ---------------------------------------------------------------------------
# MULTI-ACCOUNT FRAUD (GNOMING)
# Detects registration of multiple accounts from same IP/device.
# Threshold: >2 registrations from same IP in 24 hours
# ---------------------------------------------------------------------------

SecRule REQUEST_URI "@streq /api/v1/players/register" \
    "id:2010, \
     phase:2, \
     pass, \
     nolog, \
     setvar:ip.reg_count=+1, \
     expirevar:ip.reg_count=86400"

SecRule IP:REG_COUNT "@gt 2" \
    "id:2011, \
     phase:2, \
     chain, \
     deny, \
     status:429, \
     log, \
     msg:'Multiple registrations from same IP: %{IP.reg_count} in 24h from %{REMOTE_ADDR}', \
     tag:'iGaming/MultiAccountFraud', \
     severity:'HIGH'"
    SecRule REQUEST_URI "@streq /api/v1/players/register" ""

# Same browser fingerprint → multiple email registration attempts
SecRule REQUEST_URI "@streq /api/v1/players/register" \
    "id:2012, \
     phase:2, \
     chain, \
     log, \
     msg:'Multi-account attempt: same device fingerprint, different email from %{REMOTE_ADDR}', \
     tag:'iGaming/MultiAccountFraud', \
     severity:'MEDIUM'"
    SecRule REQUEST_COOKIES:device_fp "@within %{IP.known_fingerprints}" ""

# ---------------------------------------------------------------------------
# WITHDRAWAL VELOCITY PROTECTION
# Prevents automated withdrawal attacks via compromised accounts.
# Threshold: >3 withdrawal requests per 5 minutes from same authenticated user
# ---------------------------------------------------------------------------

SecRule REQUEST_URI "@streq /api/v1/payments/withdraw" \
    "id:2020, \
     phase:2, \
     pass, \
     nolog, \
     setvar:user.withdrawal_count=+1, \
     expirevar:user.withdrawal_count=300"

SecRule USER:WITHDRAWAL_COUNT "@gt 3" \
    "id:2021, \
     phase:2, \
     deny, \
     status:429, \
     log, \
     msg:'Withdrawal velocity limit exceeded: %{USER.withdrawal_count} attempts in 5min', \
     tag:'iGaming/WithdrawalVelocity', \
     severity:'CRITICAL'"

# ---------------------------------------------------------------------------
# API ABUSE: GAME LAUNCH ENDPOINT
# Prevents bot-driven game session flooding.
# Threshold: >30 game launches per minute per IP (human max ~3/min)
# ---------------------------------------------------------------------------

SecRule REQUEST_URI "@streq /api/v1/games/launch" \
    "id:2030, \
     phase:2, \
     pass, \
     nolog, \
     setvar:ip.game_launch_count=+1, \
     expirevar:ip.game_launch_count=60"

SecRule IP:GAME_LAUNCH_COUNT "@gt 30" \
    "id:2031, \
     phase:2, \
     deny, \
     status:429, \
     log, \
     msg:'Game launch rate limit exceeded: %{IP.game_launch_count} launches/min from %{REMOTE_ADDR}', \
     tag:'iGaming/APIAbuse', \
     severity:'HIGH'"

# ---------------------------------------------------------------------------
# RESPONSIBLE GAMING API PROTECTION
# Prevents bypassing self-exclusion or deposit limit endpoints via injection.
# These endpoints must be strictly protected — regulatory requirement.
# ---------------------------------------------------------------------------

# Protect self-exclusion API from injection attacks
SecRule REQUEST_URI "@beginsWith /api/v1/responsible-gaming/" \
    "id:2040, \
     phase:2, \
     chain"
    SecRule ARGS_NAMES|REQUEST_BODY "@detectSQLi" \
        "deny, \
         status:400, \
         log, \
         msg:'SQL injection attempt on responsible gaming endpoint from %{REMOTE_ADDR}', \
         tag:'iGaming/RGEndpointProtection', \
         severity:'CRITICAL'"

# Prevent mass self-exclusion bypass attempts
SecRule REQUEST_URI "@streq /api/v1/responsible-gaming/self-exclude" \
    "id:2041, \
     phase:2, \
     chain, \
     log, \
     msg:'Self-exclusion bypass attempt — invalid player ID format from %{REMOTE_ADDR}', \
     tag:'iGaming/RGEndpointProtection', \
     severity:'HIGH'"
    SecRule ARGS:player_id "!@rx ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" ""

# ---------------------------------------------------------------------------
# GEOFENCING API PROTECTION
# Prevents tampering with geolocation headers or parameters.
# GeoComply tokens must be validated server-side; these rules prevent
# common client-side tampering attempts.
# ---------------------------------------------------------------------------

SecRule REQUEST_HEADERS:X-GeoComply-Token "!@rx ^[A-Za-z0-9+/=]{200,}" \
    "id:2050, \
     phase:1, \
     chain"
    SecRule &REQUEST_HEADERS:X-GeoComply-Token "@eq 1" \
        "deny, \
         status:403, \
         log, \
         msg:'Malformed GeoComply token header from %{REMOTE_ADDR}', \
         tag:'iGaming/Geofencing', \
         severity:'HIGH'"

# Block attempts to override geo-location via X-Forwarded-For spoofing
SecRule REQUEST_HEADERS:X-Forwarded-For "@rx ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)" \
    "id:2051, \
     phase:1, \
     deny, \
     status:403, \
     log, \
     msg:'X-Forwarded-For spoofing with private IP from %{REMOTE_ADDR}', \
     tag:'iGaming/Geofencing', \
     severity:'HIGH'"
