# igaming-rules.conf
# ModSecurity v3 custom rules for iGaming platform protection
# Addresses the four iGaming-specific threat patterns:
#   1. Credential stuffing (account takeover bots)
#   2. AML deposit-withdrawal cycling (wash transactions)
#   3. Bonus code brute-forcing
#   4. Session fixation
#
# Include after OWASP CRS:
#   Include /etc/nginx/modsecurity.d/igaming-rules.conf
#
# Chapter 38: AWS Platform Deployment -- WAF rules

SecRuleEngine On

# ---------------------------------------------------------------------------
# CREDENTIAL STUFFING DETECTION
# Identifies high-velocity login attempts from single IPs or distributed botnets.
# Threshold: >10 login failures per 60 seconds from same IP
# ---------------------------------------------------------------------------

# Track login failures in persistent collection (TTL 60s)
SecRule REQUEST_URI "@streq /api/v1/auth/login" \
    "id:1001, \
     phase:2, \
     pass, \
     nolog, \
     setvar:ip.login_count=+1, \
     expirevar:ip.login_count=60, \
     chain"
    SecRule RESPONSE_STATUS "@rx ^(401|403)$" \
        "chain"
        SecRule IP:LOGIN_COUNT "@gt 10" \
            "id:1001a, \
             phase:5, \
             deny, \
             status:429, \
             log, \
             msg:'Credential stuffing: %{TX.login_count} failures in 60s from %{REMOTE_ADDR}', \
             logdata:'IP:%{REMOTE_ADDR} User-Agent:%{REQUEST_HEADERS.User-Agent}', \
             tag:'iGaming/CredentialStuffing', \
             severity:'CRITICAL'"

# User-Agent patterns associated with credential stuffing toolkits
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(credential.?stuffing|sentry.?mba|openbullet|blackbullet|storm-bot|checkercc)" \
    "id:1002, \
     phase:1, \
     deny, \
     status:403, \
     log, \
     msg:'Credential stuffing toolkit User-Agent: %{REQUEST_HEADERS.User-Agent}', \
     tag:'iGaming/CredentialStuffing', \
     severity:'CRITICAL'"

# Detect missing JS fingerprint on login (bots skip browser fingerprinting)
SecRule REQUEST_URI "@streq /api/v1/auth/login" \
    "id:1003, \
     phase:2, \
     chain, \
     log, \
     msg:'Login without device fingerprint — possible bot', \
     tag:'iGaming/CredentialStuffing', \
     severity:'WARNING'"
    SecRule &REQUEST_COOKIES:device_fp "@eq 0" \
        "deny, status:403"

# ---------------------------------------------------------------------------
# BONUS CODE BRUTE-FORCING
# Prevents systematic enumeration of promotion codes.
# Threshold: >5 invalid bonus code attempts per 10 minutes from same IP
# ---------------------------------------------------------------------------

SecRule REQUEST_URI "@streq /api/v1/promotions/redeem" \
    "id:1010, \
     phase:2, \
     pass, \
     nolog, \
     setvar:ip.bonus_attempt=+1, \
     expirevar:ip.bonus_attempt=600"

SecRule IP:BONUS_ATTEMPT "@gt 5" \
    "id:1011, \
     phase:2, \
     chain, \
     deny, \
     status:429, \
     log, \
     msg:'Bonus code brute-force: %{IP.bonus_attempt} attempts in 10min from %{REMOTE_ADDR}', \
     tag:'iGaming/BonusAbuse', \
     severity:'HIGH'"
    SecRule REQUEST_URI "@streq /api/v1/promotions/redeem" ""

# Detect sequential/pattern bonus code attempts (e.g., PROMO001 → PROMO002 → PROMO003)
SecRule ARGS:code "@rx ^[A-Z]{2,8}[0-9]{3,6}$" \
    "id:1012, \
     phase:2, \
     pass, \
     nolog, \
     setvar:ip.sequential_bonus_attempt=+1, \
     expirevar:ip.sequential_bonus_attempt=300"

SecRule IP:SEQUENTIAL_BONUS_ATTEMPT "@gt 3" \
    "id:1013, \
     phase:2, \
     deny, \
     status:429, \
     log, \
     msg:'Sequential bonus code pattern detected from %{REMOTE_ADDR}', \
     tag:'iGaming/BonusAbuse', \
     severity:'HIGH'"

# ---------------------------------------------------------------------------
# SESSION FIXATION PREVENTION
# Ensures session tokens cannot be injected via URL parameters or meta-refresh.
# ---------------------------------------------------------------------------

# Block session IDs in URL (session fixation vector)
SecRule QUERY_STRING "@rx (?i)(PHPSESSID|JSESSIONID|session_id|sessid|sid)=" \
    "id:1020, \
     phase:1, \
     deny, \
     status:403, \
     log, \
     msg:'Session fixation attempt: session ID in URL from %{REMOTE_ADDR}', \
     tag:'iGaming/SessionFixation', \
     severity:'HIGH'"

# Validate session token format (must be 64-char hex)
SecRule REQUEST_COOKIES:session_token "!@rx ^[0-9a-fA-F]{64}$" \
    "id:1021, \
     phase:1, \
     chain"
    SecRule &REQUEST_COOKIES:session_token "@eq 1" \
        "deny, \
         status:400, \
         log, \
         msg:'Malformed session token from %{REMOTE_ADDR}', \
         tag:'iGaming/SessionFixation', \
         severity:'MEDIUM'"

# Force session regeneration after authentication (server-side responsibility, log if missing)
SecRule REQUEST_URI "@streq /api/v1/auth/login" \
    "id:1022, \
     phase:5, \
     chain, \
     pass, \
     log, \
     msg:'Post-login session token unchanged (session fixation risk)', \
     tag:'iGaming/SessionFixation', \
     severity:'WARNING'"
    SecRule RESPONSE_STATUS "@streq 200" \
        "chain"
        SecRule RESPONSE_HEADERS:Set-Cookie "!@rx session_token=; HttpOnly; Secure; SameSite=Strict" ""
