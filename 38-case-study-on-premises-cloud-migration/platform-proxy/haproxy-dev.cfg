# HAProxy Development Environment Configuration
# AcmetoCasino Platform Proxy - 3 Hub Instances
# Includes Wiremock integration for API mocking during development

global
  log /dev/log  local0 debug
  chroot /var/lib/haproxy
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  user haproxy
  group haproxy
  daemon
  lua-load /etc/haproxy/add_query_param.lua
  ca-base /etc/ssl/certs
  crt-base /etc/ssl/private

defaults
  log global
  mode  http
  option  httplog
  option  dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  errorfile 504 /etc/haproxy/errors/504.http

frontend stats
   bind *:8404
   option http-use-htx
   http-request use-service prometheus-exporter if { path /dd-metrics }
   stats enable
   stats uri /stats
   stats refresh 10s

frontend fe_dev
  bind *:80 name acme-dev
  bind *:443 ssl crt /etc/haproxy/certs/platform.new.acmetocasino.com.pem

  mode http
  option forwardfor
  option http-buffer-request

  acl txt_xml req.hdr(Content-type) -i text/xml
  acl app_xml req.hdr(Content-type) -i application/xml

  http-request set-var(txn.x_fwd_for) req.hdr(X-Forwarded-For)
  http-request set-var(txn.xml_body) req.body if txt_xml || app_xml

  http-request set-var(txn.sessionid) req.body,json_query('$.sessionid'),bytes(0,32),ub64dec
  http-request set-var(txn.username) req.body,json_query('$.username')
  http-request set-var(txn.userid) req.body,json_query('$.userId')
  http-request set-var(txn.request_query_string) query
  http-request set-var(txn.query_string) lua.add_query_param

  http-request set-query %[var(txn.query_string)]

# game launch specific conditions
  acl game_launch path_sub -i launch-json
  acl gamereel path_sub -i gamereel
  acl game_supplier path_sub -i supplier
  acl game_netent path_sub -i netent

  acl hub2_consumers path_sub -i consumers
  acl be_waccept path_sub -i withdrawaccept

  acl be_userlogin path_sub -i userlogin
  acl be_registeruser path_sub -i registeruser
  acl be_roundrobin lua.is_roundrobin -i "true"

# health, version and updatestatic acls
  acl be_hub0 lua.resolve_hub -i "hubId=0"
  acl be_hub1 lua.resolve_hub -i "hubId=1"
  acl be_hub2 lua.resolve_hub -i "hubId=2"

# wiremock conditions (dev only)
  acl be_wiremock_path path_sub -i wiremock
  acl be_wiremock_admin path_sub -i __admin

# backend usage definition
  use_backend hub0 if be_hub0
  use_backend hub1 if be_hub1
  use_backend hub2 if be_hub2

  use_backend be_games if game_launch
  use_backend be_games if game_supplier || game_netent || gamereel

  use_backend be_consumers if hub2_consumers
  use_backend be_withdrawaccept if be_waccept

  use_backend be_wiremock if be_wiremock_path || be_wiremock_admin

  use_backend be_username if be_userlogin
  use_backend be_username if be_registeruser

  use_backend be_default if be_roundrobin
  use_backend be_userid

# game launches routed to hub0 until new IPs are whitelisted with providers
backend be_games
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub0a platform-hub0.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub0b platform-hub0.int.new.acmetocasino.com:8080 check fall 3 rise 2

# consumer start/stop/restart routed to background instance only
backend be_consumers
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub2a platform-hub2.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub2b platform-hub2.int.new.acmetocasino.com:8080 check fall 3 rise 2

backend be_withdrawaccept
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub1a platform-hub1.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub1b platform-hub1.int.new.acmetocasino.com:8080 check fall 3 rise 2

# wiremock requests on dev hub0, routed through Apache on that server
backend be_wiremock
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  server wm platform-hub0.int.new.acmetocasino.com:80

#### API routing rules ####
# hub2 is for background processes, not listed in general backend config

# requests without valid userId, sessionid, or username
backend be_default
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub0a platform-hub0.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub1a platform-hub1.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub0b platform-hub0.int.new.acmetocasino.com:8080 check fall 3 rise 2
  server hub1b platform-hub1.int.new.acmetocasino.com:8080 check fall 3 rise 2

# requests with valid userId or sessionid (most requests go here)
backend be_userid
  balance url_param userid
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub0a platform-hub0.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub1a platform-hub1.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub0b platform-hub0.int.new.acmetocasino.com:8080 check fall 3 rise 2
  server hub1b platform-hub1.int.new.acmetocasino.com:8080 check fall 3 rise 2

# requests with valid username field (registration and login)
backend be_username
  balance url_param username
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub0a platform-hub0.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub1a platform-hub1.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub0b platform-hub0.int.new.acmetocasino.com:8080 check fall 3 rise 2
  server hub1b platform-hub1.int.new.acmetocasino.com:8080 check fall 3 rise 2

# per-hub health, version, and updatestatic endpoints
backend hub0
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub0a platform-hub0.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub0b platform-hub0.int.new.acmetocasino.com:8080 check fall 3 rise 2

backend hub1
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub1a platform-hub1.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub1b platform-hub1.int.new.acmetocasino.com:8080 check fall 3 rise 2

backend hub2
  mode http
  option forwardfor
  http-request set-header X-Forwarded-For %[src]
  http-response set-header X-Platform-Node %s
  server hub2a platform-hub2.int.new.acmetocasino.com:8081 check fall 3 rise 2
  server hub2b platform-hub2.int.new.acmetocasino.com:8080 check fall 3 rise 2
