## Datadog HAProxy integration configuration
## Scrapes Prometheus metrics from HAProxy stats endpoint

init_config:
    service: haproxy

instances:
  -
    use_prometheus: true
    url: http://localhost/admin?stats
    enable_service_check: true
    prometheus_url: http://localhost:8404/dd-metrics
