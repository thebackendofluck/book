# tasks file for rebuild-casino
- name: Load vars
  include_vars: "vars/{{ casinogroup }}.yml"

- name: GitPull
  shell: git checkout -f  && git checkout "{{ item.1.branch }}" && git pull
  register: stashpull
  become: true
  become_user: build
  with_subelements:
    - "{{ casinos }}"
    - repos
  delegate_to: "{{ item.0.host }}"
  args:
    chdir: "{{ item.1.location }}"

- name: PostPull
  command: sh postpull.sh
  become: true
  become_user: build
  with_subelements:
    - "{{ casinos }}"
    - repos
  delegate_to: "{{ item.0.host }}"
  args:
    chdir: "{{ item.1.location }}"
  when: item.1.name.startswith('ng-')
