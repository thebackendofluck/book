# Docker Compose: Local Lakehouse for Fraud Detection Development
# ================================================================
#
# Reference implementation for Chapter 19: Anti-Fraud System Deep Dive.
#
# This compose file spins up a complete local lakehouse environment
# for developing and testing fraud detection pipelines:
#
# - Apache Spark: batch fraud processing (spark_fraud_batch.py)
# - Apache Flink: real-time fraud detection (flink_fraud_realtime.py)
# - MinIO: S3-compatible storage for Iceberg data files
# - Iceberg REST Catalog: metadata management for Iceberg tables
# - Kafka + Zookeeper: streaming transaction events
# - PostgreSQL: catalog metadata storage
#
# Usage:
#   docker compose -f docker-compose-lakehouse.yml up -d
#   docker compose -f docker-compose-lakehouse.yml logs -f iceberg-rest
#
# Endpoints:
#   MinIO Console:     http://localhost:9001 (minioadmin/minioadmin)
#   Spark UI:          http://localhost:4040
#   Flink Dashboard:   http://localhost:8081
#   Iceberg REST:      http://localhost:8181
#   Kafka:             localhost:9092
#   PostgreSQL:        localhost:5432
#
# Storage layout:
#   s3://fraud-lakehouse/warehouse/fraud_analytics/
#     ├── transactions/        (partitioned by day/jurisdiction/risk_level)
#     ├── player_sessions/     (partitioned by day/jurisdiction)
#     ├── fraud_alerts/        (partitioned by day/jurisdiction/risk_level)
#     └── risk_scores/         (partitioned by day/jurisdiction)

services:
  # ---------------------------------------------------------------------------
  # MinIO: S3-compatible object storage for Iceberg data files
  # ---------------------------------------------------------------------------
  # In production, replace with AWS S3 or GCS.
  # MinIO provides identical S3 API for local development.
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: fraud-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin  # test-only credential, never use in production
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # Create the bucket on startup
  minio-init:
    image: minio/mc:RELEASE.2024-03-13T23-51-57Z
    container_name: fraud-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/fraud-lakehouse --ignore-existing;
      mc mb local/fraud-lakehouse-checkpoints --ignore-existing;
      echo 'Buckets created successfully';
      "
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # PostgreSQL: metadata storage for Iceberg REST catalog
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg_pass  # test-only credential, never use in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Iceberg REST Catalog: metadata management
  # ---------------------------------------------------------------------------
  # The REST catalog provides a centralized, language-agnostic API for
  # Iceberg table metadata. Both Spark and Flink connect here to discover
  # and manage tables.
  iceberg-rest:
    image: tabulario/iceberg-rest:1.5.0
    container_name: fraud-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://fraud-lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_JDBC_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg_pass  # test-only credential, never use in production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Zookeeper: required by Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Kafka: streaming transaction events
  # ---------------------------------------------------------------------------
  # Fraud events flow: Game Servers → Kafka → Flink (real-time detection)
  # Also used for: Flink → Kafka (fraud alerts) → Dashboard WebSocket
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics auto-creation for development
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Spark: batch fraud processing
  # ---------------------------------------------------------------------------
  # Runs spark_fraud_batch.py for:
  # - Nightly feature engineering
  # - Batch model scoring
  # - Iceberg table maintenance (compaction, snapshot expiry)
  spark:
    image: bitnami/spark:3.5
    container_name: fraud-spark
    ports:
      - "4040:4040"   # Spark UI
      - "7077:7077"   # Spark Master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark
      # Iceberg runtime JAR
      SPARK_EXTRA_CLASSPATH: /opt/iceberg/iceberg-spark-runtime.jar
    volumes:
      - spark_data:/opt/spark-data
      - ./:/opt/fraud-scripts
    networks:
      - lakehouse

  spark-worker:
    image: bitnami/spark:3.5
    container_name: fraud-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark
    networks:
      - lakehouse

  # ---------------------------------------------------------------------------
  # Apache Flink: real-time fraud detection
  # ---------------------------------------------------------------------------
  # Runs flink_fraud_realtime.py for:
  # - Sub-second fraud detection on every transaction
  # - Stateful per-player processing (velocity, geo, device tracking)
  # - Exactly-once writes to Iceberg via checkpointing
  flink-jobmanager:
    image: flink:1.18
    container_name: fraud-flink-jobmanager
    ports:
      - "8081:8081"   # Flink Dashboard
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: s3://fraud-lakehouse-checkpoints/flink
        execution.checkpointing.interval: 60000
    volumes:
      - flink_data:/opt/flink-data
      - ./:/opt/fraud-scripts
    networks:
      - lakehouse

  flink-taskmanager:
    image: flink:1.18
    container_name: fraud-flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
        state.backend: rocksdb
    depends_on:
      - flink-jobmanager
    networks:
      - lakehouse

volumes:
  minio_data:
  postgres_data:
  zookeeper_data:
  kafka_data:
  spark_data:
  flink_data:

networks:
  lakehouse:
    driver: bridge
    name: fraud-lakehouse-net
