# =============================================================================
# Kafka Cluster for Fraud Detection Pipeline
# =============================================================================
# Production-grade Kafka setup with 3 brokers, Schema Registry, and monitoring.
# Designed for iGaming fraud detection workloads processing 100K+ TPS.
#
# Usage:
#   docker-compose up -d
#   ./create-topics.sh
#
# Architecture:
#   - 3 Kafka brokers (KRaft mode, no ZooKeeper dependency)
#   - Schema Registry for Avro schema enforcement
#   - Kafka Connect for CDC from gaming databases
#   - Kafka UI for operational visibility
#   - JMX exporters for Prometheus integration
# =============================================================================

version: "3.9"

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.0
  restart: unless-stopped
  networks:
    - fraud-detection
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 10s
    retries: 15

services:
  # ---------------------------------------------------------------------------
  # Kafka Broker 1 (Controller + Broker)
  # ---------------------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    container_name: fraud-kafka-1
    hostname: kafka-1
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9101:9101"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      # KRaft mode configuration (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listener configuration
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster configuration
      CLUSTER_ID: "fraud-detection-cluster-001"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Performance tuning for high-throughput fraud events
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_NUM_REPLICA_FETCHERS: 4

      # Log configuration - 7-day retention for audit compliance
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANUP_POLICY: delete

      # Message configuration
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_MAX_REQUEST_SIZE: 10485760

      # JMX for Prometheus monitoring
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - kafka-1-secrets:/etc/kafka/secrets

  # ---------------------------------------------------------------------------
  # Kafka Broker 2
  # ---------------------------------------------------------------------------
  kafka-2:
    <<: *kafka-common
    container_name: fraud-kafka-2
    hostname: kafka-2
    ports:
      - "127.0.0.1:9093:9092"
      - "127.0.0.1:9102:9101"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "fraud-detection-cluster-001"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - kafka-2-secrets:/etc/kafka/secrets

  # ---------------------------------------------------------------------------
  # Kafka Broker 3
  # ---------------------------------------------------------------------------
  kafka-3:
    <<: *kafka-common
    container_name: fraud-kafka-3
    hostname: kafka-3
    ports:
      - "127.0.0.1:9094:9092"
      - "127.0.0.1:9103:9101"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "fraud-detection-cluster-001"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - kafka-3-secrets:/etc/kafka/secrets

  # ---------------------------------------------------------------------------
  # Schema Registry - Enforces Avro schemas for all fraud events
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: fraud-schema-registry
    hostname: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      # Backward compatibility ensures new schemas can read old data,
      # critical for fraud detection where historical analysis is essential
    networks:
      - fraud-detection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # Kafka Connect - CDC from gaming databases
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: fraud-kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: fraud-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _fraud-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _fraud-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _fraud-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components
    command:
      - bash
      - -c
      - |
        # Install CDC connectors for capturing gaming database changes
        confluent-hub install --no-prompt debezium/debezium-connector-postgresql:2.5.0
        confluent-hub install --no-prompt debezium/debezium-connector-mysql:2.5.0
        /etc/confluent/docker/run
    networks:
      - fraud-detection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Kafka UI - Operational visibility into topics, consumers, and lag
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: fraud-kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-detection
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: fraud-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - fraud-detection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  fraud-detection:
    name: fraud-detection-network
    driver: bridge

volumes:
  kafka-1-data:
  kafka-1-secrets:
  kafka-2-data:
  kafka-2-secrets:
  kafka-3-data:
  kafka-3-secrets:
