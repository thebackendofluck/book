# PostgreSQL connection settings for the matrix-populator batch job.
#
# Migration note: previously used oracle.jdbc.OracleDriver against an
# Oracle 19c PDB. Now uses psycopg / libpq against PostgreSQL 15+.
# The Python driver reads DB_URL_{ENV}/DB_USER/DB_PASSWORD env vars
# directly (see run.py:get_connection); this file is kept as a
# documentation artifact and is also consumed by the Scala batch
# variant if/when it's run with the new dialect.

database {
  test {
      driver = "org.postgresql.Driver"
      url = ${?"DB_URL_TEST"}            # e.g. "jdbc:postgresql://pgdb-test.internal/risk"
      user = ${?"DB_USER"}
      password = ${?"DB_PASSWORD"}
      numThreads = 5
      connectionTimeout = 5 seconds
  }
  prod {
      driver = "org.postgresql.Driver"
      url = ${?"DB_URL_PROD"}            # e.g. "jdbc:postgresql://pgdb-prod.internal/risk"
      user = ${?"DB_USER"}
      password = ${?"DB_PASSWORD"}
      numThreads = 10
      connectionTimeout = 5 seconds
  }
}
