global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    system: 'kyc-antifraud'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Document processor service
  - job_name: 'document-processor'
    static_configs:
      - targets: 
          - 'document-processor:8080'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Encryption service
  - job_name: 'encryption-service'
    static_configs:
      - targets:
          - 'encryption-service:8080'
    metrics_path: '/metrics'

  # Biometric service
  - job_name: 'biometric-service'
    static_configs:
      - targets:
          - 'biometric-service:8080'
    metrics_path: '/metrics'

  # Compliance engine
  - job_name: 'compliance-engine'
    static_configs:
      - targets:
          - 'compliance-engine:8080'
    metrics_path: '/metrics'

  # Secure deletion service
  - job_name: 'secure-deletion'
    static_configs:
      - targets:
          - 'secure-deletion:8080'
    metrics_path: '/metrics'

  # PostgreSQL exporter
  - job_name: 'postgresql'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
