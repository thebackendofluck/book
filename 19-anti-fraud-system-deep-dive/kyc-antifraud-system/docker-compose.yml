# equivalent) and regulator approval.

version: '3.9'

services:
  # API Gateway with SSL/TLS termination
  api-gateway:
    build: ./gateway
    ports:
      - "443:443"
      - "80:80"
    environment:
      - SSL_CERT_PATH=/certs/ssl.crt
      - SSL_KEY_PATH=/certs/ssl.key
      - RATE_LIMIT=100/minute
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./certs:/certs:ro
      - gateway-logs:/var/log/nginx
    networks:
      - kyc-network
    depends_on:
      - document-processor
      - biometric-service
      - compliance-engine
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # Document Processing Service with OCR and verification
  document-processor:
    build: ./document-processor
    environment:
      - ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - HSM_ENDPOINT=${HSM_ENDPOINT}
      - MAX_PROCESSING_TIME=30s
      - AUTO_DESTRUCT=true
      - TESSERACT_LANG=eng+spa+por+fra+deu
      - DB_HOST=postgres-db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis-cache
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - encrypted-storage:/data
      - ./hsm-config:/hsm:ro
      - document-logs:/logs
    networks:
      - kyc-network
    depends_on:
      - postgres-db
      - redis-cache
      - encryption-service
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Encryption Service with Hardware Security Module integration
  encryption-service:
    build: ./encryption
    environment:
      - HSM_SLOT=${HSM_SLOT}
      - HSM_PIN_FILE=/run/secrets/hsm_pin
      - KEY_ROTATION_DAYS=90
      - ALGORITHM=AES-256-GCM
      - HSM_LIB_PATH=/usr/lib/softhsm/libsofthsm2.so
      - AUDIT_ENABLED=true
    secrets:
      - hsm_pin
      - hsm_admin_pin
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - hsm-tokens:/var/lib/softhsm/tokens
      - encryption-logs:/logs
    networks:
      - kyc-network
    privileged: true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.hsm == true
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Biometric Verification Service with GPU acceleration
  biometric-service:
    build: ./biometric
    environment:
      - FACE_MATCH_THRESHOLD=0.95
      - LIVENESS_DETECTION=enabled
      - MAX_RETRY_ATTEMPTS=3
      - SPOOFING_DETECTION=true
      - USE_GPU=${USE_GPU:-false}
      - MODEL_PATH=/models
    volumes:
      - ./models:/models:ro
      - biometric-logs:/logs
    networks:
      - kyc-network
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.gpu == true
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Compliance Engine for regulatory checks
  compliance-engine:
    build: ./compliance
    environment:
      - GDPR_MODE=strict
      - DATA_RETENTION_DAYS=90
      - AUDIT_LOG_LEVEL=verbose
      - SANCTIONS_LIST_UPDATE=daily
      - PEP_DATABASE_URL=${PEP_DATABASE_URL}
      - AML_THRESHOLD=${AML_THRESHOLD:-10000}
      - OFAC_API_KEY=${OFAC_API_KEY}
      - WORLDCHECK_API_KEY=${WORLDCHECK_API_KEY}
    volumes:
      - audit-logs:/logs
      - compliance-rules:/rules:ro
      - sanctions-cache:/cache
    networks:
      - kyc-network
    depends_on:
      - postgres-db
      - redis-cache
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # Secure Document Deletion Service
  secure-deletion:
    build: ./secure-deletion
    environment:
      - DELETION_METHOD=DOD_5220_22_M
      - OVERWRITE_PASSES=7
      - VERIFICATION_REQUIRED=true
      - GDPR_COMPLIANCE=true
      - SCHEDULED_CLEANUP_HOUR=3
      - EMERGENCY_DESTRUCT_ENABLED=true
    volumes:
      - encrypted-storage:/data
      - deletion-logs:/logs
    networks:
      - kyc-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Machine Learning Risk Scoring Service
  ml-risk-scorer:
    build: ./ml-scoring
    environment:
      - MODEL_UPDATE_FREQUENCY=daily
      - TENSORFLOW_SERVING_URL=http://tf-serving:8501
      - FEATURE_STORE_URL=http://feature-store:8080
      - MIN_CONFIDENCE_SCORE=0.7
      - ENABLE_EXPLAINABILITY=true
    volumes:
      - ml-models:/models
      - ml-logs:/logs
    networks:
      - kyc-network
    depends_on:
      - tf-serving
      - feature-store
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '2'

  # TensorFlow Serving for ML models
  tf-serving:
    image: tensorflow/serving:2.17.0-gpu
    environment:
      - MODEL_NAME=risk_scorer
      - MODEL_BASE_PATH=/models
    volumes:
      - ml-models:/models:ro
    networks:
      - kyc-network
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Feature Store for ML features
  feature-store:
    build: ./feature-store
    environment:
      - REDIS_URL=redis://redis-cache:6379
      - POSTGRES_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-db/features
    networks:
      - kyc-network
    depends_on:
      - redis-cache
      - postgres-db

  # Redis for caching and session management
  redis-cache:
    image: redis:8-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL with encryption at rest
  postgres-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=kyc_db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--data-checksums --encoding=UTF8
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c shared_preload_libraries=pgcrypto,pg_stat_statements
      -c log_statement=all
      -c log_duration=on
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-ssl:/var/lib/postgresql:ro
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres-logs:/var/log/postgresql
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d kyc_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MongoDB for document storage
  mongodb:
    image: mongo:6.0.14
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=kyc_documents
    command: >
      mongod
      --auth
      --bind_ip_all
      --tlsMode requireTLS
      --tlsCertificateKeyFile /etc/ssl/mongodb.pem
      --tlsCAFile /etc/ssl/ca.pem
    volumes:
      - mongo-data:/data/db
      - ./mongo-ssl:/etc/ssl:ro
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # Elasticsearch for audit logs and searching
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - elastic-logs:/usr/share/elasticsearch/logs
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - kyc-network
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.54.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kyc-network
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?GRAFANA_USER must be set}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource,mongodb-datasource
      - GF_SERVER_ROOT_URL=https://kyc.casino.com/grafana
      - GF_AUTH_LDAP_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kyc-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Alertmanager for alert routing
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - kyc-network
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Backup service for automated backups
  backup-service:
    build: ./backup
    environment:
      - BACKUP_SCHEDULE="0 2 * * *"
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - RETENTION_DAYS=30
    volumes:
      - postgres-data:/backup/postgres:ro
      - mongo-data:/backup/mongo:ro
      - encrypted-storage:/backup/documents:ro
      - backup-logs:/logs
    networks:
      - kyc-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

networks:
  kyc-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
    attachable: false
    ipam:
      driver: default
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1

volumes:
  encrypted-storage:
    driver: local
    driver_opts:
      type: none
      device: /dev/mapper/kyc-encrypted
      o: bind
  
  # Database volumes
  postgres-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  elastic-data:
    driver: local
  
  # Application data volumes
  ml-models:
    driver: local
  hsm-tokens:
    driver: local
  sanctions-cache:
    driver: local
  compliance-rules:
    driver: local
  
  # Log volumes
  audit-logs:
    driver: local
  gateway-logs:
    driver: local
  document-logs:
    driver: local
  encryption-logs:
    driver: local
  biometric-logs:
    driver: local
  deletion-logs:
    driver: local
  ml-logs:
    driver: local
  postgres-logs:
    driver: local
  elastic-logs:
    driver: local
  backup-logs:
    driver: local
  
  # Monitoring volumes
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

secrets:
  hsm_pin:
    external: true
  hsm_admin_pin:
    external: true
