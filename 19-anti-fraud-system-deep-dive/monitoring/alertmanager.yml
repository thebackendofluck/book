# equivalent) and regulator approval.

# This file is rendered at deploy time. Replace ${SLACK_WEBHOOK_URL},
# ${SMTP_PASSWORD}, ${PAGERDUTY_KEY}, ${WEBHOOK_PASSWORD} via your
# config-management layer (envsubst, Helm template, Kustomize secret
# generator, or sealed-secrets) before passing to alertmanager. Never
# commit the literal values.

global:
  smtp_smarthost: 'localhost:1025'
  smtp_from: 'alerts@fraud-detection.local'
  smtp_require_tls: false

route:
  group_by: [ 'alertname' ]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-alerts'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: high
    receiver: 'high-alerts'

receivers:
- name: 'email-alerts'
  email_configs:
  - to: 'team@fraud-detection.local'
    send_resolved: true

- name: 'critical-alerts'
  email_configs:
  - to: 'security@fraud-detection.local'
    send_resolved: true
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#fraud-alerts-critical'
    send_resolved: true
    title: '{{ .GroupLabels.alertname }}'
    text: '{{ .CommonAnnotations.description }}'

- name: 'high-alerts'
  email_configs:
  - to: 'analysts@fraud-detection.local'
    send_resolved: true
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#fraud-alerts'
    send_resolved: true

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: [ 'alertname', 'instance' ]
