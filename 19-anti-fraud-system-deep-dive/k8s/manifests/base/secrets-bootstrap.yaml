# -----------------------------------------------------------------------------
# BOOTSTRAP SECRETS - PLACEHOLDERS ONLY
# -----------------------------------------------------------------------------
# These secrets are intentionally EMPTY. Real values are seeded at apply-time
# by ../apply-all.sh, which:
#   1) Generates random passwords with `openssl rand -base64 24`
#   2) Creates secrets idempotently with `kubectl create secret generic ...
#      --dry-run=client -o yaml | kubectl apply -f -`
#
# Once a secrets backend (e.g. External Secrets Operator + OpenBao/Vault) is
# wired in, replace this file with ExternalSecret CRs in
# operators/externalsecrets.yaml.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fraud-detection
  labels:
    app.kubernetes.io/part-of: fraud-detection
    bootstrap: "true"
  annotations:
    # apply-all.sh overwrites these if empty; do NOT kubectl apply blind after rotation.
    fraud-detection/rotate-from: "vault:secret/fraud/postgres"
type: Opaque
stringData:
  username: "fraud_user"
  password: "CHANGE_ME_APPLY_SCRIPT_OVERRIDES"
  postgres-password: "CHANGE_ME_APPLY_SCRIPT_OVERRIDES"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: fraud-detection
  labels:
    app.kubernetes.io/part-of: fraud-detection
    bootstrap: "true"
  annotations:
    fraud-detection/rotate-from: "vault:secret/fraud/redis"
type: Opaque
stringData:
  redis-password: "CHANGE_ME_APPLY_SCRIPT_OVERRIDES"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: fraud-detection
  labels:
    app.kubernetes.io/part-of: fraud-detection
    bootstrap: "true"
  annotations:
    fraud-detection/rotate-from: "vault:secret/fraud/grafana"
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_APPLY_SCRIPT_OVERRIDES"
