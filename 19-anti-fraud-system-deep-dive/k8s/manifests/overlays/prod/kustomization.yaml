apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fraud-detection

resources:
  - ../../base

# Prod replica / resource tuning. Adjust to match the headroom of your cluster.
patches:
  - target:
      kind: Deployment
      name: data-ingestion
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: feature-engineering
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: model-serving
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: alerting
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

