# /etc/security/limits.d/99-network.conf
# File descriptor and process limits for iGaming servers
# Required alongside 99-network-performance.conf
*               soft    nofile          8388608
*               hard    nofile          8388608
root            soft    nofile          8388608
root            hard    nofile          8388608
*               soft    nproc           65535
*               hard    nproc           65535
*               soft    memlock         unlimited
*               hard    memlock         unlimited
