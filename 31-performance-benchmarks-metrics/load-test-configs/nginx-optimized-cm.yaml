apiVersion: v1
data:
  nginx.conf: |
    worker_processes 16;
    worker_rlimit_nofile 131072;
    worker_cpu_affinity auto;

    events {
        worker_connections 65536;
        multi_accept on;
        use epoll;
    }

    error_log /var/log/nginx/error.log warn;

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        access_log off;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 30;
        keepalive_requests 10000;
        reset_timedout_connection on;
        server_tokens off;

        # Connection reuse and buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        # Open file cache for static assets
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 2;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml application/wasm;

        upstream varnish_backend {
            server varnish:6081;
            keepalive 512;
            keepalive_requests 10000;
            keepalive_timeout 30s;
        }

        # Map for WebSocket upgrade detection
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        limit_req_zone $binary_remote_addr zone=cdn_general:20m rate=100000r/s;
        limit_conn_zone $binary_remote_addr zone=cdn_conn:20m;

        server {
            listen 8080 backlog=65535;
            server_name _;

            location /health {
                access_log off;
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }

            location /loaderio-21d123918f43347e3f9a9caba32fef5e {
                access_log off;
                return 200 "loaderio-21d123918f43347e3f9a9caba32fef5e";
                add_header Content-Type text/plain;
            }

            location /loaderio-21d123918f43347e3f9a9caba32fef5e/ {
                access_log off;
                return 200 "loaderio-21d123918f43347e3f9a9caba32fef5e";
                add_header Content-Type text/plain;
            }

            location / {
                return 301 https://$host:30443$request_uri;
            }
        }

        server {
            listen 8443 ssl http2 backlog=65535;
            server_name _;

            # TLS 1.3 prioritized, 1.2 fallback
            ssl_certificate     /etc/nginx/ssl/server.crt;
            ssl_certificate_key /etc/nginx/ssl/server.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:20m;
            ssl_session_timeout 1d;
            ssl_session_tickets on;
            ssl_early_data on;
            ssl_buffer_size 4k;

            # OCSP stapling (reduces TLS handshake latency)
            ssl_stapling on;
            ssl_stapling_verify on;
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            resolver_timeout 5s;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Served-By "nginx-tls-edge" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

            limit_req zone=cdn_general burst=200000 nodelay;
            limit_conn cdn_conn 30000;
            limit_req_status 429;
            limit_conn_status 429;

            location /health {
                access_log off;
                proxy_pass http://varnish_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
                proxy_next_upstream_tries 2;
            }

            location /loaderio-21d123918f43347e3f9a9caba32fef5e {
                access_log off;
                return 200 "loaderio-21d123918f43347e3f9a9caba32fef5e";
                add_header Content-Type text/plain;
            }

            location /loaderio-21d123918f43347e3f9a9caba32fef5e/ {
                access_log off;
                return 200 "loaderio-21d123918f43347e3f9a9caba32fef5e";
                add_header Content-Type text/plain;
            }

            location /ws/ {
                proxy_pass http://varnish_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location / {
                proxy_pass http://varnish_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_send_timeout 30s;
                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
                proxy_next_upstream_tries 2;
            }
        }
    }
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: casino-prod
