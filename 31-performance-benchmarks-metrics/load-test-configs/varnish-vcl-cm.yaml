apiVersion: v1
kind: ConfigMap
metadata:
  name: varnish-vcl
  namespace: casino-prod
data:
  default.vcl: |
    vcl 4.1;

    backend default {
        .host = "casino-service";
        .port = "8000";
        .probe = {
            .url = "/health";
            .interval = 5s;
            .timeout = 2s;
            .window = 5;
            .threshold = 3;
        }
    }

    sub vcl_recv {
        # Health endpoint — always pass (don't cache)
        if (req.url == "/health") {
            return (pass);
        }

        # Static assets — cache aggressively
        if (req.url ~ "\.(css|js|png|jpg|jpeg|gif|ico|woff2?|ttf|svg)$") {
            unset req.http.Cookie;
            return (hash);
        }

        # API calls with auth — always pass
        if (req.http.Authorization) {
            return (pass);
        }

        # Game lobby, odds feeds — short cache
        if (req.url ~ "^/(api/games|api/odds|lobby)") {
            return (hash);
        }

        # Default — hash
        return (hash);
    }

    sub vcl_backend_response {
        # Grace mode — serve stale content for 30s if backend is down
        set beresp.grace = 30s;

        # Static assets — 1 hour cache
        if (bereq.url ~ "\.(css|js|png|jpg|jpeg|gif|ico|woff2?|ttf|svg)$") {
            set beresp.ttl = 1h;
            unset beresp.http.Set-Cookie;
        }

        # Game lobby — 5 second cache (fresh odds)
        if (bereq.url ~ "^/(api/games|lobby)") {
            set beresp.ttl = 5s;
        }

        # Odds feed — 2 second cache
        if (bereq.url ~ "^/api/odds") {
            set beresp.ttl = 2s;
        }

        # Default TTL
        if (beresp.ttl <= 0s) {
            set beresp.ttl = 10s;
        }
    }

    sub vcl_deliver {
        # Add cache hit/miss header
        if (obj.hits > 0) {
            set resp.http.X-Cache = "HIT";
            set resp.http.X-Cache-Hits = obj.hits;
        } else {
            set resp.http.X-Cache = "MISS";
        }
        set resp.http.X-Served-By = "varnish-edge";
    }
