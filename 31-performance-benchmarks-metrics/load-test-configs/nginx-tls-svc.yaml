apiVersion: v1
kind: Service
metadata:
  name: nginx-tls
  namespace: casino-prod
spec:
  selector:
    app: nginx-tls
  ports:
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
  type: NodePort
