# /etc/k3s-autoscaler.conf
# K3s Cluster Node Autoscaler Configuration
# ──────────────────────────────────────────

# Control plane / K3s server
K3S_SERVER_IP="10.0.0.11"
K3S_SERVER_URL="https://10.0.0.11:6443"
K3S_TOKEN="${K3S_TOKEN:?export the cluster join token; never hardcode it}"

# Scaling thresholds
SCALE_UP_CPU_PERCENT=70       # Add node when avg CPU > this
SCALE_DOWN_CPU_PERCENT=30     # Remove node when avg CPU < this
SCALE_DOWN_WAIT_SECONDS=300   # Node must be idle for 5 minutes before removal
PENDING_POD_GRACE_SECONDS=30  # Pending pods must exist for 30s before triggering scale-up
COOLDOWN_SECONDS=120          # Minimum 2 minutes between scale events

# Node limits
MIN_WORKERS=0                 # Minimum worker count (control plane always runs)
MAX_WORKERS=5                 # Maximum worker VMs

# Worker VM defaults
WORKER_CPU=16
WORKER_RAM=32768              # MB
WORKER_DISK=50                # GB (OS disk)
WORKER_IP_BASE="10.0.10"
WORKER_IP_START=41            # First worker IP: 10.0.10.41
WORKER_NAME_PREFIX="k3s-autoscale-worker"

# Infrastructure
VM_IMAGE_DIR="/nvme-0-zfs/vms"
GOLDEN_IMAGE="/nvme-0-zfs/vms/golden/noble-golden-generic.qcow2"
BRIDGE="br1"
GATEWAY="10.0.10.1"
DNS="10.0.10.242,10.0.10.1,8.8.8.8"

# SSH
SSH_USER="${SSH_USER:-operator}"
SSH_PUB_KEY1="${SSH_PUB_KEY1:?export SSH_PUB_KEY1 with your own public key}"
SSH_PUB_KEY2="${SSH_PUB_KEY2:-}"   # optional second operator key

# Logging
LOG_FILE="/var/log/k3s-autoscaler.log"
SCALE_EVENTS_LOG="/var/log/k3s-autoscaler-events.log"
