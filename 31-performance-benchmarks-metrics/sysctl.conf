# sysctl.conf (symlink or include target for chapter-31 performance tuning)
# This file is the combined performance + security sysctl configuration
# for iGaming platform servers. Apply: sysctl --system

# See also:
#   99-igaming-performance.conf -- gaming-specific tuning
#   99-network-performance.conf -- 100Gbps network tuning
#   99-network.conf             -- limits.d file for fd/process limits

# ---- Network performance ----
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 5
net.ipv4.tcp_max_tw_buckets = 2000000
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3

# ---- Memory ----
vm.swappiness = 1
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.overcommit_memory = 1
vm.max_map_count = 262144

# ---- File descriptors ----
fs.file-max = 2097152
fs.nr_open = 2097152

# ---- Scheduling ----
kernel.sched_migration_cost_ns = 5000000
kernel.sched_autogroup_enabled = 0

# ---- Security ----
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
kernel.randomize_va_space = 2
fs.suid_dumpable = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
