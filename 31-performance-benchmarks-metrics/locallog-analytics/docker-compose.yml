# docker-compose.yml -- Privacy-first API analytics stack
# Runs entirely on-premise. No data leaves the local network.
# AI analysis requires a Gemini API key (optional).
#
# Usage:
#   GEMINI_API_KEY=your-key docker compose up -d
#   # Dashboard: http://localhost:8080
#   # Ingest:    POST http://localhost:8080/api/ingest

version: '3.8'

services:
  analytics-dashboard:
    build:
      context: .
      args:
        - API_KEY=${GEMINI_API_KEY}
    container_name: api-analytics
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mock-traffic:
    build:
      context: ./mock-api
    container_name: mock-traffic-generator
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - analytics-dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
