apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  labels:
    role: locust-worker
    app: locust-worker
  name: locust-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      role: locust-worker
      app: locust-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        role: locust-worker
        app: locust-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                    - locust-worker
              topologyKey: "kubernetes.io/hostname"
      containers:
      - image: acmetocasino/load-testing:1.0.0
        imagePullPolicy: Always
        env:
        - name: LOCUST_MASTER_NODE_HOST
          value: "locust-master"
        - name: USE_PREREG
          valueFrom:
            configMapKeyRef:
              name: locust-cm
              key: USE_PREREG
        name: worker
        command: ["/bin/bash"]
        args: ["-c", "/start_worker.sh"]
        volumeMounts:
          - mountPath: /home/locust
            name: locust-scripts
          - mountPath: /tmp
            name: tmp-volume
        # Generous limits: this is a load-generator, not a target under test --
        # tight caps here would distort the load test itself.
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      ### TODO ###
      # revisit why below is not playing nice with podAffinity added
      # nodeSelector:
      #   worker-group: locust
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: locust-scripts
        configMap:
          name: scripts-cm
      - name: tmp-volume
        emptyDir: {}