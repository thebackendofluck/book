# simulation.conf
# Gatling simulation configuration for iGaming platform load testing
# Environment URLs and test parameters with env var overrides
# Used by KambiBetSimulation.scala and CasinoSitesSimulation.scala

# Platform Hub URL (set via environment variable or config)
hubUrl = ${?HUB_URL}
hubUrl = "https://platform-staging.acmetocasino.com"

# Game service URL for catalog/lobby load test
gameServiceUrl = ${?GAME_SERVICE_URL}
gameServiceUrl = "https://games-staging.acmetocasino.com"

# Spoke (provider) URLs
kambiUrl = ${?KAMBI_URL}
kambiUrl = "https://kambi-staging.acmetocasino.com"

evolutionUrl = ${?EVOLUTION_URL}
evolutionUrl = "https://evolution-staging.acmetocasino.com"

# Test user pool (generated by generateFiles.sh)
usersFile = "users.csv"
usersFileNode = ${?NODE}
usersFileNode = "aa"

# Load profile
virtualUsers = ${?VIRTUAL_USERS}
virtualUsers = 100

duration = ${?DURATION}
duration = "3minutes"

rampUpDuration = ${?RAMP_UP}
rampUpDuration = "1minute"

# Concurrent users for stepped injection
startUsers = ${?START_USERS}
startUsers = 10

incrementUsers = ${?INCREMENT_USERS}
incrementUsers = 10

stageCount = ${?STAGE_COUNT}
stageCount = 5

stageDuration = ${?STAGE_DURATION}
stageDuration = "1minute"

# Jurisdictions to test (US multi-state)
jurisdictions = ["NJ", "PA", "MI", "IN"]

# Test distribution (realistic traffic split)
betOutcome {
  winProbability = 0.66
  loseProbability = 0.34
}

# Device type distribution
deviceTypes {
  desktop = 0.70
  mobile = 0.28
  tablet = 0.02
}

# SLA thresholds (assertions will fail CI if breached)
sla {
  maxLatencyMs = 10000
  p99LatencyMs = 5000
  p95LatencyMs = 3000
  maxErrorPercent = 0.01
}
