# /etc/security/limits.conf
# System-wide limits for iGaming platform servers
# These are the base limits; per-service overrides go in limits.d/
# NOTE: no hard nofile here may exceed fs.nr_open (2097152 in sysctl.conf);
# pam_limits fails the whole login session otherwise. systemd services
# ignore this file entirely: set LimitNOFILE= in the unit instead.

# Gaming platform users
casino          soft    nofile          2097152
casino          hard    nofile          2097152
casino          soft    nproc           65535
casino          hard    nproc           65535
casino          soft    stack           unlimited
casino          hard    stack           unlimited

# PostgreSQL
postgres        soft    nofile          2097152
postgres        hard    nofile          2097152
postgres        soft    nproc           65535
postgres        hard    nproc           65535
postgres        soft    memlock         unlimited
postgres        hard    memlock         unlimited

# Redis
redis           soft    nofile          65535
redis           hard    nofile          65535
redis           soft    nproc           65535
redis           hard    nproc           65535
redis           soft    memlock         unlimited
redis           hard    memlock         unlimited

# All users (base settings)
*               soft    nofile          65535
*               hard    nofile          65535
*               soft    nproc           65535
*               hard    nproc           65535
root            soft    nofile          2097152
root            hard    nofile          2097152
