# /etc/sysctl.d/99-network-performance.conf
# Optimized for 100 Gbps -- iGaming workloads
# Apply with: sysctl -p /etc/sysctl.d/99-network-performance.conf

# Buffer sizes (1GB for 100Gbps)
net.core.rmem_max = 1073741824
net.core.wmem_max = 1073741824
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608
net.core.optmem_max = 134217728

# TCP buffers: min, default, max
net.ipv4.tcp_rmem = 4096 8388608 1073741824
net.ipv4.tcp_wmem = 4096 8388608 1073741824
net.ipv4.tcp_mem = 786432 1048576 26777216

# Queue settings
net.core.netdev_max_backlog = 300000
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_budget = 4800
net.core.netdev_budget_usecs = 2000

# TCP optimization
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3

# Connection tracking
net.netfilter.nf_conntrack_max = 8000000
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# File descriptors
fs.file-max = 16777216
fs.nr_open = 16777216
