# /etc/sysctl.d/99-igaming-performance.conf
# Kernel tuning for iGaming platform servers
# Apply with: sysctl -p /etc/sysctl.d/99-igaming-performance.conf
# Covers: connection backlog, TIME_WAIT, keepalive, memory, file descriptors

# Connection backlog -- default of 128 is absurdly low for gaming traffic
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Port range -- maximize outbound connection capacity
net.ipv4.ip_local_port_range = 1024 65535

# Connection close handling -- tcp_fin_timeout bounds orphaned FIN_WAIT_2 sockets
# (TIME_WAIT itself is fixed at 60s in the kernel; see Chapter 28a)
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 5
net.ipv4.tcp_max_tw_buckets = 2000000

# Keepalive -- faster dead connection detection
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Disable slow start after idle -- critical for bursty betting traffic
net.ipv4.tcp_slow_start_after_idle = 0

# Enable TCP Fast Open
net.ipv4.tcp_fastopen = 3

# Memory for gaming workloads
vm.swappiness = 1
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.overcommit_memory = 1
vm.max_map_count = 262144

# File descriptors -- you'll need millions
fs.file-max = 2097152
fs.nr_open = 2097152

# Scheduling for low latency
kernel.sched_migration_cost_ns = 5000000
kernel.sched_autogroup_enabled = 0
