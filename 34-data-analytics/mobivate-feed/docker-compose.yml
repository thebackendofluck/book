version: "3.8"
services:
  platform-pg-local:
    image: ${DOCKER_REPOSITORY_URL}/${DOCKER_IMAGE}:${DOCKER_TAG}
    ports:
      - "127.0.0.1:${DOCKER_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  pg-data:
