# Chapter 42 - Complete Platform Architecture
# Kubernetes Network Policies for iGambling Platform
# Implements: namespace-level isolation, security groups per bounded context
#
# Apply: kubectl apply -f network-policies.yaml
#
# Architecture:
#   casino-platform  -> payment-processing, player-management, game-engine, compliance
#   payment-processing -> compliance (event reporting only)
#   game-engine -> player-management (session validation), compliance
#   player-management -> compliance (KYC/AML events)
#   analytics -> read-only access to all namespaces
#   compliance -> isolated, receives events only

---
# 1. Default deny all ingress in payment-processing namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payment-processing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2. Default deny all ingress in compliance namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: compliance
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 3. Default deny all ingress in game-engine namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: game-engine
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 4. Default deny all ingress in player-management namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: player-management
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 5. Allow casino-platform to reach payment-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-casino-to-payment
  namespace: payment-processing
spec:
  podSelector:
    matchLabels:
      app: payment-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: casino-platform
          podSelector:
            matchLabels:
              app: casino-api
      ports:
        - protocol: TCP
          port: 8443

---
# 6. Allow wallet-service to reach payment-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wallet-to-payment
  namespace: payment-processing
spec:
  podSelector:
    matchLabels:
      app: payment-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: player-management
          podSelector:
            matchLabels:
              app: wallet-service
      ports:
        - protocol: TCP
          port: 8443

---
# 7. Allow game-settlement to reach payment-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-settlement-to-payment
  namespace: payment-processing
spec:
  podSelector:
    matchLabels:
      app: payment-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: game-engine
          podSelector:
            matchLabels:
              app: game-settlement
      ports:
        - protocol: TCP
          port: 8443

---
# 8. Allow casino-platform to reach game-engine
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-casino-to-games
  namespace: game-engine
spec:
  podSelector:
    matchLabels:
      app: game-engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: casino-platform
          podSelector:
            matchLabels:
              app: casino-api
      ports:
        - protocol: TCP
          port: 8080

---
# 9. Allow casino-platform to reach player-management
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-casino-to-players
  namespace: player-management
spec:
  podSelector:
    matchLabels:
      app: player-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: casino-platform
      ports:
