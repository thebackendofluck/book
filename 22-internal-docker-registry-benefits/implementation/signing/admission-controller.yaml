# =============================================================================
# Kubernetes Admission Controller — Enforce Signed Images Only
# =============================================================================
# Uses Kyverno to enforce that only Cosign-signed images from the internal
# Harbor registry can be deployed. Unsigned or unscanned images are rejected.
#
# Prerequisites:
#   - Kyverno >= 1.11 (helm install kyverno kyverno/kyverno -n kyverno --create-namespace)
#   - Cosign public key stored as K8s secret (see content-trust-setup.sh)
#
# Apply:
#   kubectl apply -f admission-controller.yaml
# =============================================================================

---
# ============================================================
# Policy 1: Require Cosign Signature on All Images
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
  annotations:
    policies.kyverno.io/title: Require Cosign Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Ensures all container images deployed to the cluster are signed
      using Cosign with the casino platform signing key. Required by
      GLI-33 for supply chain integrity.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - casino-games
                - casino-platform
                - casino-backoffice
                - casino-monitoring
                - production
                - staging
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - ingress-nginx
      verifyImages:
        - imageReferences:
            - "registry.casino-platform.internal/*"
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      # Replace with actual public key from cosign.pub
                      # Generated by: content-trust-setup.sh init
                      -----END PUBLIC KEY-----
                    # Or reference K8s secret:
                    # secret:
                    #   name: cosign-public-key
                    #   namespace: kube-system
          attestations:
            - type: https://cosign.sigstore.dev/attestation/vuln/v1
              conditions:
                - all:
                    - key: "{{ scanner_result.Results[].Vulnerabilities[?Severity=='CRITICAL'] | length(@) }}"
                      operator: Equals
                      value: "0"
              attestors:
                - entries:
                    - keys:
                        secret:
                          name: cosign-public-key
                          namespace: kube-system

    # Verify that images from Docker Hub or other external registries
    # are mirrored and signed internally
    - name: block-external-unsigned-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - casino-games
                - casino-platform
                - production
      validate:
        message: >-
          External images must be mirrored to the internal registry and signed.
          Use registry.casino-platform.internal/casino-third-party/<image> instead.
        pattern:
          spec:
            containers:
              - image: "registry.casino-platform.internal/*"
            initContainers:
              - image: "registry.casino-platform.internal/*"

---
# ============================================================
# Policy 2: Require Vulnerability Scan Before Deploy
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-vulnerability-scan
  annotations:
    policies.kyverno.io/title: Require Vulnerability Scan
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Verifies images have been scanned by Trivy and have no critical
      vulnerabilities before deployment is allowed.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-scan-results
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
                - staging
      verifyImages:
        - imageReferences:
            - "registry.casino-platform.internal/*"
          attestors:
            - entries:
                - keys:
                    secret:
                      name: cosign-public-key
                      namespace: kube-system
          attestations:
            - type: https://cosign.sigstore.dev/attestation/vuln/v1
              conditions:
                - all:
                    # No critical vulnerabilities allowed in production
                    - key: "{{ scanner_result.Results[].Vulnerabilities[?Severity=='CRITICAL'] | length(@) }}"
                      operator: Equals
                      value: "0"

---
# ============================================================
# Policy 3: Enforce Image Digest (No Mutable Tags)
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Require Image Digest
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Production workloads must reference images by digest (sha256)
      to prevent tag mutation attacks. Staging allows tags.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-digest-in-production
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
      validate:
        message: "Production images must use digest references (image@sha256:...), not tags."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"

---
# ============================================================
# Policy 4: Restrict Base Images to Approved List
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-base-images
  annotations:
    policies.kyverno.io/title: Restrict to Approved Base Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit  # Start with Audit, switch to Enforce once verified
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - monitoring
      validate:
        message: >-
          Images must come from the internal registry or approved sources.
          Allowed: registry.casino-platform.internal/*
          Contact platform-team@casino-platform.internal for exceptions.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.containers[].image }}"
                operator: AnyNotIn
                value:
                  - "registry.casino-platform.internal/*"

---
# ============================================================
# Policy 5: Mutate — Auto-add Image Pull Secrets
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-registry-pull-secret
  annotations:
    policies.kyverno.io/title: Auto-add Registry Pull Secret
    policies.kyverno.io/category: Convenience
spec:
  rules:
    - name: add-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - casino-games
                - casino-platform
                - casino-backoffice
                - casino-monitoring
                - production
                - staging
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: harbor-registry-credentials

---
# ============================================================
# Policy 6: Generate — Create Registry Secret in New Namespaces
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-registry-secret
  annotations:
    policies.kyverno.io/title: Sync Registry Credentials to Namespaces
spec:
  rules:
    - name: sync-harbor-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  casino-registry-access: "true"
      generate:
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: harbor-registry-credentials
        namespace: "{{ request.object.metadata.name }}"
        clone:
          namespace: registry
          name: harbor-registry-credentials

---
# ============================================================
# PolicyException — Allow Monitoring Stack External Images
# ============================================================
apiVersion: kyverno.io/v2beta1
kind: PolicyException
metadata:
  name: allow-monitoring-external
  namespace: kyverno
spec:
  exceptions:
    - policyName: restrict-base-images
      ruleNames:
        - allowed-registries
    - policyName: require-image-signature
      ruleNames:
        - verify-cosign-signature
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - monitoring
            - logging
