# docker-compose.yml for internal Docker registry
# Includes registry service with TLS and a web UI for management
version: '3.8'
services:
  registry:
    image: registry:2.8
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
    volumes:
      - ./certs:/certs:ro
      - registry_data:/var/lib/registry
    restart: always
    networks:
      - registry_network

  registry-ui:
    image: joxit/docker-registry-ui:2.5.7
    ports:
      - "8080:80"
    environment:
      REGISTRY_URL: https://registry:5000
      REGISTRY_TITLE: "iGaming Container Registry"
    depends_on:
      - registry
    networks:
      - registry_network

volumes:
  registry_data:

networks:
  registry_network:
    driver: bridge
