# Aqua Security integration configuration for internal Docker registry
# Deploys Aqua scanner as a Kubernetes Deployment with 2 replicas
apiVersion: v1
kind: ConfigMap
metadata:
  name: aqua-registry-scanner
  namespace: security
data:
  config.yaml: |
    aqua:
      server: "aqua-server.aqua.svc.cluster.local:443"
      username: "${AQUA_USERNAME}"
      password: "${AQUA_PASSWORD}"
      registry: "internal-registry.local:5000"
      scanner:
        enabled: true
        image: "aquasec/scanner:6.2"
        timeout: "30m"
      policies:
        - name: "igaming-base-policy"
          severity: "high"
          block: true
          conditions:
            - "vulnerability_severity in ['critical', 'high']"
            - "malware_detected == true"
        - name: "pci-compliance-policy"
          severity: "medium"
          block: false
          conditions:
            - "pci_dss_violation == true"
      notifications:
        slack:
          enabled: true
          webhook: "${SLACK_WEBHOOK}"
          channels:
            - "#security-alerts"
            - "#devops"
        email:
          enabled: true
          recipients:
            - "security@igaming.com"
            - "devops@igaming.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqua-scanner
  namespace: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aqua-scanner
  template:
    metadata:
      labels:
        app: aqua-scanner
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scanner
        # Pinned: a scanner that silently changes version changes its findings,
        # and an audit trail that cannot say which scanner produced a verdict is
        # not an audit trail. Re-pin deliberately, never by pulling :latest.
        image: aquasec/scanner:6.2
        env:
        - name: AQUA_SERVER
          valueFrom:
            configMapKeyRef:
              name: aqua-registry-scanner
              key: aqua.server
        - name: AQUA_USERNAME
          valueFrom:
            secretKeyRef:
              name: aqua-credentials
              key: username
        - name: AQUA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aqua-credentials
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
        # The scanner unpacks image layers before inspecting them, so it needs a
        # writable scratch area. An emptyDir gives it one without giving up
        # readOnlyRootFilesystem: the scratch space dies with the pod.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: aqua-registry-scanner
      - name: tmp
        emptyDir: {}
