# =============================================================================
# Chapter 37: Internal Docker Registry - Local Development Stack
# =============================================================================
# docker-compose up -d
# Access: https://localhost:5000/v2/_catalog
# UI: http://localhost:8080
# =============================================================================

version: '3.8'

services:
  # ============================================
  # Docker Registry
  # ============================================
  registry:
    image: registry:2.8
    container_name: igaming-registry
    restart: always
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_DEBUG_ADDR: 0.0.0.0:5001
      REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: redis
      REGISTRY_REDIS_ADDR: redis:6379
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      - ./certs:/certs:ro
      - ./auth:/auth:ro
    depends_on:
      - redis
    networks:
      - registry-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:8-alpine
    container_name: registry-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - registry-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # Registry UI
  # ============================================
  registry-ui:
    image: joxit/docker-registry-ui:2.5.7
    container_name: registry-ui
    restart: always
    ports:
      - "8080:80"
    environment:
      REGISTRY_URL: https://registry:5000
      REGISTRY_TITLE: "iGaming Container Registry"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_PROXY_PASS_URL: https://registry:5000
      SINGLE_REGISTRY: "true"
    depends_on:
      - registry
    networks:
      - registry-network

  # ============================================
  # Trivy Scanner
  # ============================================
  trivy:
    image: aquasec/trivy:0.58.2
    container_name: registry-trivy
    restart: always
    command: ["server", "--listen", "0.0.0.0:8080"]
    ports:
      - "8081:8080"
    environment:
      TRIVY_CACHE_DIR: /root/.cache
    volumes:
      - trivy-cache:/root/.cache
    networks:
      - registry-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: registry-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - registry-network

  # ============================================
  # Grafana (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: registry-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - registry-network

networks:
  registry-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.37.0.0/16

volumes:
  registry-data:
  redis-data:
  trivy-cache:
  prometheus-data:
  grafana-data:
