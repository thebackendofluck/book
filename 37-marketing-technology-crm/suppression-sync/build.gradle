task wrapper(type: Wrapper) {
  gradleVersion = '2.11'
  distributionUrl = "https://services.gradle.org/distributions/gradle-$gradleVersion-all.zip"
}

apply plugin: 'java'
apply plugin: 'scala'
apply plugin: 'application'

sourceCompatibility = 1.8
targetCompatibility = 1.8

mainClassName = "acmetocasino.Run"

applicationName = 'suppression-sp-et'

project.ext {
    scalaVersion = "2.11"
    scalaFullVersion = scalaVersion + ".7"
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'org.scalatest:scalatest_2.11:2.2.5'

    compile "org.slf4j:slf4j-api:1.7.1"
    compile "org.slf4j:log4j-over-slf4j:1.7.1"
    compile "ch.qos.logback:logback-classic:1.0.3"

    compile "net.databinder.dispatch:dispatch-core_$scalaVersion:0.11.3"
    compile "com.github.pathikrit:better-files_2.11:2.14.0"

    compile 'commons-net:commons-net:3.3'

    compile files('libs/ojdbc6.jar')
    compile "org.scalikejdbc:scalikejdbc_2.11:2.2.7"
    compile "org.scalikejdbc:scalikejdbc-config_2.11:2.2.7"
    compile 'com.typesafe:config:1.3.0'
    compile 'com.github.kxbmap:configs_2.11:0.2.5'
}


configurations.findAll { it.name != 'wsdl2java' }.each { config ->
    config.exclude group: 'geronimo'
    config.exclude group: 'org.apache.geronimo.specs'
    config.exclude group: 'commons-logging'
    config.exclude group: 'org.apache.james'
    config.exclude group: 'xalan'
    config.exclude group: 'xerces'
    config.exclude group: 'org.apache.xalan'
    config.exclude group: 'org.apache.xerces'
    config.exclude group: 'com.sun.xml.bind'
    config.exclude module: 'servlet-api'
    config.exclude module: 'log4j-over-slf4j'
}
