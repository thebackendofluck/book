# Database configuration for the SilverPop -> ExactTarget suppression sync.
#
# Migration note (Oracle → PostgreSQL):
#   - oracle.jdbc.pool.OracleDataSource → org.postgresql.ds.PGSimpleDataSource
#   - jdbc:oracle:thin:@host:1521:pdb   → jdbc:postgresql://host:5432/platform
#   - The settings query (SELECT … FROM et.sp_settings WHERE id = ANY(:ids))
#     is already PostgreSQL-native (ANY/array binding) and needs no rewrite.
#   - ScalikeJDBC SQL logging settings are driver-agnostic and stay as-is.

db.default.driver = org.postgresql.ds.PGSimpleDataSource
db.default.url = "jdbc:postgresql://platformdb.acmetocasino.com:5432/platform"
db.default.user = casino_core
db.default.password = "change-me"

scalikejdbc.global.loggingSQLAndTime.enabled=true
scalikejdbc.global.loggingSQLAndTime.logLevel=info
scalikejdbc.global.loggingSQLAndTime.warningEnabled=true
scalikejdbc.global.loggingSQLAndTime.warningThresholdMillis=1000
scalikejdbc.global.loggingSQLAndTime.warningLogLevel=warn
scalikejdbc.global.loggingSQLAndTime.singleLineMode=true
scalikejdbc.global.loggingSQLAndTime.printUnprocessedStackTrace=false
scalikejdbc.global.loggingSQLAndTime.stackTraceDepth=10

et {
  ftpHost = ftp.s7.exacttarget.com
  ftpUsername = "change-me"
  ftpPassword = "change-me"
  ftpImportDir = Import

  etCsvDirectory = "csv/et"
  spCsvDirectory = "csv/sp"
}
