global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dev-casino-api'
    static_configs:
      - targets: ['dev-api:8090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'dev-casino-api-health'
    static_configs:
      - targets: ['dev-api:8090']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s
