# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

# DEMO CAVEAT: see hub-postgres.yaml — this Secret is committed in plaintext
# for a throwaway reference cluster only. Wire it from a real secrets
# backend in production.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-br-postgres-credentials
  namespace: spoke-br
type: Opaque
stringData:
  password: spokepass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spoke-br-postgres-init
  namespace: spoke-br
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS players (
      local_player_id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      global_id uuid NOT NULL,
      status text NOT NULL DEFAULT 'active'
        CHECK (status IN ('active','local_excluded','globally_excluded')),
      jurisdiction text NOT NULL DEFAULT 'BR'
    );
    CREATE TABLE IF NOT EXISTS wallet_events (
      id bigserial PRIMARY KEY,
      local_player_id uuid NOT NULL REFERENCES players(local_player_id),
      event_type text NOT NULL CHECK (event_type IN ('DEPOSIT','WITHDRAWAL','BET','WIN','BLOCK')),
      amount_cents bigint NOT NULL DEFAULT 0,
      blocked boolean NOT NULL DEFAULT false,
      jurisdiction text NOT NULL DEFAULT 'BR',
      created_at timestamptz NOT NULL DEFAULT now()
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spoke-br-postgres-data
  namespace: spoke-br
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoke-br-postgres
  namespace: spoke-br
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: spoke-br-postgres}}
  template:
    metadata: {labels: {app: spoke-br-postgres}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - {name: POSTGRES_DB, value: spoke_br}
            - {name: POSTGRES_USER, value: spoke}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: spoke-br-postgres-credentials, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi, cpu: 500m}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            exec: {command: [pg_isready, -U, spoke, -d, spoke_br]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: spoke-br-postgres-data}
        - name: init
          configMap: {name: spoke-br-postgres-init}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spoke-br-postgres
  namespace: spoke-br
spec:
  type: ClusterIP
  selector: {app: spoke-br-postgres}
  ports: [{port: 5432, targetPort: 5432}]
