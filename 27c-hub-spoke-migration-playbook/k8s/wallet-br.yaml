---
# Companion code for "The Backend of Luck" - Chapter 27c, Migrating a Single-Jurisdiction Casino Platform to Hub & Spo.
# https://thebackendofluck.com | https://github.com/thebackendofluck/book
# SPDX-License-Identifier: Apache-2.0
#
# FOR TESTING AND EVALUATION ONLY. NOT FOR PRODUCTION USE.
# Published to demonstrate the patterns explained in the book. This code is
# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-br-src
  namespace: spoke-br
data:
  requirements.txt: |
    fastapi==0.115.0
    uvicorn[standard]==0.30.6
    psycopg2-binary==2.9.9
    redis==5.0.8
    pydantic==2.9.2
    httpx==0.27.2
  main.py: |
    __MAIN_PY__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-br
  namespace: spoke-br
spec:
  replicas: 1
  selector: {matchLabels: {app: wallet-br}}
  template:
    metadata: {labels: {app: wallet-br}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.14-slim
          command: [sh, -c]
          args:
            - "pip install --no-cache-dir --target=/deps -r /src/requirements.txt && cp /src/main.py /deps/main.py"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: src, mountPath: /src}
            - {name: deps, mountPath: /deps}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 1000m}
      containers:
        - name: wallet-br
          image: python:3.14-slim
          command: [python, -m, uvicorn, main:app, --host, 0.0.0.0, --port, "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          workingDir: /deps
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: spoke-br-postgres-credentials, key: password}
            - {name: PYTHONPATH, value: /deps}
            - {name: PG_DSN, value: "host=spoke-br-postgres.spoke-br.svc.cluster.local port=5432 dbname=spoke_br user=spoke password=$(PGPASSWORD)"}
            - {name: HUB_REDIS_URL, value: "redis://hub-redis.hub.svc.cluster.local:6379/0"}
            - {name: HUB_GLOBAL_ID_URL, value: "http://global-id.hub.svc.cluster.local:8000"}
            - {name: JURISDICTION, value: BR}
          ports: [{containerPort: 8000, name: http}]
          resources:
            requests: {memory: 64Mi, cpu: 25m}
            limits: {memory: 256Mi, cpu: 500m}
          readinessProbe:
            httpGet: {path: /v1/healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: deps, mountPath: /deps}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: src
          configMap: {name: wallet-br-src}
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-br
  namespace: spoke-br
spec:
  type: ClusterIP
  selector: {app: wallet-br}
  ports: [{port: 8000, targetPort: 8000, name: http}]
