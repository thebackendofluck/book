# rbac-wallet-service.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-service
  namespace: casino-prod
  labels:
    cluster: "{{ .Values.cluster.color }}"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wallet-service-role
  namespace: casino-prod
rules:
  # Wallet service only needs to read its own secrets and configmaps
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["casino-db", "casino-redis", "casino-jwt"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["wallet-service-config"]
    verbs: ["get", "watch"]
  # Allow reading own pod status (for health checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wallet-service-rolebinding
  namespace: casino-prod
subjects:
  - kind: ServiceAccount
    name: wallet-service
    namespace: casino-prod
roleRef:
  kind: Role
  name: wallet-service-role
  apiGroup: rbac.authorization.k8s.io
