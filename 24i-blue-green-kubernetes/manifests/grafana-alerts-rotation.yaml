# grafana-alerts-rotation.yaml
groups:
  - name: casino_rotation
    rules:
      - alert: ClusterRotationProvisionFailed
        expr: casino_rotation_phase_status{phase="provision"} == 0
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Casino cluster provision failed"
          description: "The nightly cluster provisioning phase has failed. Manual intervention required before 03:00 UTC switchover."

      - alert: ClusterRotationSwitchoverFailed
        expr: casino_rotation_phase_status{phase="switchover"} == 0
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Casino cluster switchover failed"
          description: "Switchover failed. Previous cluster is still active. Check logs immediately."

      - alert: ClusterRotationOverdue
        expr: (time() - casino_rotation_phase_timestamp_seconds{phase="switchover"}) > 90000
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Cluster rotation overdue"
          description: "No successful switchover in the last 25 hours. Rotation may be failing silently."

      - alert: BothClustersUnhealthy
        expr: |
          casino_rotation_phase_status{phase="switchover"} == 0
          and casino_rotation_phase_status{phase="provision"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
          page: "true"
        annotations:
          summary: "CRITICAL: Both cluster provision and switchover have failed"
          description: "Infrastructure is in an unknown state. Page on-call immediately."
