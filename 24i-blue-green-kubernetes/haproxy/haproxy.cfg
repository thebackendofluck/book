# /etc/haproxy/haproxy.cfg
# Casino load balancer — manages blue/green cluster traffic

global
    maxconn 50000
    log stdout format raw local0 info
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    ssl-default-bind-ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384
    ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    mode http
    # Without this, "option httplog" and the audit captures below are silently
    # discarded: the global "log" line declares a target, but each proxy still has
    # to opt in. HAProxy warns "log format ignored ... since it has no log
    # address" and the request log a regulator would ask for does not exist.
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 15s
    timeout http-keep-alive 4s
    timeout queue 30s
    option httplog
    option forwardfor
    option http-server-close
    option http-keep-alive
    retries 3
    retry-on conn-failure empty-response 503

# ── stats endpoint ───────────────────────────────────────────────────────────
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /haproxy-stats
    stats refresh 5s
    stats auth admin:${HAPROXY_STATS_PASSWORD}

# ── player-facing HTTPS frontend ─────────────────────────────────────────────
frontend casino_https
    bind *:443 ssl crt /etc/haproxy/ssl/casino.pem alpn h2,http/1.1
    bind *:80

    # Capture key request metadata for audit. These must be written before the
    # redirect: http-request rules run before redirect rules regardless of the
    # order in the file, and HAProxy warns about the misleading placement.
    http-request capture req.hdr(User-Agent) len 200
    http-request capture req.hdr(X-Forwarded-For) len 50

    redirect scheme https if !{ ssl_fc }

    # Health check bypass — always route to active backend
    acl is_health_check path /health /ready /live
    use_backend casino_active if is_health_check

    # WebSocket detection
    acl is_websocket hdr(Upgrade) -i websocket
    use_backend casino_ws_active if is_websocket

    default_backend casino_active

# ── HTTP backend: active cluster (weight-controlled switchover) ───────────────
#
# The standby colour is marked "weight 0", NOT "backup". Measured on HAProxy
# 3.1 with two stub clusters:
#
#   green "weight 100 backup", blue healthy          -> all traffic to blue
#   green "weight 100 backup", set blue weight 0     -> all traffic to green
#   green "weight 100 backup", blue check FAILS      -> all traffic to green (!)
#   green "weight 0",          blue check FAILS      -> 503
#   both servers at weight 0                         -> 503
#
# So "backup" does not break the cutover: a weight-0 non-backup server counts as
# unusable, which is enough to activate the backup. What it does instead is make
# green a permanent hot failover target for blue. Three failed health checks on
# the active cluster, at any hour, with no switchover running, silently move
# every player onto a cluster that does not hold the primary lease and is
# therefore read-only: logins and page loads succeed, every bet and every wallet
# debit fails the fence in cluster_registry. That is a worse failure than an
# outage, because it looks like a working casino.
#
# Weight 0 means "in the backend, health checked, taking no new connections", and
# nothing else. Traffic reaches a colour only when the switchover has raised its
# weight, which happens only after that colour holds the lease. If the active
# cluster dies outside a switchover the backend returns 503, which pages someone,
# instead of quietly half-working.
#
# Note that "backup" cannot be cleared at runtime either: the Runtime API offers
# "set weight" and "set server state" and neither toggles it, so the flag would
# have had to be right in the file regardless.
#
# switchover.sh raises the incoming colour to 100 *before* dropping the outgoing
# colour to 0: the ordering is load bearing, since a moment with both at weight 0
# is a 503 for every player in the backend.
#
# /etc/haproxy/active-cluster is written by switchover.sh as a record of the
# active colour for operators and the rotation state file. HAProxy does not read
# it, and no reload or signal is involved in the cutover.
backend casino_active
    balance leastconn

    # Health check needs the Host header, because /health is served by an ingress
    # that routes on it. Smuggling the header into the option httpchk version
    # string with \r\n is rejected outright by HAProxy 2.2 and later
    # ("hiding headers or body at the end of the version string is
    # unsupported"), so the whole config failed to load: use http-check send.
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host casino.internal
    http-check expect status 200

    server blue  10.0.10.11:30080 check inter 2s fall 3 rise 2 weight 100
    server green 10.0.10.21:30080 check inter 2s fall 3 rise 2 weight 0

# ── WebSocket backend: active cluster ────────────────────────────────────────
# "balance source" hashes clients onto the eligible servers. A weight-0 server is
# removed from the hash map, so the same raise-then-drop ordering applies here.
backend casino_ws_active
    balance source
    option http-server-close
    timeout tunnel 3600s

    server blue  10.0.10.11:30081 check inter 5s fall 3 rise 2 weight 100
    server green 10.0.10.21:30081 check inter 5s fall 3 rise 2 weight 0
