# cdn-origin-mobile.conf — CDN Origin Server Configuration for Mobile
#
# NGINX origin server configuration serving mobile-optimised assets
# with Client Hints support, image variant generation, and jurisdiction-aware
# cache headers for CDN edge layer.
#
# Chapter 14 — Mobile-First Architecture for iGaming

worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'ect="$http_ect" dpr="$http_dpr" vw="$http_viewport_width"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/x-mpegurl image/svg+xml;

    # -------------------------------------------------------------------------
    # Client Hints declaration (enables DPR, ECT, Viewport-Width in requests)
    # -------------------------------------------------------------------------
    map $http_accept $accept_image_format {
        ~image/avif   "avif";
        ~image/webp   "webp";
        default       "jpeg";
    }

    # Classify network based on ECT header from CDN
    map $http_ect $network_quality {
        "4g"       "fast";
        "3g"       "medium";
        "2g"       "slow";
        "slow-2g"  "slow";
        default    "medium";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name origin.acmetocasino.com;

        root /var/www/casino;

        # -----------------------------------------------------------------------
        # Client Hints: tell browsers/CDN to send network and device headers
        # -----------------------------------------------------------------------
        add_header Accept-CH "ECT, DPR, Viewport-Width, Downlink";
        add_header Vary "Accept, DPR, Viewport-Width, ECT";
        add_header Critical-CH "ECT, DPR";

        # -----------------------------------------------------------------------
        # CORS for CDN fetches
        # -----------------------------------------------------------------------
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        add_header Access-Control-Max-Age 86400;

        # -----------------------------------------------------------------------
        # Security headers (see security-headers-mobile.inc). Any location below
        # that declares its own add_header cancels ALL inherited headers
        # (including the CORS and Client-Hints set above), so the security set
        # is re-included per location.
        # -----------------------------------------------------------------------
        include security-headers-mobile.inc;

        # -----------------------------------------------------------------------
        # Static assets: hashed filenames, long TTL (immutable)
        # -----------------------------------------------------------------------
        location ~* \.(js|css|woff2|woff|ttf|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
            expires 1y;
            access_log off;
        }

        # -----------------------------------------------------------------------
        # Images: serve AVIF/WebP based on Accept and ECT headers
        # -----------------------------------------------------------------------
        location /images/ {
            # Attempt AVIF first, then WebP, then JPEG
            set $img_ext "";
            if ($accept_image_format = "avif") { set $img_ext ".avif"; }
            if ($accept_image_format = "webp") { set $img_ext ".webp"; }

            # Reduce quality on slow connections
            set $img_quality "85";
            if ($network_quality = "slow") { set $img_quality "60"; }
            if ($network_quality = "medium") { set $img_quality "75"; }

            try_files $uri$img_ext $uri =404;

            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
            add_header Vary "Accept, ECT";
            add_header X-Image-Quality $img_quality;
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
            access_log off;
        }

        # -----------------------------------------------------------------------
        # HLS manifests: very short TTL (live streams)
        # -----------------------------------------------------------------------
        location ~* \.m3u8$ {
            add_header Cache-Control "max-age=0, s-maxage=1, stale-while-revalidate=1";
            add_header Access-Control-Allow-Origin "*";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
        }

        # -----------------------------------------------------------------------
        # HLS segments: immutable
        # -----------------------------------------------------------------------
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=86400, s-maxage=86400, immutable";
            add_header Access-Control-Allow-Origin "*";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
            access_log off;
        }

        # -----------------------------------------------------------------------
        # PWA manifest and service worker
        # -----------------------------------------------------------------------
        location = /manifest.json {
            add_header Cache-Control "no-cache";
            add_header Content-Type "application/manifest+json";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
        }

        # -----------------------------------------------------------------------
        # Health check
        # -----------------------------------------------------------------------
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
            # add_header above cancels inherited headers; re-apply security set
            include security-headers-mobile.inc;
        }
    }
}
