# Chapter 7: Mobile-First Architecture for iGaming
# Fastlane Blue-Green Deployment Configuration
#
# Implements a blue-green deployment strategy for iOS casino apps:
# - Builds and uploads to TestFlight (blue environment)
# - Monitors crash rates for 24 hours post-deploy
# - Automatically promotes to App Store if crash rate < 1%
# - Rolls back to previous version if threshold is exceeded
#
# Reference: Chapter 7 - Blue-Green Deployment for Mobile Apps section

default_platform(:ios)

platform :ios do
  desc "Deploy to TestFlight with blue-green strategy"
  lane :deploy_testflight do
    # Increment build number
    increment_build_number

    # Build app
    build_app(
      scheme: "CasinoApp",
      configuration: "Release",
      export_method: "app-store"
    )

    # Upload to TestFlight (blue environment)
    upload_to_testflight(
      skip_waiting_for_build_processing: false,
      notify_external_testers: true,
      groups: ["Beta Testers"],
      changelog: generate_changelog
    )

    # Monitor crash rates for 24 hours
    monitor_crash_rates(
      duration: 86400, # 24 hours
      threshold: 0.01  # 1% crash rate threshold
    )

    # If stable, promote to production
    if crash_rate_acceptable?
      upload_to_app_store(
        force: true,
        skip_metadata: false,
        skip_screenshots: false
      )
    else
      # Rollback to previous version
      rollback_to_previous_version
      notify_team("Deployment failed - crash rate too high")
    end
  end
end
