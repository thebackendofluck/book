# rtmp-secondary.conf — Secondary RTMP Ingest Server Configuration
#
# Receives streams pushed from the primary ingest server as a hot standby.
# In the event of primary failure, studio GCUs are re-pointed here via DNS.
# This server does NOT authenticate streams (trusts primary's authentication)
# and does NOT push to another server (prevents infinite relay loops).
#
# Chapter 13 — Live Casino Streaming Infrastructure

worker_processes auto;
worker_rlimit_nofile 32768;

events {
    worker_connections 2048;
    use epoll;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 500;
        timeout 30s;

        # ---------------------------------------------------------------
        # live application: accepts relay from primary and direct publish
        #                    during failover
        # ---------------------------------------------------------------
        application live {
            live on;
            record off;

            # In normal operation, primary pushes here — no auth needed
            # In failover, GCUs publish directly — auth callback activated
            on_publish http://auth-service:8080/rtmp/auth;
            on_publish_done http://orchestrator:3000/hooks/stream-ended-secondary;

            # Push to mediasoup bridge (same as primary)
            push rtmp://mediasoup-bridge:1935/live;

            # HLS fallback from secondary origin
            hls on;
            hls_path /var/hls;
            hls_fragment 1s;
            hls_playlist_length 4s;
            hls_cleanup on;
            hls_continuous on;

            access_log /var/log/nginx/rtmp_access.log;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        location /hls {
            alias /var/hls;

            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
            }

            location ~* \.m3u8$ {
                add_header Cache-Control "max-age=0, s-maxage=1, stale-while-revalidate=1";
                add_header Access-Control-Allow-Origin "*";
                add_header X-Served-By "rtmp-secondary";
            }

            location ~* \.ts$ {
                add_header Cache-Control "max-age=86400, s-maxage=86400, immutable";
                add_header Access-Control-Allow-Origin "*";
                add_header X-Served-By "rtmp-secondary";
            }
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"rtmp-ingest-secondary"}';
            add_header Content-Type application/json;
        }

        location /stat {
            rtmp_stat all;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
