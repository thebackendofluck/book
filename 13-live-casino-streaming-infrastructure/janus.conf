# janus.conf — Janus WebRTC Gateway Configuration
#
# Alternative SFU configuration using Janus Gateway instead of mediasoup.
# Janus is appropriate when a standards-compliant C-based SFU is preferred,
# or when the streaming service needs to interoperate with SIP/legacy endpoints.
#
# For live casino, Janus's VideoRoom plugin handles per-table rooms with
# simulcast support. The EchoTest plugin is useful for latency measurement.
#
# Reference: https://janus.conf.meetecho.com/
# Chapter 13 — Live Casino Streaming Infrastructure

[general]
configs_folder = /etc/janus
plugins_folder = /usr/lib/janus/plugins
transports_folder = /usr/lib/janus/transports
events_folder = /usr/lib/janus/events
loggers_folder = /usr/lib/janus/loggers
debug_level = 4            # 0=fatal, 1=error, 2=warn, 3=info, 4=verbose, 5=debug
log_timestamps = true
log_colors = true
daemonize = false

[certificates]
# TLS certificates for HTTPS/WSS
cert_pem = /etc/janus/certs/server.crt
cert_key = /etc/janus/certs/server.key
# cert_pwd =

[media]
# DTLS-SRTP settings
dtls_mtu = 1200
no_media_timer = 30        # Close PeerConnection after 30s of no media
slowlink_threshold = 4     # Consecutive NACKs before sending slowlink event
twcc_period = 200          # Transport-wide CC reporting interval (ms)

# RTP port ranges (must not overlap with mediasoup if running both)
rtp_port_range = 20000-20999

[nat]
# ICE / STUN / TURN settings
stun_server = stun.l.google.com
stun_port = 19302

# TURN server for symmetric NAT traversal (required for ~20% of players)
# turn_server = turn.example.com
# turn_port = 3478
# turn_type = udp
# turn_user = janus-turn-user
# turn_pwd = ${TURN_PASSWORD}

# Announced IPs (must match PUBLIC_IP for server-reflexive candidates)
nat_1_1_mapping = ${PUBLIC_IP}
ice_lite = true             # Server is always addressable; skip relay candidates

[plugins]
# Enable only the plugins required for live casino
disable = libjanus_nosip.so,libjanus_textroom.so,libjanus_lua.so,libjanus_duktape.so

[transports]
# WebSocket transport (primary for live casino signalling)
disable = libjanus_pfunix.so,libjanus_rabbitmq.so,libjanus_mqtt.so

[loggers]
disable = libjanus_jsonlog.so

[admin]
admin_ws = true
admin_ws_port = 7188
admin_ws_interface = lo     # Admin WebSocket on loopback only
# admin_secret = ${JANUS_ADMIN_SECRET}
token_auth = true
