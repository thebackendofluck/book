# =============================================================================
# NGINX-RTMP + SRT Ingest Server Configuration
# Live Casino Streaming Infrastructure - Chapter 6
#
# Purpose: Dual-protocol ingest from studio cameras (RTMP + SRT) with
#          redundant encoding, authentication, and failover.
#
# Prerequisites:
#   - nginx compiled with nginx-rtmp-module (https://github.com/arut/nginx-rtmp-module)
#   - SRT (Secure Reliable Transport) via srt-live-transmit or srt-live-server
#   - FFmpeg 6.x+ with libsrt support
#   - SSL certificates for RTMPS
#
# Deployment:
#   nginx -c /etc/nginx/rtmp_srt_server.conf -t && nginx -s reload
# =============================================================================

# --- Worker configuration for high-throughput streaming ---
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

# =============================================================================
# RTMP Block - Studio Camera Ingest
# =============================================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 512;

        # Timeout for idle connections (cameras should push continuously)
        timeout 30s;
        ping 10s;
        ping_timeout 5s;

        # --- Live Casino Ingest Application ---
        application live-casino {
            live on;
            record off;

            # Authentication: validate stream key against casino backend
            # The backend verifies table_id + studio credentials
            on_publish http://127.0.0.1:8080/api/v1/stream/auth;
            on_publish_done http://127.0.0.1:8080/api/v1/stream/disconnect;
            on_play http://127.0.0.1:8080/api/v1/stream/play-auth;

            # Drop idle streams after 10 seconds (camera failure detection)
            drop_idle_publisher 10s;

            # Limit to authorized studio IPs
            allow publish 10.0.0.0/8;      # Studio network
            allow publish 172.16.0.0/12;    # VPN backup
            deny publish all;

            # --- Transcoding to multiple quality tiers ---
            # Source: 4K@60fps from studio cameras
            # Output tiers for adaptive bitrate

            # Tier 1: 1080p@30fps (primary delivery)
            exec_push ffmpeg -i rtmp://127.0.0.1:1935/live-casino/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                -profile:v high -level 4.1
                -b:v 4500k -maxrate 5000k -bufsize 9000k
                -vf "scale=1920:1080,fps=30"
                -c:a aac -b:a 128k -ar 48000 -ac 2
                -f flv rtmp://127.0.0.1:1935/transcode/${name}_1080p 2>>/var/log/nginx/ffmpeg_1080p.log;

            # Tier 2: 720p@30fps (mid-quality)
            exec_push ffmpeg -i rtmp://127.0.0.1:1935/live-casino/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                -profile:v main -level 3.1
                -b:v 2500k -maxrate 3000k -bufsize 5000k
                -vf "scale=1280:720,fps=30"
                -c:a aac -b:a 96k -ar 48000 -ac 2
                -f flv rtmp://127.0.0.1:1935/transcode/${name}_720p 2>>/var/log/nginx/ffmpeg_720p.log;

            # Tier 3: 480p@30fps (low bandwidth / mobile fallback)
            exec_push ffmpeg -i rtmp://127.0.0.1:1935/live-casino/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                -profile:v baseline -level 3.0
                -b:v 1000k -maxrate 1200k -bufsize 2000k
                -vf "scale=854:480,fps=30"
                -c:a aac -b:a 64k -ar 44100 -ac 1
                -f flv rtmp://127.0.0.1:1935/transcode/${name}_480p 2>>/var/log/nginx/ffmpeg_480p.log;

            # --- LL-HLS fallback output ---
            exec_push ffmpeg -i rtmp://127.0.0.1:1935/live-casino/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                -b:v 3000k -maxrate 3500k -bufsize 6000k
                -vf "scale=1280:720,fps=30"
                -c:a aac -b:a 128k -ar 48000
                -f hls
                -hls_time 1
                -hls_list_size 3
                -hls_flags delete_segments+independent_segments
                -hls_segment_type fmp4
                -hls_fmp4_init_filename init_${name}.mp4
                -hls_segment_filename /var/www/hls/${name}_%03d.m4s
                /var/www/hls/${name}.m3u8 2>>/var/log/nginx/ffmpeg_hls.log;
        }

        # --- Transcoded streams (internal relay) ---
        application transcode {
            live on;
            record off;

            # Only accept from local transcoding
            allow publish 127.0.0.1;
            deny publish all;

            # Push to mediasoup/Janus via RTMP relay
            # The SFU ingests these for WebRTC distribution
            push rtmp://sfu-primary.internal:1935/webrtc-ingest;
            push rtmp://sfu-secondary.internal:1935/webrtc-ingest;
        }

        # --- Recording application (compliance/audit) ---
        application recording {
            live on;
            record all;
            record_path /mnt/recordings/live-casino;
            record_suffix _%Y%m%d_%H%M%S.flv;
            record_max_size 4096m;
            record_unique on;

            # Notify recording service for compliance indexing
            on_record_done http://127.0.0.1:8080/api/v1/recording/complete;
        }
    }

    # --- RTMPS (TLS-encrypted ingest) for remote studios ---
    server {
        listen 1936 ssl;
        chunk_size 4096;

        ssl_certificate /etc/ssl/certs/streaming.crt;
        ssl_certificate_key /etc/ssl/private/streaming.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        application live-casino-secure {
            live on;
            record off;

            on_publish http://127.0.0.1:8080/api/v1/stream/auth;
            drop_idle_publisher 10s;

            # Relay to main ingest for processing
            push rtmp://127.0.0.1:1935/live-casino;
        }
    }
}

# =============================================================================
# HTTP Block - Stats, HLS delivery, health checks
# =============================================================================
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # --- RTMP Statistics (Prometheus-compatible) ---
    server {
        listen 8888;
        server_name localhost;

        # RTMP stats page (XML)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            allow 10.0.0.0/8;
            deny all;
        }

        # Health check endpoint for load balancer
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"rtmp-ingest"}';
            add_header Content-Type application/json;
        }

        # Metrics endpoint (scraped by Prometheus)
        location /metrics {
            # Served by nginx-rtmp-exporter sidecar
            proxy_pass http://127.0.0.1:9114/metrics;
            allow 10.0.0.0/8;
            deny all;
        }
    }

    # --- LL-HLS Delivery ---
    server {
        listen 8080;
        server_name hls.livecasino.internal;

        location /hls {
            alias /var/www/hls;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp4 mp4;
                video/mp2t ts;
                video/iso.segment m4s;
            }

            add_header Cache-Control "no-cache, no-store";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff";
        }
    }
}

# =============================================================================
# SRT Ingest Configuration (srt-live-server)
# Run separately: srt-live-server -c /etc/srt/srt-server.conf
# =============================================================================
# SRT config file (save as /etc/srt/srt-server.conf):
#
# [server]
# host = 0.0.0.0
# port = 9000
# latency = 120           # 120ms SRT latency (studio LAN)
# maxbw = 50000000        # 50 Mbps per connection
# payload_size = 1316     # Standard SRT payload
# connect_timeout = 3000  # 3s connection timeout
# peer_idle_timeout = 10000  # 10s idle timeout
# passphrase = ${SRT_PASSPHRASE}  # AES-256 encryption
# pbkeylen = 32
#
# [upstream]
# # Relay SRT to RTMP ingest for unified processing
# type = relay
# output = rtmp://127.0.0.1:1935/live-casino/${stream_id}
#
# Usage from studio:
#   ffmpeg -i /dev/video0 -c:v libx264 -preset ultrafast \
#     -f mpegts "srt://ingest.livecasino.com:9000?streamid=table_42_cam_1&passphrase=SECRET"
