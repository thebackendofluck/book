# =============================================================================
# Kubernetes Deployment - mediasoup SFU Cluster for Live Casino
# Chapter 6 - Live Casino Streaming Infrastructure
#
# Purpose: Production Kubernetes manifests for deploying a horizontally-scaled
# mediasoup SFU cluster with:
#   - Host networking for WebRTC UDP port ranges
#   - Anti-affinity for fault tolerance across nodes
#   - GPU node affinity for NVENC-capable nodes
#   - Prometheus monitoring + Grafana dashboards
#   - HPA for auto-scaling based on consumer count
#   - PodDisruptionBudget for zero-downtime upgrades
#
# Prerequisites:
#   - Kubernetes 1.28+
#   - Nodes with hostNetwork capability and UDP port range 40000-49999 open
#   - Container registry with mediasoup image
#   - TURN server deployment (coturn)
#
# Deployment:
#   kubectl apply -f sfu-cluster.yaml
#   kubectl -n live-casino rollout status deployment/mediasoup-sfu
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: live-casino
  labels:
    app.kubernetes.io/part-of: live-casino-streaming
    istio-injection: disabled  # WebRTC requires host networking, skip mesh

---
# =============================================================================
# ConfigMap - mediasoup runtime configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediasoup-config
  namespace: live-casino
data:
  LISTEN_IP: "0.0.0.0"
  LISTEN_PORT: "3000"
  METRICS_PORT: "9100"
  LOG_LEVEL: "info"
  NUM_WORKERS: "0"  # 0 = auto-detect CPU cores
  NODE_ENV: "production"

---
# =============================================================================
# Secret - TURN credentials and SRT passphrase
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mediasoup-secrets
  namespace: live-casino
type: Opaque
stringData:
  TURN_USERNAME: "livecasino-turn"
  TURN_CREDENTIAL: "replace-with-vault-injected-secret"
  SRT_PASSPHRASE: "replace-with-vault-injected-secret"

---
# =============================================================================
# Deployment - mediasoup SFU workers
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediasoup-sfu
  namespace: live-casino
  labels:
    app: mediasoup-sfu
    app.kubernetes.io/name: mediasoup-sfu
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: live-casino-streaming
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: mediasoup-sfu
  template:
    metadata:
      labels:
        app: mediasoup-sfu
        app.kubernetes.io/name: mediasoup-sfu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      # Host networking required for WebRTC UDP port range
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Service account for RBAC
      serviceAccountName: mediasoup-sfu

      # Pod-level hardening (CIS 4.1 / ch23.3)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread across availability zones
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mediasoup-sfu
                topologyKey: topology.kubernetes.io/zone
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mediasoup-sfu
                topologyKey: kubernetes.io/hostname

        # Schedule on streaming-optimized nodes
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.livecasino.com/streaming
                    operator: In
                    values:
                      - "true"
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - c6i.8xlarge    # 32 vCPUs, compute-optimized
                      - c6i.12xlarge   # 48 vCPUs
                      - c7g.8xlarge    # ARM Graviton3

      # Tolerate streaming-dedicated node taints
      tolerations:
        - key: dedicated
          operator: Equal
          value: streaming
          effect: NoSchedule

      # Graceful shutdown: drain connections before termination
      terminationGracePeriodSeconds: 120

      containers:
        - name: mediasoup
          image: registry.livecasino.com/mediasoup-sfu:1.12.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
            # WebRTC UDP port range (handled by hostNetwork)

          envFrom:
            - configMapRef:
                name: mediasoup-config
            - secretRef:
                name: mediasoup-secrets

          env:
            # Announce the node's public IP for ICE candidates
            - name: MEDIASOUP_ANNOUNCED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MEDIASOUP_LISTEN_IP
              value: "0.0.0.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

          # Startup probe: allow 60s for mediasoup workers to initialize
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 12
            periodSeconds: 5

          # Liveness probe: restart if unresponsive
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: remove from service if unhealthy
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # Pre-stop hook: drain connections gracefully
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Signal the SFU to stop accepting new connections
                    curl -s -X POST http://localhost:3000/api/v1/drain
                    # Wait for existing connections to close (max 90s)
                    sleep 90

          volumeMounts:
            - name: logs
              mountPath: /var/log/live-casino
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}

      imagePullSecrets:
        - name: registry-credentials

---
# =============================================================================
# Service - Internal ClusterIP for signaling traffic
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mediasoup-sfu
  namespace: live-casino
  labels:
    app: mediasoup-sfu
spec:
  type: ClusterIP
  selector:
    app: mediasoup-sfu
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP

---
# =============================================================================
# ServiceAccount + RBAC
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mediasoup-sfu
  namespace: live-casino

---
# =============================================================================
# HorizontalPodAutoscaler - Scale based on active consumers
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediasoup-sfu
  namespace: live-casino
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediasoup-sfu
  minReplicas: 6
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cooldown to avoid flapping
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
  metrics:
    - type: Pods
      pods:
        metric:
          name: mediasoup_active_consumers
        target:
          type: AverageValue
          averageValue: "500"  # Scale up when avg consumers per pod > 500
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# =============================================================================
# PodDisruptionBudget - Zero-downtime upgrades
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mediasoup-sfu
  namespace: live-casino
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: mediasoup-sfu

---
# =============================================================================
# TURN Server Deployment (coturn)
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coturn
  namespace: live-casino
  labels:
    app: coturn
spec:
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.livecasino.com/streaming: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: streaming
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: coturn/coturn:4.15.0
          args:
            - --listening-port=3478
            - --tls-listening-port=5349
            - --relay-ip=$(NODE_IP)
            - --external-ip=$(NODE_IP)
            - --min-port=50000
            - --max-port=59999
            - --user=livecasino-turn:replace-with-vault-injected-secret
            - --realm=livecasino.com
            - --cert=/etc/turn/tls.crt
            - --pkey=/etc/turn/tls.key
            - --no-multicast-peers
            - --no-cli
            - --log-file=stdout
            - --fingerprint
            - --lt-cred-mech
            - --stale-nonce=600
            - --max-bps=10000000
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 3478
              protocol: UDP
            - containerPort: 3478
              protocol: TCP
            - containerPort: 5349
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: turn-tls
              mountPath: /etc/turn
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: turn-tls
          secret:
            secretName: turn-tls-cert
        - name: tmp
          emptyDir: {}

---
# =============================================================================
# NetworkPolicy - Restrict traffic to streaming components
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediasoup-sfu-policy
  namespace: live-casino
spec:
  podSelector:
    matchLabels:
      app: mediasoup-sfu
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow signaling from API gateway
    - from:
        - namespaceSelector:
            matchLabels:
              name: api-gateway
      ports:
        - port: 3000
          protocol: TCP
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 9100
          protocol: TCP
    # Allow WebRTC UDP from anywhere (player connections)
    - ports:
        - port: 40000
          endPort: 49999
          protocol: UDP
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
    # Allow TURN relay
    - ports:
        - port: 50000
          endPort: 59999
          protocol: UDP
    # Allow RTMP ingest communication
    - to:
        - podSelector:
            matchLabels:
              app: rtmp-ingest
      ports:
        - port: 1935
          protocol: TCP

---
# =============================================================================
# ServiceMonitor - Prometheus Operator integration
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mediasoup-sfu
  namespace: live-casino
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: mediasoup-sfu
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
