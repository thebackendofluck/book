# rtmp.conf — Primary RTMP Ingest Server Configuration
#
# NGINX RTMP module configuration for live casino studio ingest.
# Receives RTMP streams from studio Game Control Units (GCUs),
# authenticates them, generates HLS fallback, and pushes to secondary ingest.
#
# Requirements: nginx-rtmp-module (tiangolo/nginx-rtmp Docker image)
# Chapter 13 — Live Casino Streaming Infrastructure

worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 1000;
        timeout 30s;

        # ---------------------------------------------------------------
        # live application: primary ingest for studio cameras
        # ---------------------------------------------------------------
        application live {
            live on;
            record off;
            interleave on;

            # Stream key authentication via callback
            # Returns 200 to allow, 4xx to reject
            on_publish http://auth-service:8080/rtmp/auth;
            on_publish_done http://orchestrator:3000/hooks/stream-ended;
            on_play http://auth-service:8080/rtmp/play-auth;
            on_update http://orchestrator:3000/hooks/stream-update;
            notify_update_timeout 30s;
            notify_relay_redirect on;

            # Push redundant copy to secondary ingest for failover
            push rtmp://rtmp-ingest-secondary:1935/live;

            # Push to mediasoup bridge for WebRTC distribution
            push rtmp://mediasoup-bridge:1935/live;

            # HLS fallback (for viewers who cannot use WebRTC)
            hls on;
            hls_path /var/hls;
            hls_fragment 1s;
            hls_playlist_length 4s;
            hls_cleanup on;
            hls_continuous on;

            # LL-HLS partial segments (Apple Low-Latency HLS)
            hls_fragment_naming system;
            hls_type live;

            # Access log for regulatory audit trail
            access_log /var/log/nginx/rtmp_access.log;

            # Allow only known studio IP ranges to publish
            # Uncomment and update for production:
            # allow publish 10.0.0.0/8;    # Internal studio network
            # allow publish 172.16.0.0/12; # Studio VPN range
            # deny publish all;
        }

        # ---------------------------------------------------------------
        # relay application: relay-only (no direct publish from public)
        # ---------------------------------------------------------------
        application relay {
            live on;
            record off;
            deny publish all;
        }

        # ---------------------------------------------------------------
        # vod application: video-on-demand for game recordings
        # ---------------------------------------------------------------
        application vod {
            play /var/recordings;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip for HLS manifests (not for binary segments)
    gzip on;
    gzip_types text/plain application/x-mpegURL application/vnd.apple.mpegurl;

    server {
        listen 8080;
        server_name _;

        # ---------------------------------------------------------------
        # HLS delivery endpoint
        # Cache manifests briefly; segments are immutable
        # ---------------------------------------------------------------
        location /hls {
            alias /var/hls;

            types {
                application/vnd.apple.mpegurl  m3u8;
                video/mp2t                     ts;
                video/mp4                      mp4;
            }

            # Manifests: low TTL (live playlist changes every ~1s)
            location ~* \.m3u8$ {
                add_header Cache-Control "max-age=0, s-maxage=1, stale-while-revalidate=1";
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range";
            }

            # Segments: immutable, long TTL
            location ~* \.ts$ {
                add_header Cache-Control "max-age=86400, s-maxage=86400, immutable";
                add_header Access-Control-Allow-Origin "*";
            }

            add_header Access-Control-Allow-Origin "*";
        }

        # ---------------------------------------------------------------
        # RTMP statistics endpoint (internal only)
        # ---------------------------------------------------------------
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;

            # Restrict to internal networks only
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # ---------------------------------------------------------------
        # Health check endpoint (used by load balancer)
        # ---------------------------------------------------------------
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"rtmp-ingest-primary"}';
            add_header Content-Type application/json;
        }

        # ---------------------------------------------------------------
        # Prometheus metrics (scraped by monitoring stack)
        # ---------------------------------------------------------------
        location /metrics {
            # Stub — real metrics via nginx-prometheus-exporter sidecar
            stub_status on;
            access_log off;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
