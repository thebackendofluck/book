# /etc/yum.conf
# STIG-hardened yum configuration for iGaming servers
# DISA STIG Control V-204447 (CAT I High): Require GPG signatures on all packages
# Any package without a valid GPG signature will be rejected.
# Applied during Packer AMI build via STIG hardening script.
#
# Chapter 39: Security Incident Response -- STIG hardening (AMI build pipeline)

[main]
cachedir=/var/cache/yum/$basearch/$releasever
keepcache=0
debuglevel=2
logfile=/var/log/yum.log
exactarch=1
obsoletes=1

# V-204447: Enforce GPG signature checking on all package installations
# Setting to 0 is prohibited by DISA STIG -- will fail compliance scan
gpgcheck=1

# Also enforce for local packages (prevents installing unsigned RPMs from local paths)
localpkg_gpgcheck=1

plugins=1
installonly_limit=5
bugtracker_url=http://bugs.centos.org/yum5bug
distroverpkg=centos-release

# Security: disable deltarpm (complexity without security benefit on hardened hosts)
deltarpm=0

# Require TLS for all YUM repository connections
sslverify=1
