# US Reporting Service Configuration
# All sensitive values are loaded from environment variables in production.

platform-db-url="jdbc:postgresql://localhost:5432/devdb"
platform-db-url=${?PDB_URL}

platform-db-user="report_user"
platform-db-user=${?PDB_USER}

platform-db-password="changeme"
platform-db-password=${?PDB_PASSWORD}

# Alert configuration
send-alerts=false
send-alerts=${?SEND_ALERTS}

heartbeat-enabled=false
heartbeat-enabled=${?HEARTBEAT_ENABLED}

ops-genie-api-key=${OPSGENIE_API_KEY}

# Multi-supplier aggregation: each supplier provides wagering data
# in its own format (SFTP CSV or database query)
available-suppliers=["igt", "netent", "kambi", "evolution"]
available-suppliers=${?AVAILABLE_SUPPLIERS}

# Game service integration (optional enrichment)
game-service-api-url="http://game-service.internal:8080/api"
game-service-api-url=${?GAME_SERVICE_API_URL}

game-service-enabled=false
game-service-enabled=${?GAME_SERVICE_ENABLED}

# Per-supplier report configuration (loaded from env in production)
reports-for-igt=${?REPORTS_FOR_IGT}
reports-for-netent=${?REPORTS_FOR_NETENT}
reports-for-evolution=${?REPORTS_FOR_EVOLUTION}

# Connection pool (c3p0)
c3p0 {
  maxPoolSize=30
  minPoolSize=3
  idleConnectionTestPeriod=120
  preferredTestQuery="select 1"
  named-configs {
    stage {
      driverClass = "org.postgresql.Driver"
      jdbcUrl = ${platform-db-url}
      user = ${platform-db-user}
      password = ${platform-db-password}
    }
    prod {
      driverClass = "org.postgresql.Driver"
      jdbcUrl = ${platform-db-url}
      user = ${platform-db-user}
      password = ${platform-db-password}
    }
  }
}

# Monitoring (Datadog via Kamon)
kamon {
  environment {
    service = "us-reporting"
    tags {
      state = "XX"
      state = ${?DATA_DOG_MONITORING_STATE}
      env = ${?ENV}
    }
  }
  modules {
    datadog-agent {
      enabled = false
      enabled = ${?KAMON_MODULES_DATADOG_AGENT_ENABLED}
    }
    datadog-trace-agent {
      enabled = false
      enabled = ${?KAMON_MODULES_DATADOG_TRACE_AGENT_ENABLED}
    }
    host-metrics { enabled = no }
  }
}
