# AutoMySQLBackup Configuration
# AcmetoCasino legacy platform database backup
# Runs daily via crontab, backs up all databases

# MySQL credentials (in production, use .my.cnf or secrets manager)
CONFIG_mysql_dump_username='backup_user'
CONFIG_mysql_dump_password='REDACTED'
CONFIG_mysql_dump_host='localhost'

# Backup directory
CONFIG_backup_dir='/backups/mysql'

# Backup all databases
CONFIG_db_names=()
CONFIG_db_month_names=()

# Rotation: keep 6 days of daily, 5 weeks of weekly, 5 months of monthly
#CONFIG_rotation_daily=6
#CONFIG_rotation_weekly=35
#CONFIG_rotation_monthly=150

# Use gzip compression
#CONFIG_mysql_dump_compression='gzip'

# Weekly backup day (Friday = 5)
#CONFIG_do_weekly="5"

# Monthly backup day (1st of month)
#CONFIG_do_monthly="01"
