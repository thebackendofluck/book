# Apache Virtual Host Configuration - Multi-Brand Casino Platform
# AcmetoCasino staging environment
# Shows how a single server hosted 20+ casino brands via name-based vhosts
# Each brand = separate DocumentRoot under /var/www/html/cms/<brand>

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" httplog
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" httpslog

### Shared image fallback: if site-specific image missing, use shared
RewriteEngine on
RewriteCond %{REQUEST_URI} ^/images/(.*)$
RewriteCond %{DOCUMENT_ROOT}/images/%1 !-f
RewriteRule ^(.*)$ /var/www/html/cms/shared/$1 [L]

############ Brand 1: stage.acmetocasino.com ###############
<VirtualHost *:80>
    ServerName stage.acmetocasino.com
    DocumentRoot /var/www/html/
    ServerAdmin itsupport@acmetocasino.com
    ErrorLog logs/error_log
    CustomLog logs/access_log httplog
    RewriteEngine on
    RewriteOptions Inherit
</VirtualHost>

<VirtualHost *:443>
    ServerName stage.acmetocasino.com
    ServerAdmin itsupport@acmetocasino.com
    DocumentRoot /var/www/html/
    ErrorLog logs/error_log
    TransferLog logs/access_log
    SSLEngine on
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLCertificateFile /usr/local/apache2/conf/ssl/acmetocasino.com.crt
    SSLCertificateChainFile /usr/local/apache2/conf/ssl/acmetocasino.com.intermediate.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/ssl/acmetocasino.com.key
    SetEnvIf User-Agent ".*MSIE.*" nokeepalive ssl-unclean-shutdown
    CustomLog logs/ssl_request_log httpslog
    RewriteEngine on
    RewriteOptions Inherit
</VirtualHost>

