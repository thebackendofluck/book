# Apache HTTP Server - Legacy Gaming Platform Configuration
# AcmetoCasino staging environment (circa 2015)
# Demonstrates: PHP5, mod_proxy to Tomcat, multi-brand vhosts, SSL

ServerRoot "/usr/local/apache2"

Listen 80
TraceEnable off
FileETag None

# Core modules for gaming platform
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule proxy_ajp_module modules/mod_proxy_ajp.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule cgid_module modules/mod_cgid.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php5_module modules/libphp5.so

<IfModule unixd_module>
User daemon
Group daemon
</IfModule>

ServerAdmin itsupport@acmetocasino.com
ServerName stage.acmetocasino.com:80

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory /var/www/html>
    AllowOverride all
    Require all granted
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"

<IfModule dir_module>
    DirectoryIndex index.html index.php
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "logs/error_log"
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog "logs/access_log" common
    CustomLog logs/language "%{accept-language}i"
</IfModule>

ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"

# Proxy for Tomcat platform and Redis
ProxyRequests Off
ProxyTimeout 300

<Proxy *>
    Order deny,allow
    Allow from all
</Proxy>

ProxyPass /platform ajp://localhost:8009/platform
ProxyPassReverse /platform ajp://localhost:8009/platform

ProxyPass /bingodf ajp://localhost:8009/bingodf
ProxyPassReverse /bingodf ajp://localhost:8009/bingodf

ProxyPass /manager ajp://localhost:8009/manager
ProxyPassReverse /manager ajp://localhost:8009/manager

ProxyPass /redis/ http://localhost:7379/
ProxyPass /redisws/ ws://localhost:7379/
ProxyPassReverse /redisws/ ws://localhost:7379/

# SSL Configuration
Include conf/extra/ssl.conf

# PHP handler
<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

# Security: Block access to all git files
RedirectMatch 404 /\.git
