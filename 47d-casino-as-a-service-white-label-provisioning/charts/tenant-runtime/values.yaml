# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

# ── Tenant identity ────────────────────────────────────────────────────────────
tenant:
  # Short alphanumeric slug used in resource names and labels (e.g. "acme", "demo").
  # Must match [a-z0-9-]{1,32}.
  slug: "changeme"
  brandName: "My Casino"
  # Primary player-facing domain (used in Ingress host).
  domain: "casino.example.com"
  # Jurisdiction identifier. Allowed: demo | br | mga | ukgc
  jurisdiction: "demo"

# ── Application image ───────────────────────────────────────────────────────────
image:
  repository: "ghcr.io/acmetocasino/caas-runtime"
  tag: "latest"
  pullPolicy: IfNotPresent

# ── Replica count ───────────────────────────────────────────────────────────────
replicas: 2

# ── Resource requests / limits ──────────────────────────────────────────────────
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ── Service ─────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Ingress ─────────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  tls:
    enabled: true
    # Leave blank to rely on cert-manager / external certificate provisioning.
    secretName: ""

# ── Network policy ──────────────────────────────────────────────────────────────
networkPolicy:
  # When true, a default-deny-all ingress/egress NetworkPolicy is created plus
  # explicit allow rules for inter-pod communication and DNS.
  enabled: true

# ── Namespace creation ──────────────────────────────────────────────────────────
namespace:
  # When true, the chart creates the namespace "casino-<tenant.slug>".
  # Set false when the namespace is pre-created by a GitOps controller.
  create: true

# ── Database (StorageClass hint for operator) ───────────────────────────────────
db:
  # StorageClass for the tenant's PostgreSQL PVC.
  class: "standard"
  # Connection secret name (must exist in the tenant namespace before install).
  secretName: "tenant-db-credentials"

# ── Extra environment variables injected into the casino runtime container ───────
extraEnv: []
# - name: FEATURE_FLAG_X
#   value: "true"

# ── Image pull secrets ──────────────────────────────────────────────────────────
imagePullSecrets: []
# - name: ghcr-pull-secret

# ── Resource quota (per-namespace noisy-neighbor guard) ─────────────────────────
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "10"
