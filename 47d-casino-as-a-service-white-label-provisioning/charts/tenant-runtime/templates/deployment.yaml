apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-runtime.fullname" . }}
  namespace: {{ include "tenant-runtime.namespace" . }}
  labels:
    {{- include "tenant-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "tenant-runtime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-runtime.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: casino-runtime
          image: {{ include "tenant-runtime.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # ── Tenant identity ───────────────────────────────────────────────
            - name: TENANT_SLUG
              value: {{ .Values.tenant.slug | quote }}
            - name: TENANT_BRAND_NAME
              value: {{ .Values.tenant.brandName | quote }}
            - name: TENANT_DOMAIN
              value: {{ .Values.tenant.domain | quote }}
            - name: TENANT_JURISDICTION
              value: {{ .Values.tenant.jurisdiction | quote }}
            # ── Database credentials (from Secret) ────────────────────────────
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: password
            {{- with .Values.extraEnv }}
            # ── Extra env vars ─────────────────────────────────────────────────
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
