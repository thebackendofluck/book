apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-runtime.fullname" . }}
  namespace: {{ include "tenant-runtime.namespace" . }}
  labels:
    {{- include "tenant-runtime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tenant-runtime.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
