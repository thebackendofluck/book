{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tenant-runtime.fullname" . }}
  namespace: {{ include "tenant-runtime.namespace" . }}
  labels:
    {{- include "tenant-runtime.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.tenant.domain | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- else if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.tenant.domain | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.tenant.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tenant-runtime.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
