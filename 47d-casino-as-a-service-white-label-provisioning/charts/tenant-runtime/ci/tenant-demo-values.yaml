# CI / example values for the "demo" tenant.
# Used by: helm lint, helm template, and CI pipeline smoke tests.

tenant:
  slug: "demo"
  brandName: "Demo Casino"
  domain: "demo.acmetocasino.com"
  jurisdiction: "demo"

image:
  repository: "ghcr.io/acmetocasino/caas-runtime"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: "demo-tls"

networkPolicy:
  enabled: true

namespace:
  create: true

db:
  class: "standard"
  secretName: "tenant-db-credentials"

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "10"
    services: "5"
    persistentvolumeclaims: "5"

extraEnv:
  - name: LOG_LEVEL
    value: "debug"
  - name: FEATURE_DEMO_MODE
    value: "true"
