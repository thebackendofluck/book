apiVersion: v2
name: tenant-runtime
description: >
  Packages one isolated casino instance per tenant (silo model) for the
  Casino as a Service (CaaS) platform. Each Helm release owns exactly one
  tenant namespace, deployment, service, ingress, network policy, and
  resource quota — providing hard isolation by design.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - casino
  - caas
  - tenant
  - igaming
maintainers:
  - name: platform-team
    email: platform@acmetocasino.com
