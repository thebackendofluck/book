# Per-tenant DB migration runner. Template — rendered into rendered/<slug>/db-migrate-cronjob.yaml.
# caasctl runs migrations on-demand via: kubectl create job --from=cronjob/db-migrate migrate-<slug>-<ts>
# The CronJob schedule is a safety net; provisioning triggers it imperatively.
# Placeholders: __SLUG__
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-migrate
  namespace: caas-__SLUG__
  labels:
    caas.tenant: "__SLUG__"
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            caas.tenant: "__SLUG__"
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: migrate
              image: ghcr.io/acmetocasino/caas-runtime:1.0.0
              command: ["caas-admin", "db", "migrate", "--wait"]
              env:
                - name: DB_HOST
                  valueFrom: { secretKeyRef: { name: tenant-db-credentials, key: host } }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: tenant-db-credentials, key: password } }
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
