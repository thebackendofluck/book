# Per-tenant TLS via cert-manager. Template — rendered into rendered/<slug>/certificate.yaml
# and applied by caasctl step "Issue TLS cert". The gate (caasctl verify) asserts this
# Certificate reaches Ready=True.
# Placeholders: __SLUG__ __DOMAIN__
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: caas-__SLUG__-cert
  namespace: caas-__SLUG__
  labels:
    caas.tenant: "__SLUG__"
spec:
  secretName: caas-__SLUG__-tls
  dnsNames:
    - __DOMAIN__
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
