# NodePool: system
# ---------------------------------------------------------------------------
# Cluster add-ons that must be steady and cheap: CoreDNS, metrics-server,
# the CNI/network-policy agents, observability daemons. On-demand amd64,
# small, tightly capped. (Karpenter's own controller is expected to run on a
# tiny managed node group or Fargate, not on a pool it manages.)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  template:
    metadata:
      labels:
        workload-class: system
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
      expireAfter: 168h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: casino-default
  # Sizing — STAGING values shown. Prod: cpu "32", memory 128Gi (see README).
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # WhenEmptyOrUnderutilized with no budget is unbounded churn on the pool
    # that hosts CoreDNS, the VPC CNI network-policy agent and metrics-server.
    # Karpenter may consolidate several of these nodes at once, and a
    # simultaneous restart of the network-policy agent means the default-deny
    # rules in k8s/security/ are briefly not being enforced. That is a
    # segmentation gap opened by a cost optimisation.
    #
    # Budgets bound it; the PodDisruptionBudgets in pdb.yaml are the other half
    # of the contract (budgets cap how many NODES go at once, PDBs cap how many
    # REPLICAS of a workload go at once, and you need both).
    budgets:
      - nodes: "1" # one system node at a time, always
      - nodes: "0" # …and no consolidation at all into the weekend peak
        schedule: "0 18 * * 5" # Fri 18:00, matching the stateless pool
        duration: 72h
  weight: 100 # highest weight — system pods prefer this pool
