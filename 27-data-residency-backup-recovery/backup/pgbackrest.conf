# =============================================================================
# pgBackRest Configuration - Production Template
# =============================================================================
# Copy to: /etc/pgbackrest/pgbackrest.conf
# Permissions: 640, owner: postgres:postgres
#
# For Wasabi production:   Set repo1-s3-* fields below
# For MinIO local testing: Set repo1-s3-endpoint=localhost, repo1-s3-port=9000,
#                          repo1-s3-uri-style=path, repo1-s3-ca-file=<cert>
#
# Jurisdiction-to-Wasabi endpoint mapping:
#   MGA (Malta):        s3.eu-central-2.wasabisys.com  (Amsterdam, NL)
#   UKGC:               s3.eu-west-1.wasabisys.com     (London, UK)
#   NJ/PA/MI (US):      s3.us-east-1.wasabisys.com     (Ashburn, VA)
#   Ontario (CA):       s3.ca-central-1.wasabisys.com  (Toronto)
#   PAGCOR (PH):        s3.ap-southeast-1.wasabisys.com (Singapore)
#
# repo1-s3-region below is a static INI value — pgBackRest has no runtime
# hook to validate it, unlike wasabi-backup.sh's check-region. That runtime
# guard lives in backup-verify.sh instead: set JURISDICTION in the
# environment that runs it (same value as the wasabi-<jurisdiction>.env used
# by wasabi-backup.sh) and it will fail loudly if repo1-s3-region here does
# not match the jurisdiction's approved region before anything else runs.
# =============================================================================

[global]

# ---------------------------------------------------------------------------
# Repository - Wasabi S3-compatible (change for MinIO testing)
# ---------------------------------------------------------------------------
repo1-type=s3
repo1-path=/pgbackrest/HOSTNAME_HERE

# Wasabi (production):
repo1-s3-bucket=BUCKET_NAME_HERE
repo1-s3-endpoint=s3.eu-central-1.wasabisys.com
repo1-s3-region=eu-central-1
repo1-s3-key=WASABI_ACCESS_KEY_HERE
repo1-s3-key-secret=WASABI_SECRET_KEY_HERE

# MinIO local testing (uncomment these, comment Wasabi lines above):
# repo1-s3-bucket=pgbackrest
# repo1-s3-endpoint=localhost
# repo1-s3-port=9000
# repo1-s3-region=us-east-1
# repo1-s3-key=minioadmin
# repo1-s3-key-secret=${PGBACKREST_S3_KEY_SECRET}   # inject from the vault, never store here
# repo1-s3-uri-style=path
# repo1-s3-ca-file=/etc/pgbackrest/minio-ca.crt

# ---------------------------------------------------------------------------
# Encryption at rest (AES-256-CBC)
# ---------------------------------------------------------------------------
repo1-cipher-type=aes-256-cbc
# PASSPHRASE: Store in /etc/pgbackrest/.cipher_pass (chmod 600)
# Do NOT commit to version control.
repo1-cipher-pass=PASSPHRASE_HERE

# ---------------------------------------------------------------------------
# Retention policy (regulatory compliance)
# ---------------------------------------------------------------------------
# MGA/DGE/PGCB: 7 years  → repo1-retention-full=365  (if daily full)
# UKGC/MGCB:    5 years  → repo1-retention-full=260
# Standard ops: 7 full + 14 diff
repo1-retention-full=7
repo1-retention-diff=14
repo1-retention-archive=14

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
process-max=4
compress-type=zst
compress-level=3
io-timeout=90

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# ---------------------------------------------------------------------------
# PostgreSQL cluster (stanza)
# ---------------------------------------------------------------------------
[casino]
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432
pg1-user=postgres

# For multi-region standby:
# pg2-host=replica1.internal
# pg2-path=/var/lib/postgresql/16/main
# pg2-port=5432
