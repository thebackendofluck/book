---
# Companion code for "The Backend of Luck" - Chapter 27, Data Residency and Backup/Recovery.
# https://thebackendofluck.com | https://github.com/thebackendofluck/book
# SPDX-License-Identifier: Apache-2.0
#
# FOR TESTING AND EVALUATION ONLY. NOT FOR PRODUCTION USE.
# Published to demonstrate the patterns explained in the book. This code is
# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

# ============================================================================
# AcmeToCasino — TDE & Disk Encryption Inventory
# ============================================================================
#
# Test VMs for database encryption (TDE) and LUKS disk encryption.
# Network: 10.0.10.0/24 (ops-host lab)
#
# PostgreSQL and MariaDB run on separate hosts to isolate encryption
# configurations.  The disk_encryption group targets hosts that need
# LUKS-encrypted data partitions (typically all database hosts).
# ============================================================================

all:
  vars:
    ansible_user: operator
    ansible_python_interpreter: /usr/bin/python3
    hsm_connector_url: "http://10.0.10.25:12345"
    hsm_auth_key_id: 2
    encryption_key_rotation_days: 90
    ssl_cert_path: /etc/ssl/certs/casino
    ssl_key_path: /etc/ssl/private/casino

  children:

    postgresql_tde:
      hosts:
        pg-tde-01:
          ansible_host: 10.0.10.30
          server_role: postgresql_primary
          pg_version: "16"
          pg_data_dir: /var/lib/postgresql/16/main
          pg_port: 5432
          tde_key_id: 100
        pg-tde-02:
          ansible_host: 10.0.10.31
          server_role: postgresql_standby
          pg_version: "16"
          pg_data_dir: /var/lib/postgresql/16/main
          pg_port: 5432
          tde_key_id: 101
      vars:
        pg_max_connections: 200
        pg_shared_buffers: "2GB"
        pg_ssl_mode: require

    mariadb_tde:
      hosts:
        mdb-tde-01:
          ansible_host: 10.0.10.32
          server_role: mariadb_primary
          mdb_version: "11.4"
          mdb_data_dir: /var/lib/mysql
          mdb_port: 3306
          tde_key_id: 200
        mdb-tde-02:
          ansible_host: 10.0.10.33
          server_role: mariadb_replica
          mdb_version: "11.4"
          mdb_data_dir: /var/lib/mysql
          mdb_port: 3306
          tde_key_id: 201
      vars:
        mdb_innodb_buffer_pool_size: "2G"

    disk_encryption:
      hosts:
        pg-tde-01:
        pg-tde-02:
        mdb-tde-01:
        mdb-tde-02:
      vars:
        luks_cipher: aes-xts-plain64
        luks_key_size: 512
        luks_hash: sha256
        luks_data_device: /dev/sdb
        luks_mount_point: /mnt/encrypted-data
        luks_keyfile_path: /etc/luks/keyfile
