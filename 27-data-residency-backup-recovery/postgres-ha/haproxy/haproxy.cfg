global
    log stdout format raw local0
    maxconn 4096
    # Run in foreground (Docker manages the process lifecycle)
    # user/group not set — HAProxy Alpine image runs as root by default

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout check   3s

# ─── Stats UI ──────────────────────────────────────────────────────────────
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-desc PostgreSQL HA Cluster
    stats auth admin:haproxy_stats_2024

# ─── Primary (read-write) — port 5000 ─────────────────────────────────────
# HAProxy checks Patroni REST API (:8008/primary) to identify the leader.
# Only the current Patroni leader responds 200 on /primary.

frontend pg_primary_front
    bind *:5000
    default_backend pg_primary_back

backend pg_primary_back
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-primary  pg-primary:5432  check port 8008 maxconn 200
    server pg-replica  pg-replica:5432  check port 8008 maxconn 200 backup

# ─── Replicas (read-only) — port 5001 ──────────────────────────────────────
# Patroni REST /replica responds 200 on standby nodes.
# Read queries (analytics, reporting) should use port 5001.

frontend pg_replica_front
    bind *:5001
    default_backend pg_replica_back

backend pg_replica_back
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-primary  pg-primary:5432  check port 8008 maxconn 200 backup
    server pg-replica  pg-replica:5432  check port 8008 maxconn 200
