# /etc/systemd/system/openbao.service.d/hsm.conf
# Systemd drop-in override: HSM PIN and PKCS#11 config path
#
# SECURITY: This file contains the YubiHSM 2 PIN.
# Permissions MUST be: chmod 600, chown root:root
# The HSM PIN must NEVER appear in openbao.hcl (PCI DSS Req. 3.5)
#
# Installation:
#   mkdir -p /etc/systemd/system/openbao.service.d/
#   cp hsm.conf /etc/systemd/system/openbao.service.d/hsm.conf
#   chmod 600 /etc/systemd/system/openbao.service.d/hsm.conf
#   chown root:root /etc/systemd/system/openbao.service.d/hsm.conf
#   systemctl daemon-reload

[Service]
# YubiHSM 2 PIN — injected as environment variable for PKCS#11 seal
# Format: <domain><password> — default factory: 0001password
# CHANGE before production: yubihsm-shell --action change-authentication-key
Environment="BAO_HSM_PIN=0001<change-me>"

# Path to yubihsm_pkcs11.conf
Environment="YUBIHSM_PKCS11_CONF=/etc/yubihsm_pkcs11.conf"
