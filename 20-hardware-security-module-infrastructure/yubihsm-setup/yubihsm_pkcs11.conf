# yubihsm_pkcs11.conf — YubiHSM PKCS#11 library configuration
#
# This file is read by the libyubihsm_pkcs11.so library.
# Set via environment: export YUBIHSM_PKCS11_CONF=/etc/yubihsm_pkcs11.conf
#
# For OpenBao: referenced in the systemd unit environment override at
#   /etc/systemd/system/openbao.service.d/hsm.conf
#
# References:
#   - Yubico SDK docs: https://developers.yubico.com/YubiHSM2/Component_Reference/yubihsm-pkcs11/
#   - PCI DSS Req. 3.6 (HSM key management)
#   - FIPS 140-2 Level 3 (YubiHSM 2 certification)

# connector: URL of the yubihsm-connector daemon
# The connector bridges USB HID (the HSM) to HTTP.
# PRODUCTION: bind to localhost only — HSM zone must not be reachable from internet.
# If bao-02/bao-03 need access, bind to the HSM zone interface:
#   connector = http://10.3.0.1:12345
connector = http://127.0.0.1:12345

# debug: enable verbose PKCS#11 library logging (set to 0 in production)
# Produces detailed output on stderr for each PKCS#11 call.
# debug

# libdebug: enable verbose connector HTTP logging (set to 0 in production)
# libdebug

# cacert: path to CA certificate for HTTPS connector (if using TLS to connector)
# Leave commented for HTTP localhost connector.
# cacert = /etc/yubihsm-connector/ca.crt

# cert / key: mutual TLS credentials for connector (optional)
# cert = /etc/yubihsm-connector/client.crt
# key  = /etc/yubihsm-connector/client.key

# proxy: HTTP proxy for connector (if any)
# proxy = http://proxy.internal:3128
