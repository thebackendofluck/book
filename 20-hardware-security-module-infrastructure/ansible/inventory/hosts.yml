# YubiHSM Infrastructure Inventory
# Update with your actual host addresses

all:
  children:
    hsm_servers:
      hosts:
        hsm-primary:
          ansible_host: 10.0.1.10
          yubihsm_connector_listen: "127.0.0.1:12345"
        hsm-backup:
          ansible_host: 10.0.1.11
          yubihsm_connector_listen: "127.0.0.1:12345"
      vars:
        ansible_user: deploy
        ansible_become: true
        yubihsm_enable_fips: true
