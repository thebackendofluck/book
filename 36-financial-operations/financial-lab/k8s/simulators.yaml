# financial-lab/k8s/simulators.yaml
# PSP simulator deployments for local financial testing
# Simulates 8 payment providers: Adyen, Trustly, PayPal, Paysafe,
# Skrill, Neteller, Nuvei, and the bank wire simulator
# Chapter 36b: Financial Truth Layer -- reconciliation testing
---
# ----------------------------------------------------------------
# Adyen Simulator
# Simulates Adyen HPP + Checkout API + webhook callbacks
# ----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adyen-simulator
  namespace: financial-lab
  labels:
    app: adyen-simulator
    component: simulator
    psp: adyen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adyen-simulator
  template:
    metadata:
      labels:
        app: adyen-simulator
        component: simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adyen-simulator
          image: ghcr.io/acmetocasino/psp-simulator:1.0.0
          ports:
            - containerPort: 8100
          env:
            - name: SIMULATOR_NAME
              value: "adyen"
            - name: SIMULATOR_PORT
              value: "8100"
            - name: PAYMENT_SUCCESS_RATE
              value: "0.95"
            - name: CALLBACK_URL
              value: "http://payments-service:8081/webhooks/adyen"
            - name: SETTLEMENT_DELAY_DAYS
              value: "2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adyen-simulator
  namespace: financial-lab
spec:
  selector:
    app: adyen-simulator
  ports:
    - port: 8100
      targetPort: 8100
---
