# Apply before core-apps.yaml
# Chapter 36b: Financial Truth Layer
---
# ----------------------------------------------------------------
# PostgreSQL -- shared database for ledger, payments, treasury
# ----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: financial-lab
  labels:
    app: postgres
    component: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "casino_lab"
            - name: POSTGRES_PASSWORD
              value: "lab_password_change_in_prod"
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "ledger,payments,treasury,reconciliation"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "casino_lab"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: postgres-init
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financial-lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: financial-lab
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e
    for db in ledger payments treasury reconciliation; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE $db;
        GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;
    EOSQL
    done
---
# ----------------------------------------------------------------
# Redis -- session cache and distributed locks
# ----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: financial-lab
  labels:
    app: redis
    component: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          args: ["--save", "", "--appendonly", "no"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: financial-lab
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ----------------------------------------------------------------
# Redpanda -- Kafka-compatible event streaming
# Lightweight single-node for local testing
# ----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: financial-lab
  labels:
    app: redpanda
    component: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.1.13
          command:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
            - --pandaproxy-addr=0.0.0.0:8082
            - --advertise-pandaproxy-addr=redpanda:8082
            - --schema-registry-addr=0.0.0.0:8081
            - --advertise-schema-registry-addr=redpanda:8081
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 29092
              name: kafka-internal
            - containerPort: 8081
              name: schema-registry
            - containerPort: 8082
              name: pandaproxy
            - containerPort: 9644
              name: admin
          readinessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
            - name: redpanda-config
              mountPath: /etc/redpanda
      volumes:
        - name: redpanda-data
          emptyDir: {}
        - name: redpanda-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: financial-lab
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: kafka-internal
      port: 29092
      targetPort: 29092
    - name: schema-registry
      port: 8081
      targetPort: 8081
    - name: pandaproxy
      port: 8082
      targetPort: 8082
    - name: admin
      port: 9644
      targetPort: 9644
