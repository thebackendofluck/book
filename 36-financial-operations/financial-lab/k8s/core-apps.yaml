    app: treasury-service
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treasury-service
  template:
    metadata:
      labels:
        app: treasury-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: treasury-service
          image: ghcr.io/acmetocasino/treasury-service:1.0.0
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service:8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "redpanda:9092"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/treasury"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: treasury-service
  namespace: financial-lab
spec:
  selector:
    app: treasury-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
# ----------------------------------------------------------------
# Reconciliation Service
# Daily automated reconciliation: ledger vs PSP settlement reports
# ----------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation-service
  namespace: financial-lab
  labels:
    app: reconciliation-service
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciliation-service
  template:
    metadata:
      labels:
        app: reconciliation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciliation-service
          image: ghcr.io/acmetocasino/reconciliation-service:1.0.0
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service:8080"
            - name: TREASURY_SERVICE_URL
              value: "http://treasury-service:8082"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "redpanda:9092"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/reconciliation"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: TOLERANCE_AMOUNT_CENTS
              value: "100"   # 1.00 EUR max acceptable discrepancy
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reconciliation-service
  namespace: financial-lab
spec:
  selector:
    app: reconciliation-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
# ----------------------------------------------------------------
# Secrets
# ----------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: financial-lab
type: Opaque
stringData:
  username: "casino_lab"
  password: "lab_password_change_in_prod"
