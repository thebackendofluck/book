openapi: 3.0.0
servers:
  - description: Development
    url: 'https://new-payments-service.acmetocasino-stage.com'
  - description: Production
    url: https://payments.acmetocasino.com
info:
  version: "1.0.1"
  title: Retrieve payment methods
paths:
  /methods/new:
    post:
      summary: Get all payments service providers
      responses:
        '200':
          description: Succesfull
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
            example:
              userId: 232888
              brand: -1
components:
  schemas:
    Session:
      oneOf:
        - type: object
          properties:
            brand:
              type: string
              example: -1
            userId:
              type: string
              example: 232888
        - type: object
          properties:
            sessionid:
              type: string
    Response:
      type: array
      items:
        required:
          - method
          - label
          - description
          - isRedirectMethod
          - group
        properties:
          method:
            type: string
          label:
            type: string
          description:
            type: string
          isRedirectMethod:
            description: Indicates if a user will be redirected after a user choice a specif deposit amoount.
            type: string
            enum: ['false', 'true']
          group:
            description: Indicates if a certain method should be shown grouped with members of the same group.
            type: string
