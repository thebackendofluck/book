# Database configuration for the batch withdrawal processor.
#
# Migration note (Oracle → PostgreSQL):
#   - oracle.jdbc.OracleDriver  → org.postgresql.Driver
#   - jdbc:oracle:thin:@//host:1521/service  → jdbc:postgresql://host:5432/db
#   - The eligible-players query is ANSI-portable: it uses FETCH FIRST :limit
#     ROWS ONLY (SQL:2008, supported by PostgreSQL 12+ and Oracle 12c+) and
#     standard subquery EXISTS clauses. No dialect-specific rewrites needed.
# Connection pooling stays disabled because this is a short-lived batch job
# that runs, processes all eligible withdrawals, and exits.
#
# Credentials are injected via environment variables. In production,
# these come from a secrets manager (e.g., OpenBao, AWS Secrets Manager)
# and are set in the job's environment before launch.

pdb = {
  driver = org.postgresql.Driver
  connectionPool = disabled
  keepAliveConnection = true
  url = "jdbc:postgresql://platformdb.internal.acmetocasino.com:5432/platform"
  user = ${DB_USERNAME}
  password = ${DB_PASSWORD}
}
