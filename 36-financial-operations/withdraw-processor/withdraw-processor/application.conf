# Database configuration for the batch withdrawal processor.
#
# Uses Oracle via Slick's JdbcBackend with the freeslick Oracle profile.
# Connection pooling is disabled because this is a short-lived batch job --
# it runs, processes all eligible withdrawals, and exits.
#
# Credentials are injected via environment variables. In production,
# these come from a secrets manager (e.g., HashiCorp Vault, AWS Secrets
# Manager) and are set in the job's environment before launch.

pdb = {
  driver = oracle.jdbc.OracleDriver
  connectionPool = disabled
  keepAliveConnection = true
  url = "jdbc:oracle:thin:@//platformdb.internal.acmetocasino.com:1521/pdb"
  user = ${DB_USERNAME}
  password = ${DB_PASSWORD}
}
