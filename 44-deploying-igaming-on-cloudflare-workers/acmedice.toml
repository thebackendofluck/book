# wrangler.acmedice.toml — AcmeDice brand Worker configuration
#
# Deploys the shared TypeScript codebase as the AcmeDice casino brand.
# All game logic, compliance enforcement, and wallet operations are
# identical to the other brands — only the name, domain, and data
# resources differ.
#
# Deploy:
#   npx wrangler deploy --config wrangler.acmedice.toml
#
# Chapter 44, Section 12: Multi-Brand Deployment
# KV namespaces provisioned during initial portfolio deploy:
#   spinforge-sessions → (provisioned for test brand)

name                = "acmedice-api"
main                = "src/index.ts"
compatibility_date  = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT   = "development"
PLATFORM_NAME = "AcmeDice Casino"

# ─── D1 Database ─────────────────────────────────────────────────────────────
# Per the resource isolation matrix (Section 12), each brand in production
# must have its own D1 database.  The shared DB ID below is the PoC value;
# replace with a dedicated acmedice-db in production.
#
# Production setup:
#   npx wrangler d1 create acmedice-db
#   npx wrangler d1 migrations apply acmedice-db

[[d1_databases]]
binding       = "DB"
database_name = "acmetocasino-db"                       # shared DB in PoC
database_id   = "a2a40f31-e9c4-49fb-96a8-1c2ef8b8d70c" # replace in production

# ─── KV Namespaces ───────────────────────────────────────────────────────────
# Session isolation: tokens minted by this Worker are stored in its own
# SESSIONS namespace and cannot authenticate against other brand Workers.

[[kv_namespaces]]
binding    = "CACHE"
id         = "f3402e71217142949c225532256c0577" # shared CACHE in PoC; replace in production

[[kv_namespaces]]
binding    = "SESSIONS"
id         = "spinforge-sessions-placeholder"   # replace with real namespace ID
                                                # created: npx wrangler kv namespace create acmedice-sessions

# ─── R2 Bucket ───────────────────────────────────────────────────────────────

[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "acmetocasino-kyc-docs"  # shared R2 in PoC; use acmedice-kyc-docs in production

# ─── Custom domain route ─────────────────────────────────────────────────────

[[routes]]
pattern   = "cloudflare.cloud-acmedice.com/*"
zone_name = "cloud-acmedice.com"

# ─── Secrets (set per brand) ──────────────────────────────────────────────────
# npx wrangler secret put JWT_SECRET        --config wrangler.acmedice.toml
# npx wrangler secret put ENCRYPTION_KEY    --config wrangler.acmedice.toml
# npx wrangler secret put EVOLUTION_API_KEY --config wrangler.acmedice.toml
# npx wrangler secret put PAYMENT_PROCESSOR_KEY --config wrangler.acmedice.toml
