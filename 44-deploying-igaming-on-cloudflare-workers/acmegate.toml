# wrangler.acmegate.toml — AcmeGate brand Worker configuration
#
# Deploys the shared TypeScript codebase as the AcmeGate casino brand.
# AcmeGate is positioned as the platform's sportsbook-adjacent brand,
# targeting markets where combined casino/sports licences are available.
#
# Deploy:
#   npx wrangler deploy --config wrangler.acmegate.toml
#
# Chapter 44, Section 12: Multi-Brand Deployment
# KV namespaces provisioned during initial portfolio deploy:
#   luckyedge-sessions → e0485e4250f64eeaa499c6d3c241f24a

name                = "acmegate-api"
main                = "src/index.ts"
compatibility_date  = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT   = "development"
PLATFORM_NAME = "AcmeGate Casino"

# ─── D1 Database ─────────────────────────────────────────────────────────────
# Per the resource isolation matrix (Section 12), each brand in production
# must have its own D1 database.  The shared DB ID below is the PoC value;
# replace with a dedicated acmegate-db in production.
#
# Production setup:
#   npx wrangler d1 create acmegate-db --location=EEUR  # EU players primary target
#   npx wrangler d1 migrations apply acmegate-db

[[d1_databases]]
binding       = "DB"
database_name = "acmetocasino-db"                       # shared DB in PoC
database_id   = "a2a40f31-e9c4-49fb-96a8-1c2ef8b8d70c" # replace in production

# ─── KV Namespaces ───────────────────────────────────────────────────────────
# luckyedge-sessions namespace was provisioned during initial portfolio rollout.
# In production, rename to acmegate-sessions for clarity.

[[kv_namespaces]]
binding    = "CACHE"
id         = "f3402e71217142949c225532256c0577" # shared CACHE in PoC; replace in production

[[kv_namespaces]]
binding    = "SESSIONS"
id         = "e0485e4250f64eeaa499c6d3c241f24a" # luckyedge-sessions (from initial provisioning)

# ─── R2 Bucket ───────────────────────────────────────────────────────────────

[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "acmetocasino-kyc-docs"  # shared R2 in PoC; use acmegate-kyc-docs in production

# ─── Custom domain route ─────────────────────────────────────────────────────

[[routes]]
pattern   = "cloudflare.cloud-acmegate.com/*"
zone_name = "cloud-acmegate.com"

# ─── Secrets (set per brand) ──────────────────────────────────────────────────
# npx wrangler secret put JWT_SECRET        --config wrangler.acmegate.toml
# npx wrangler secret put ENCRYPTION_KEY    --config wrangler.acmegate.toml
# npx wrangler secret put NETENT_API_KEY    --config wrangler.acmegate.toml
# npx wrangler secret put EVOLUTION_API_KEY --config wrangler.acmegate.toml
# npx wrangler secret put PAYMENT_PROCESSOR_KEY --config wrangler.acmegate.toml
