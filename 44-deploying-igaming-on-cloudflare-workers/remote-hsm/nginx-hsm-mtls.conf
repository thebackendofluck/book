# HSM Proxy API — mTLS server block
# Listens on 443. ssl_verify_client optional so TLS handshake completes for all
# paths; client cert is enforced in /hsm-api/ via set+if variables.
#
# pfSense NAT: 203.0.113.2:443 -> ops-host:443
# Client cert CA: /etc/nginx/ssl/hsm-client-ca.crt (issued by OpenBao pki-mtls)
# Server cert:    /etc/nginx/ssl/ops-host.crt (existing)

server {
    listen 8443 ssl;
    server_name 203.0.113.2 ops-host.internal 127.0.0.1 localhost;

    ssl_certificate     /etc/nginx/ssl/ops-host.crt;
    ssl_certificate_key /etc/nginx/ssl/ops-host.key;

    # mTLS: optional at server level — TLS handshake always succeeds.
    # Client cert validation is enforced per-location using $ssl_client_verify.
    ssl_client_certificate /etc/nginx/ssl/hsm-client-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    ssl_protocols    TLSv1.2 TLSv1.3;
    ssl_ciphers      ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_HSM:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # == /hsm-api/ — mTLS enforced ============================================
    location /hsm-api/ {
        # Layer 1: require valid client certificate (mTLS)
        # $ssl_client_verify is SUCCESS only when cert validates against CA
        set $mtls_ok 0;
        if ($ssl_client_verify = SUCCESS) {
            set $mtls_ok 1;
        }
        if ($mtls_ok = 0) {
            return 400 '{"detail":"Client certificate required"}';
        }

        # Layer 2: restrict CN — reject unknown clients even with a valid cert
        set $cn_ok 0;
        if ($ssl_client_s_dn ~ "CN=cloudflare-worker-hsm-client") {
            set $cn_ok 1;
        }
        if ($cn_ok = 0) {
            return 403 '{"detail":"Invalid client certificate CN"}';
        }

        # Layer 3: IP allowlist (pfSense NAT IP + loopback for local tests)
        allow 203.0.113.1;
        allow 127.0.0.1;
        allow ::1;
        # Cloudflare IPv4 ranges (https://www.cloudflare.com/ips-v4)
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 108.162.192.0/18;
        allow 131.0.72.0/22;
        allow 141.101.64.0/18;
        allow 162.158.0.0/15;
        allow 172.64.0.0/13;
        allow 173.245.48.0/20;
        allow 188.114.96.0/20;
        allow 190.93.240.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        deny all;

        # Proxy to HSM API
        proxy_pass         http://127.0.0.1:8190/;
        proxy_http_version 1.1;
        proxy_set_header   Connection           "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        # Pass verified client cert CN to upstream for audit logging
        proxy_set_header   X-Client-Cert-CN    $ssl_client_s_dn;
        proxy_set_header   X-Client-Cert-Verified $ssl_client_verify;

        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
        client_max_body_size   64k;
        proxy_buffering        off;
    }

    # == fraud-api (existing, no mTLS required) ================================
    location /fraud-api/ {
        allow 203.0.113.1;
        allow 127.0.0.1;
        allow 10.0.10.0/24;
        deny all;

        proxy_pass http://127.0.0.1:8180/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # == catch-all =============================================================
    location / {
        return 404;
    }

    access_log /var/log/nginx/hsm-api-access.log;
    error_log  /var/log/nginx/hsm-api-error.log warn;
}

