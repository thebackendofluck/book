# nginx configuration for HSM Proxy API on ops-host (10.0.0.11)
#
# Exposes hsm-proxy-api.py (running on localhost:8000) over HTTPS.
# Pattern mirrors the fraud-api nginx block already deployed on ops-host.
#
# TLS: uses the PKI-issued certificate from the internal CA
#   cert:  /etc/ssl/certs/ops-host-server.crt
#   key:   /etc/ssl/private/ops-host-server.key
#   ca:    /etc/ssl/certs/acmetocasino-ca.crt
#
# Access control: Cloudflare edge IPs only (updated via Cloudflare IP list)
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
#
# API key verification is handled by the FastAPI app (X-API-Key header).
# nginx provides an additional pre-auth layer: if the header is absent,
# return 401 before the request reaches uvicorn (saves CPU on the HSM).
#
# Deploy: cp nginx-hsm-api.conf /etc/nginx/sites-available/hsm-api
#         ln -s /etc/nginx/sites-available/hsm-api /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx

# ─── Rate limiting zones ──────────────────────────────────────────────────────
# Declared in /etc/nginx/nginx.conf http block (add if not already present):
#   limit_req_zone $binary_remote_addr zone=hsm_per_ip:10m rate=50r/s;
#   limit_req_zone $http_x_api_key     zone=hsm_per_key:10m rate=200r/m;

# ─── Upstream ─────────────────────────────────────────────────────────────────
upstream hsm_proxy_api {
    server 127.0.0.1:8000;
    keepalive 4;              # Low — HSM sessions are not thread-safe
}

# ─── HTTPS server block ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hsm-api.acmetocasino.com ops-host.acmetocasino.internal;

    # ── TLS configuration ──────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/ops-host-server.crt;
    ssl_certificate_key /etc/ssl/private/ops-host-server.key;
    ssl_trusted_certificate /etc/ssl/certs/acmetocasino-ca.crt;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # ── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Content-Security-Policy   "default-src 'none'" always;
    add_header X-Robots-Tag              "noindex, nofollow" always;

    # ── Cloudflare edge IP allowlist ───────────────────────────────────────
    # IPv4 (from https://www.cloudflare.com/ips-v4 — update quarterly)
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 108.162.192.0/18;
    allow 131.0.72.0/22;
    allow 141.101.64.0/18;
    allow 162.158.0.0/15;
    allow 172.64.0.0/13;
    allow 173.245.48.0/20;
    allow 188.114.96.0/20;
    allow 190.93.240.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;

    # IPv6 (from https://www.cloudflare.com/ips-v6)
    allow 2400:cb00::/32;
    allow 2405:8100::/32;
    allow 2405:b500::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;

    # Allow internal LAN (for ops/monitoring from ops-host itself)
    allow 10.0.10.0/24;
    allow 127.0.0.1;
    allow ::1;

    # Block everyone else before TLS handshake completes (saves CPU)
    deny all;

    # ── Pre-auth: reject requests missing API key header ──────────────────
    # This prevents unauthenticated requests from reaching uvicorn.
    # The FastAPI app performs the actual constant-time key comparison.
    if ($http_x_api_key = "") {
        return 401 '{"detail":"X-API-Key header required"}';
    }

    # ── Rate limiting ──────────────────────────────────────────────────────
    limit_req zone=hsm_per_ip  burst=20  nodelay;
    limit_req zone=hsm_per_key burst=100 nodelay;
    limit_req_status 429;

    # ── Logging ────────────────────────────────────────────────────────────
    # Custom log format: log API key hash (not value) for audit
    # Defined in nginx.conf: log_format hsm_api '...$http_x_api_key_hash...';
    access_log /var/log/nginx/hsm-api-access.log;
    error_log  /var/log/nginx/hsm-api-error.log  warn;

    # ── Location blocks ───────────────────────────────────────────────────
    location /hsm/ {
        proxy_pass         http://hsm_proxy_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — HSM operations can take up to 5 s under load
        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;

        # Body limits — HSM operations deal with small payloads
        client_max_body_size  64k;

        # Do not buffer — HSM responses are small and time-sensitive
        proxy_buffering off;
    }

    # Health check (no rate limiting — called by monitoring every 30 s)
    location = /hsm/health {
        proxy_pass         http://hsm_proxy_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        limit_req off;
        access_log off;   # Suppress health check noise in access log
    }

    # Block everything else
    location / {
        return 404;
    }
}

# ─── HTTP redirect ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hsm-api.acmetocasino.com ops-host.acmetocasino.internal;
    return 301 https://$host$request_uri;
}
