# nginx-hsm-api-mtls.conf — HSM Proxy API mTLS server block
#
# DEPLOYMENT NOTE: This config listens on port 8443 (NOT 443).
# Reason: nginx cannot reliably send CertificateRequest (required for mTLS) when
# multiple vhosts share the same IP:port. Port 8443 is dedicated to this service,
# ensuring ssl_verify_client optional works correctly in all TLS versions.
#
# pfSense NAT rule required:
#   Interface: WAN
#   Protocol:  TCP
#   Dest addr: 203.0.113.2 port 8443
#   NAT IP:    ops-host (10.0.0.11) port 8443
#
# Cloudflare Worker connects to: https://203.0.113.2:8443/hsm-api/hsm/...
# (or via DNS if hsm-api.acmetocasino.com resolves to 203.0.113.2)
#
# CA cert:     /etc/nginx/ssl/hsm-client-ca.crt  (OpenBao pki-mtls root CA)
# Server cert: /etc/nginx/ssl/ops-host.crt         (existing self-signed)
#
# Defense in depth (four layers):
#   1. mTLS  — client cert must validate against AcmeToCasino mTLS CA
#   2. CN    — only CN=cloudflare-worker-hsm-client is accepted
#   3. IP    — pfSense NAT IP + Cloudflare ranges + loopback
#   4. Key   — X-API-Key checked by FastAPI upstream

server {
    listen 8443 ssl;
    server_name 203.0.113.2 ops-host.internal 127.0.0.1 localhost;

    ssl_certificate     /etc/nginx/ssl/ops-host.crt;
    ssl_certificate_key /etc/nginx/ssl/ops-host.key;

    # mTLS: request client cert on every connection
    ssl_client_certificate /etc/nginx/ssl/hsm-client-ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    ssl_protocols    TLSv1.2 TLSv1.3;
    ssl_ciphers      ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_HSM_MTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # == /hsm-api/ — mTLS enforced ============================================
    location /hsm-api/ {
        # Layer 1: require valid client certificate
        # $ssl_client_verify = SUCCESS only when cert validates against CA
        set $mtls_ok 0;
        if ($ssl_client_verify = SUCCESS) {
            set $mtls_ok 1;
        }
        if ($mtls_ok = 0) {
            return 400 '{"detail":"Client certificate required"}';
        }

        # Layer 2: restrict to the approved Worker CN
        set $cn_ok 0;
        if ($ssl_client_s_dn ~ "CN=cloudflare-worker-hsm-client") {
            set $cn_ok 1;
        }
        if ($cn_ok = 0) {
            return 403 '{"detail":"Invalid client certificate CN"}';
        }

        # Layer 3: IP allowlist
        allow 203.0.113.1;        # pfSense WAN (production server traffic)
        allow 127.0.0.1;         # loopback (monitoring, local tests)
        allow ::1;
        # Cloudflare IPv4 ranges (update quarterly from https://www.cloudflare.com/ips-v4)
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 108.162.192.0/18;
        allow 131.0.72.0/22;
        allow 141.101.64.0/18;
        allow 162.158.0.0/15;
        allow 172.64.0.0/13;
        allow 173.245.48.0/20;
        allow 188.114.96.0/20;
        allow 190.93.240.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        deny all;

        # Proxy to HSM API (uvicorn on localhost only)
        proxy_pass         http://127.0.0.1:8190/;
        proxy_http_version 1.1;
        proxy_set_header   Connection           "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        # Forward verified cert info to upstream for audit logging
        proxy_set_header   X-Client-Cert-CN    $ssl_client_s_dn;
        proxy_set_header   X-Client-Cert-Verified $ssl_client_verify;

        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
        client_max_body_size   64k;
        proxy_buffering        off;
    }

    # == catch-all =============================================================
    location / {
        return 404;
    }

    access_log /var/log/nginx/hsm-api-access.log;
    error_log  /var/log/nginx/hsm-api-error.log warn;
}
