---
# Companion code for "The Backend of Luck" - Chapter 46, Building a Brazilian Betting Platform.
# https://thebackendofluck.com | https://github.com/thebackendofluck/book
# SPDX-License-Identifier: Apache-2.0
#
# FOR TESTING AND EVALUATION ONLY. NOT FOR PRODUCTION USE.
# Published to demonstrate the patterns explained in the book. This code is
# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

# =============================================================================
# Chapter 46: Brazilian Betting Platform — Integration Docker Compose
# =============================================================================
# Orchestrates ALL 9 microservices + infrastructure for integration testing.
#
# Services:
#   Infrastructure: postgres, redis, kafka (KRaft mode)
#   Python:         pam (8010), responsible-gaming (8020), bonus-engine (8030)
#   Go:             betting-engine (8080), wallet (8081), settlement (8082),
#                   odds-feed (8083), casino-aggregation (8040)
#
# Security:
#   - All services: security_opt no-new-privileges:true
#   - Ports bound to 127.0.0.1 only
#   - No hardcoded secrets — use ${VAR:-default} pattern
#   - Internal network isolation; only test-facing services on public net
#   - Resource limits on every service
#
# Usage:
#   docker compose -f docker-compose.integration.yml up -d
#   docker compose -f docker-compose.integration.yml down -v
# =============================================================================

version: "3.9"

networks:
  bet_integration_internal:
    driver: bridge
    internal: true
  bet_integration_public:
    driver: bridge

volumes:
  int_postgres_data:
  int_redis_data:
  int_kafka_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — shared relational store for all microservices
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: betbr-int-postgres
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-betbr_integration}"
      POSTGRES_USER: "${POSTGRES_USER:-betbr_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      # Create additional databases for services that use separate schemas
      POSTGRES_MULTIPLE_DATABASES: "pam,responsible_gaming,betting_engine,wallet,settlement,bonus_engine,casino_agg"
    volumes:
      - int_postgres_data:/var/lib/postgresql/data
    networks:
      - bet_integration_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betbr_user} -d ${POSTGRES_DB:-betbr_integration}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis — cache, rate limiting, session state, odds pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: betbr-int-redis
    restart: unless-stopped
    user: "999:999"
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD:-redis}"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly no
        --loglevel warning
    volumes:
      - int_redis_data:/data
    networks:
      - bet_integration_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Kafka — event streaming (bet events, settlement events, SIGAP)
  # KRaft mode: no Zookeeper dependency (Confluent Platform 7.6+)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: betbr-int-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - int_kafka_data:/var/lib/kafka/data
    networks:
      - bet_integration_internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ---------------------------------------------------------------------------
  # PAM — Player Account Management (Python/FastAPI, port 8010)
  # ---------------------------------------------------------------------------
  pam:
    build:
      context: ./pam
      dockerfile: Dockerfile
    image: betbr-pam:integration
    container_name: betbr-int-pam
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/0"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      LOG_FORMAT: json
      RECEITA_FEDERAL_MOCK: "true"
      BIOMETRIC_MOCK: "true"
      SIGAP_MOCK: "true"
    ports:
      - "127.0.0.1:18010:8010"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Responsible Gaming (Python/FastAPI, port 8020)
  # ---------------------------------------------------------------------------
  responsible-gaming:
    build:
      context: ./responsible-gaming
      dockerfile: Dockerfile
    image: betbr-responsible-gaming:integration
    container_name: betbr-int-responsible-gaming
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/1"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      LOG_FORMAT: json
      NATIONAL_REGISTRY_MOCK: "true"
    ports:
      - "127.0.0.1:18020:8020"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Betting Engine (Go/alpine, port 8080)
  # ---------------------------------------------------------------------------
  betting-engine:
    build:
      context: ./betting-engine
      dockerfile: Dockerfile
    image: betbr-betting-engine:integration
    container_name: betbr-int-betting-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/2"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      PAM_BASE_URL: "http://pam:8010"
      RESPONSIBLE_GAMING_BASE_URL: "http://responsible-gaming:8020"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      SIGAP_MOCK: "true"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Wallet (Go/alpine, port 8081)
  # ---------------------------------------------------------------------------
  wallet:
    build:
      context: ./wallet
      dockerfile: Dockerfile
    image: betbr-wallet:integration
    container_name: betbr-int-wallet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/3"
      PAM_BASE_URL: "http://pam:8010"
      CELCOIN_BASE_URL: "${CELCOIN_BASE_URL:-https://sandbox.openfinance.celcoin.dev}"
      CELCOIN_API_KEY: "${CELCOIN_API_KEY:-sandbox_key}"
      CELCOIN_API_SECRET: "${CELCOIN_API_SECRET:-sandbox_secret}"
      PIX_MOCK: "true"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
    ports:
      - "127.0.0.1:18081:8081"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Settlement (Go/alpine, port 8082)
  # ---------------------------------------------------------------------------
  settlement:
    build:
      context: ./settlement
      dockerfile: Dockerfile
    image: betbr-settlement:integration
    container_name: betbr-int-settlement
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}?sslmode=disable"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_BROKERS: "kafka:29092"
      WALLET_BASE_URL: "http://wallet:8081"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      SIGAP_MOCK: "true"
    ports:
      - "127.0.0.1:18082:8082"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Odds Feed (Go/alpine, port 8083)
  # ---------------------------------------------------------------------------
  odds-feed:
    build:
      context: ./odds-feed
      dockerfile: Dockerfile
    image: betbr-odds-feed:integration
    container_name: betbr-int-odds-feed
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/4"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis}"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      FEED_PROVIDER_MOCK: "true"
    ports:
      - "127.0.0.1:18083:8083"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---------------------------------------------------------------------------
  # Bonus Engine (Python/FastAPI, port 8030)
  # ---------------------------------------------------------------------------
  bonus-engine:
    build:
      context: ./bonus-engine
      dockerfile: Dockerfile
    image: betbr-bonus-engine:integration
    container_name: betbr-int-bonus-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/5"
      PORT: "8030"
      OPERATOR_CNPJ: "${OPERATOR_CNPJ:-12345678000195}"
      ENV: "${ENV:-integration}"
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:18030:8030"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8030/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Casino Aggregation (Go/alpine, port 8040)
  # ---------------------------------------------------------------------------
  casino-aggregation:
    build:
      context: ./casino-aggregation
      dockerfile: Dockerfile
    image: betbr-casino-aggregation:integration
    container_name: betbr-int-casino-aggregation
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-betbr_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-betbr_integration}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redis}@redis:6379/6"
      PORT: "8040"
      OPERATOR_CNPJ: "${OPERATOR_CNPJ:-12345678000195}"
      ENV: "${ENV:-integration}"
      LOG_PRETTY: "false"
    ports:
      - "127.0.0.1:18040:8040"
    networks:
      - bet_integration_internal
      - bet_integration_public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8040/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
