# HAProxy frontend for the postgres-aegis cluster.
# Two listeners:
#   {{ haproxy_listen_writer }} → Patroni writer(s) — leader elected via HTTP health.
#   {{ haproxy_listen_reader }} → Patroni replicas — round-robin with backup.
# Health checks hit Patroni's REST API (/master, /replica) — Patroni is the
# source of truth for role, so HAProxy follows failover automatically.

- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true

- name: Render haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: "haproxy -c -f %s"
  notify: Reload haproxy

- name: Ensure HAProxy running and enabled
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started
