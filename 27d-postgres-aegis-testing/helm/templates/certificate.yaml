{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "postgres-aegis.fullname" . }}-tls
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
spec:
  secretName: {{ include "postgres-aegis.fullname" . }}-tls
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  commonName: {{ include "postgres-aegis.fullname" . }}.{{ .Release.Namespace }}.svc
  dnsNames:
    - {{ include "postgres-aegis.writerName" . }}
    - {{ include "postgres-aegis.writerName" . }}-headless
    - {{ include "postgres-aegis.readerName" . }}
    - {{ include "postgres-aegis.readerName" . }}-headless
    - "*.{{ include "postgres-aegis.writerName" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
    - "*.{{ include "postgres-aegis.readerName" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: {{ .Values.certManager.issuerKind }}
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
{{- end }}
