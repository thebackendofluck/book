apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres-aegis.writerName" . }}
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
    postgres-aegis.io/role: writer
spec:
  serviceName: {{ include "postgres-aegis.writerName" . }}-headless
  replicas: {{ .Values.writers.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "postgres-aegis.selectorLabels" . | nindent 6 }}
      postgres-aegis.io/role: writer
  template:
    metadata:
      labels:
        {{- include "postgres-aegis.selectorLabels" . | nindent 8 }}
        postgres-aegis.io/role: writer
    spec:
      serviceAccountName: {{ include "postgres-aegis.fullname" . }}
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: aegis-extension-check
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Checking for pg_aegis extension..."
              if [ -n "{{ .Values.image.aegisExtensionImage }}" ]; then
                echo "pg_aegis image supplied: {{ .Values.image.aegisExtensionImage }}"
              else
                echo "No pg_aegis image - falling back to pgcrypto (honest mode)."
              fi
      containers:
        - name: patroni
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni-api
              containerPort: 8008
          envFrom:
            - secretRef:
                name: {{ include "postgres-aegis.fullname" . }}-aegis-dek
          env:
            - name: PATRONI_SCOPE
              value: {{ .Values.patroni.scope | quote }}
            - name: PATRONI_KUBERNETES_LABELS
              value: '{app.kubernetes.io/name: {{ include "postgres-aegis.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}'
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PATRONI_KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_POSTGRESQL_DATA_DIR
              value: /var/lib/postgresql/data/pgdata
            - name: PATRONI_POSTGRESQL_LISTEN
              value: 0.0.0.0:5432
            - name: PATRONI_RESTAPI_LISTEN
              value: 0.0.0.0:8008
            - name: PGSSLMODE
              value: verify-full
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.writers.resources | nindent 12 }}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            - name: patroni-config
              mountPath: /etc/patroni
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni-api
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni-api
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: tls
          secret:
            secretName: {{ include "postgres-aegis.fullname" . }}-tls
            optional: false
        - name: patroni-config
          configMap:
            name: {{ include "postgres-aegis.fullname" . }}-patroni
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.writers.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.writers.persistence.size | quote }}
