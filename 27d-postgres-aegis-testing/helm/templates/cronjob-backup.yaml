{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres-aegis.fullname" . }}-backup
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pgbackrest
              image: pgbackrest/pgbackrest:2.54.2
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: {{ include "postgres-aegis.fullname" . }}-backup-s3
              env:
                - name: PGBACKREST_REPO1_S3_BUCKET
                  value: {{ .Values.backup.s3Bucket | quote }}
                - name: PGBACKREST_REPO1_S3_ENDPOINT
                  value: {{ .Values.backup.s3Endpoint | quote }}
                - name: PGBACKREST_REPO1_RETENTION_FULL
                  value: {{ .Values.backup.retention.fullDays | quote }}
                - name: PGBACKREST_REPO1_RETENTION_DIFF
                  value: {{ .Values.backup.retention.diffDays | quote }}
                - name: PGBACKREST_REPO1_CIPHER_TYPE
                  value: "aes-256-cbc"
                - name: PGBACKREST_PG1_HOST
                  value: {{ include "postgres-aegis.writerName" . }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  pgbackrest --stanza=casino --type=full backup
                  pgbackrest --stanza=casino info
              volumeMounts:
                # pgBackRest takes its lock under /tmp/pgbackrest and spools
                # there while streaming to S3. That is the only write it needs,
                # so an emptyDir buys back readOnlyRootFilesystem for the rest
                # of the image instead of leaving the whole thing writable.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
