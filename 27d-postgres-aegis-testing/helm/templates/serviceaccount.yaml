apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgres-aegis.fullname" . }}
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postgres-aegis.fullname" . }}
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postgres-aegis.fullname" . }}
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "postgres-aegis.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "postgres-aegis.fullname" . }}
    namespace: {{ .Release.Namespace }}
