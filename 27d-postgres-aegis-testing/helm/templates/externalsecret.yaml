{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "postgres-aegis.fullname" . }}-aegis-dek
  labels:
    {{- include "postgres-aegis.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "postgres-aegis.fullname" . }}-aegis-dek
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AEGIS_DEK: "{{ `{{ .dek }}` }}"
        POSTGRES_SUPERUSER_PASSWORD: "{{ `{{ .super_pw }}` }}"
        POSTGRES_REPLICATION_PASSWORD: "{{ `{{ .repl_pw }}` }}"
  data:
    - secretKey: dek
      remoteRef:
        key: {{ .Values.aegis.dekSecretPath }}
        property: value
    - secretKey: super_pw
      remoteRef:
        key: casino/postgres/aegis/super
        property: password
    - secretKey: repl_pw
      remoteRef:
        key: casino/postgres/aegis/replicator
        property: password
{{- end }}
