# =============================================================================
# nginx-cdn.conf — Production Nginx CDN for iGaming
# =============================================================================
# Architecture role: Edge cache layer sitting in front of game origin servers.
# Tested on: OpenResty / Nginx 1.25+ (compatible with plain nginx 1.20+)
#
# Ports:
#   :8080  HTTP (redirect to HTTPS in production)
#   :8443  HTTPS with TLS termination
#
# Origin: http://127.0.0.1:3000 (replace with your game server)
# =============================================================================

# Number of worker processes — set to number of CPU cores.
# "auto" lets Nginx detect this automatically.
worker_processes auto;

# Max open files per worker. For a proxy, size this at >= 2x worker_connections:
# each proxied connection holds a client fd plus an upstream fd.
# On Linux, raise with: ulimit -n 65535 or /etc/security/limits.conf
worker_rlimit_nofile 65535;

events {
    # Max simultaneous connections per worker.
    # Total capacity = worker_processes * worker_connections.
    worker_connections 16384;

    # On Linux, epoll is the most efficient I/O model.
    use epoll;

    # Accept multiple connections per epoll event cycle.
    # Improves throughput under heavy load.
    multi_accept on;
}

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # LOGGING — structured JSON for log aggregation (Loki, Elasticsearch, etc.)
    # --------------------------------------------------------------------------
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"cache_status":"$upstream_cache_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"}';

    access_log /var/log/nginx/access.log json_combined;

    # --------------------------------------------------------------------------
    # PERFORMANCE TUNING
    # --------------------------------------------------------------------------
    # Use kernel sendfile() to copy files to socket — avoids user-space copy.
    sendfile on;
    # Batch TCP packets; improves throughput for large files.
    tcp_nopush on;
    # Disable Nagle — reduces latency for small real-time responses (odds feeds).
    tcp_nodelay on;
    # Close idle keepalive connections after 65s.
    keepalive_timeout 65;
    # Allow up to 1000 requests per keepalive connection.
    keepalive_requests 1000;
    # Hide Nginx version from Server header (security hardening).
    server_tokens off;

    # --------------------------------------------------------------------------
    # GZIP COMPRESSION
    # Reduces bandwidth for text-based content (JS, JSON, CSS, HTML).
    # Do NOT compress pre-compressed assets (.gz, .br) or binary game bundles.
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;         # Tell intermediaries this response varies by Accept-Encoding
    gzip_proxied any;     # Compress proxied responses too
    gzip_comp_level 6;    # 1=fastest, 9=best compression; 6 is the sweet spot
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024; # Don't compress responses < 1KB
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml;

    # --------------------------------------------------------------------------
    # PROXY CACHE ZONE
    # Stored on disk in /var/cache/nginx/cdn_cache/
    # keys_zone=cdn_cache:100m — 100MB of metadata in RAM (~800K cache entries)
    # max_size=10g — maximum 10GB of cached content on disk
    # inactive=24h — purge entries not accessed within 24 hours
    # --------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/cdn_cache/
        levels=1:2
        keys_zone=cdn_cache:100m
        max_size=10g
        inactive=24h
        use_temp_path=off;

    # Global cache settings
    proxy_cache_lock on;           # Only one request fetches uncached item (thundering herd prevention)
    proxy_cache_lock_timeout 5s;   # If origin is slow, other requests wait max 5s
    proxy_cache_use_stale error timeout updating; # Serve stale if origin errors
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;

    # --------------------------------------------------------------------------
    # RATE LIMITING
    # Protect origin from floods and DDoS at the CDN edge.
    # 100 req/s per IP for regular traffic; 1 req/s for login endpoints.
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=cdn_general:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=cdn_login:10m  rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=cdn_conn:10m;

    # --------------------------------------------------------------------------
    # UPSTREAM ORIGIN
    # For iGaming: this would point to your game server cluster behind a VIP.
    # keepalive: maintain connection pool (avoids TCP handshake per request).
    # --------------------------------------------------------------------------
    upstream game_origin {
        server 127.0.0.1:3000;
        # server 10.10.0.11:3000 weight=2;   # add more origins with weights
        # server 10.10.0.12:3000 weight=1;
        keepalive 64;          # connection pool size
        keepalive_requests 500;
        keepalive_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # HTTP SERVER (redirect to HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # HTTPS SERVER — Main CDN endpoint
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name _;

        # ------------------------------------------------------------------
        # TLS CONFIGURATION
        # For production: use certbot (Let's Encrypt) or your CA-issued certs.
        # For on-prem regulated markets (NJ DGE): use certs from approved CA.
        # Generate self-signed for testing:
        #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        #     -keyout /etc/nginx/ssl/server.key \
        #     -out /etc/nginx/ssl/server.crt \
        #     -subj "/CN=cdn.example.com"
        # ------------------------------------------------------------------
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Only allow TLS 1.2 and 1.3 (PCI-DSS requirement for payment paths)
        ssl_protocols TLSv1.2 TLSv1.3;
        # Strong cipher suites — ECDHE for forward secrecy
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        # Session cache — avoids full TLS handshake on reconnect (improves latency)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP Stapling — lets Nginx vouch for certificate validity
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ------------------------------------------------------------------
        # SECURITY HEADERS (see security-headers.inc)
        # Required for regulated iGaming markets (UKGC, MGA, NJ DGE). Kept in
        # an include because nginx drops ALL inherited add_header directives
        # in any location that declares its own; every such location below
        # re-includes this file.
        # ------------------------------------------------------------------
        include security-headers.inc;

        # ------------------------------------------------------------------
        # RATE LIMITING (applied at CDN edge, before origin is hit)
        # burst=200 — allow short bursts; nodelay — don't queue, reject immediately
        # ------------------------------------------------------------------
        limit_req zone=cdn_general burst=200 nodelay;
        limit_conn cdn_conn 100;          # Max 100 concurrent connections per IP
        limit_req_status 429;
        limit_conn_status 429;

        # ------------------------------------------------------------------
        # WEBSOCKET PASS-THROUGH
        # Live casino dealers, real-time odds, in-play betting — all use WS.
        # Nginx must NOT try to cache WebSocket connections.
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://game_origin;
            proxy_http_version 1.1;
            # These two headers are required for WebSocket handshake
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long timeout for persistent WS connections (live casino sessions)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # No cache for WebSocket
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # API ENDPOINTS — NO CACHE
        # Player-specific data: wallet balance, bet history, session state.
        # These must NEVER be cached (different player = different data).
        # ------------------------------------------------------------------
        location ~* ^/api/(player|wallet|bet|session|account|kyc)/ {
            proxy_pass http://game_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Explicitly disable caching
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            # Add rate limit for login/registration to prevent brute force
            # limit_req zone=cdn_login burst=10 nodelay;
        }

        # ------------------------------------------------------------------
        # GAME BUNDLES — Long TTL (24 hours)
        # Slot game JS/WASM bundles change only on release, are large (1–20MB),
        # and are the same for all players. Cache aggressively.
        # ------------------------------------------------------------------
        location ~* \.(bundle|wasm|zip)(\?.*)?$ {
            proxy_pass http://game_origin;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri";
            proxy_cache_valid 200 24h;
            proxy_cache_valid 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_pragma;    # Allow cache bypass via Pragma: no-cache
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Show cache status to client (useful for debugging)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400, immutable";
            # CORS for cross-domain game loading
            add_header Access-Control-Allow-Origin "*";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }

        # ------------------------------------------------------------------
        # STATIC ASSETS — 1 hour TTL
        # Images, CSS, fonts, regular JS. More frequent updates than bundles.
        # ------------------------------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|mp4|webm|ogg)(\?.*)?$ {
            proxy_pass http://game_origin;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri";
            proxy_cache_valid 200 1h;
            proxy_cache_valid 301 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_pragma;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }

        # ------------------------------------------------------------------
        # HLS/DASH LIVE STREAMING (live casino, live sports)
        # .m3u8 playlists are short-lived (refreshed every 2–10s by player)
        # .ts segments are immutable once written — cache longer
        # ------------------------------------------------------------------
        location ~* \.m3u8(\?.*)?$ {
            proxy_pass http://game_origin;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 2s;   # Playlists update every 2s for live streams
            proxy_cache_valid 404 1s;
            proxy_cache_lock on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=2";
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }

        location ~* \.ts(\?.*)?$ {
            proxy_pass http://game_origin;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri";
            proxy_cache_valid 200 10m;  # TS segments are immutable
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-Cache-Status $upstream_cache_status always;
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }

        # ------------------------------------------------------------------
        # HEALTH CHECK endpoint — used by HAProxy / load balancers upstream
        # ------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }

        # ------------------------------------------------------------------
        # DEFAULT — pass everything else to origin (no cache)
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://game_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 10m;
            proxy_cache_valid any 0;
            add_header X-Cache-Status $upstream_cache_status always;
            # add_header above cancels inherited headers; re-apply security set
            include security-headers.inc;
        }
    }
}
