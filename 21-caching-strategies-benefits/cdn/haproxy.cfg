# =============================================================================
# haproxy.cfg — Production HAProxy for iGaming
# HAProxy version: 2.6+
# =============================================================================
# Architecture role: Front door. Terminates TLS, routes traffic by path/protocol,
# enforces rate limits, and provides session persistence for game rounds.
#
# Traffic flow:
#   Players → HAProxy (:443 TLS) → Varnish (:6081 cache) → Game Origin (:3000)
#                                 → WebSocket pool (:3001 live casino)
#                                 → API pool (:3002 wallet/account)
#
# Start:
#   haproxy -f /etc/haproxy/haproxy.cfg -D -p /var/run/haproxy.pid
# Reload (zero downtime):
#   haproxy -f /etc/haproxy/haproxy.cfg -sf $(cat /var/run/haproxy.pid)
# =============================================================================

global
    # Log to syslog (rsyslog/journald picks this up)
    log /dev/log  local0
    log /dev/log  local1 notice

    # Security: drop privileges after binding to privileged ports
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

    # PID file for zero-downtime reloads
    pidfile /var/run/haproxy.pid

    # Max concurrent connections (each eats ~50KB RAM)
    maxconn 100000

    # Tune SSL engine for TLS 1.3 performance
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-server-options ssl-min-ver TLSv1.2

    # DH parameter size for DHE cipher suites. No effect with the ECDHE-only
    # cipher list above; kept as a safe default in case DHE suites are enabled.
    tune.ssl.default-dh-param 2048

    # nbthread = number of CPU cores (HAProxy 2.x is multithreaded)
    nbthread 4

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull        # Don't log health checks (noisy)
    option  forwardfor         # Add X-Forwarded-For header
    option  http-server-close  # Close server-side connection (better keepalive mgmt)
    option  redispatch         # Retry on different server if current fails
    retries 3
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    # Long timeout for WebSocket and live casino connections
    timeout tunnel  1h
    # How long to wait for a new request on a keepalive connection
    timeout http-keep-alive 10s
    # How long to wait for request headers
    timeout http-request 10s
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# =============================================================================
# STATS PAGE
# Access at http://your-server:9000/stats with admin:admin
# Critical for ops: see backend health, session counts, request rates in real time
# =============================================================================
listen stats
    bind 127.0.0.1:9000
    stats enable
    stats uri /stats
    stats realm "HAProxy Statistics"
    stats auth admin:changeme-in-production
    stats refresh 5s
    stats show-legends
    stats show-node
    # Hide individual server stats from external parties
    stats hide-version

# =============================================================================
# FRONTEND — HTTP (redirect to HTTPS)
# =============================================================================
frontend http_redirect
    bind *:80
    mode http
    # Redirect all HTTP to HTTPS with 301
    redirect scheme https code 301

# =============================================================================
# FRONTEND — HTTPS (main player-facing endpoint)
# All traffic enters here; ACLs route to appropriate backend pools.
# =============================================================================
frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/server.pem
    mode http

    # --------------------------------------------------------------------------
    # SECURITY HEADERS (set at the load balancer layer, before backend)
    # --------------------------------------------------------------------------
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --------------------------------------------------------------------------
    # RATE LIMITING — Stick Table
    # Track requests per source IP. Deny an IP that makes more than 100 requests
    # within a trailing 10 s window (~10 req/s sustained).
    # The stick table holds up to 100K IP entries; entries expire after 30s idle.
    # --------------------------------------------------------------------------
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    # --------------------------------------------------------------------------
    # ACL DEFINITIONS
    # Match request paths to determine which backend pool handles them.
    # --------------------------------------------------------------------------

    # WebSocket upgrade requests (live casino, in-play betting feed)
    acl is_websocket hdr(Upgrade) -i websocket

    # Player-critical APIs — must go directly to game servers, bypass cache
    acl is_player_api path_beg /api/player/ /api/wallet/ /api/bet/ /api/session/ /api/account/ /api/kyc/ /api/bonus/

    # General API endpoints
    acl is_api path_beg /api/

    # Static CDN assets (game bundles, images, CSS, fonts)
    acl is_static path_end .js .css .png .jpg .jpeg .gif .webp .svg .ico .woff .woff2 .ttf .eot .bundle .wasm .zip .mp4 .webm

    # Health check endpoint (used by upstream load balancers / Kubernetes)
    acl is_health path /health /healthz /ping

    # --------------------------------------------------------------------------
    # ROUTING RULES (order matters — first match wins)
    # --------------------------------------------------------------------------

    # Health checks go to health backend (fast, no logging)
    use_backend health_backend      if is_health

    # WebSocket connections pipe directly to WebSocket pool (live casino)
    use_backend ws_backend          if is_websocket

    # Player-specific APIs go directly to API pool (no cache layer)
    use_backend api_backend         if is_player_api

    # All other API calls go through cache layer
    use_backend cache_backend       if is_api

    # Static assets go through Varnish cache
    use_backend cache_backend       if is_static

    # Default: all game traffic through cache (Varnish handles caching decisions)
    default_backend cache_backend

# =============================================================================
# BACKEND — Varnish Cache Layer
# Varnish sits between HAProxy and origin, providing the cache.
# Health check ensures HAProxy knows if Varnish is sick and can bypass it.
# =============================================================================
backend cache_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect string OK

    # Session persistence for game rounds (a player's in-progress bet should
    # complete on the same backend). Use source IP affinity as fallback;
    # for proper game session affinity, use a session cookie.
    cookie SERVERID insert indirect nocache

    # Varnish instance(s)
    server varnish-1 127.0.0.1:6081 check inter 5s fall 3 rise 2 cookie v1

    # If Varnish is down, fall back to Nginx CDN directly
    # server nginx-cdn-1 127.0.0.1:6083 check inter 5s fall 3 rise 2 backup

# =============================================================================
# BACKEND — Game Origin Servers
# Direct connection for player-critical API calls (wallet, bets, KYC).
# No cache intermediary — these must be fresh.
# =============================================================================
backend api_backend
    balance leastconn    # Route to least-connected server (better for long API calls)
    option httpchk GET /health
    http-check expect status 200

    # Note on draining: removing a server gracefully is done with
    # "set server <backend>/<name> state drain" (or on-marked-down
    # shutdown-sessions), not with a keep-alive directive; http-server-close
    # is already set in defaults and only closes the server-side connection
    # after each response.

    # Game origin servers
    server origin-1 127.0.0.1:3000 check inter 5s fall 3 rise 2 maxconn 500
    # server origin-2 10.10.0.12:3000 check inter 5s fall 3 rise 2 maxconn 500

# =============================================================================
# BACKEND — WebSocket Servers (live casino, in-play)
# Long-lived TCP connections (1h timeout set in defaults section above).
# Use source IP affinity — a player's WebSocket must stay on same server.
# =============================================================================
backend ws_backend
    balance source     # Hash on source IP for sticky WebSocket sessions
    option httpchk GET /health
    http-check expect status 200

    # WebSocket servers (often separate processes from REST API)
    server ws-1 127.0.0.1:3001 check inter 5s fall 3 rise 2

# =============================================================================
# BACKEND — Health Check Responder
# Ultra-lightweight; responds to /health without involving any real backend.
# Used by upstream probes (AWS ELB, Kubernetes liveness probes, etc.)
# =============================================================================
backend health_backend
    mode http
    errorfile 503 /etc/haproxy/errors/503.http

    # HAProxy responds directly to health checks
    server health-local 127.0.0.1:9001 check
