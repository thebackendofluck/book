# Universal GitHub Actions Security Pipeline
# DevSecOps Standard for All Projects

name: Security Pipeline - Universal Standard

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
  # Run full security scan weekly
  - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      security_level:
        description: 'Security scanning level'
        required: true
        default: 'standard'
        type: choice
        options:
        - minimal
        - standard
        - comprehensive
        - maximum

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SECURITY_LEVEL: ${{ github.event.inputs.security_level || 'standard' }}

jobs:
  # Security Level Determination
  determine-security-level:
    name: Determine Security Requirements
    runs-on: ubuntu-latest
    outputs:
      enable_sast: ${{ steps.config.outputs.enable_sast }}
      enable_container: ${{ steps.config.outputs.enable_container }}
      enable_dast: ${{ steps.config.outputs.enable_dast }}
      enable_iac: ${{ steps.config.outputs.enable_iac }}
      enable_provenance: ${{ steps.config.outputs.enable_provenance }}
    steps:
    - name: Configure Security Level
      id: config
      run: |
        case "${{ env.SECURITY_LEVEL }}" in
          minimal)
            echo "enable_sast=true" >> $GITHUB_OUTPUT
            echo "enable_container=false" >> $GITHUB_OUTPUT
            echo "enable_dast=false" >> $GITHUB_OUTPUT
            echo "enable_iac=false" >> $GITHUB_OUTPUT
            echo "enable_provenance=false" >> $GITHUB_OUTPUT
            ;;
          standard)
            echo "enable_sast=true" >> $GITHUB_OUTPUT
            echo "enable_container=true" >> $GITHUB_OUTPUT
            echo "enable_dast=true" >> $GITHUB_OUTPUT
            echo "enable_iac=true" >> $GITHUB_OUTPUT
            echo "enable_provenance=true" >> $GITHUB_OUTPUT
            ;;
          comprehensive)
            echo "enable_sast=true" >> $GITHUB_OUTPUT
            echo "enable_container=true" >> $GITHUB_OUTPUT
            echo "enable_dast=true" >> $GITHUB_OUTPUT
            echo "enable_iac=true" >> $GITHUB_OUTPUT
            echo "enable_provenance=true" >> $GITHUB_OUTPUT
            ;;
          maximum)
            echo "enable_sast=true" >> $GITHUB_OUTPUT
            echo "enable_container=true" >> $GITHUB_OUTPUT
            echo "enable_dast=true" >> $GITHUB_OUTPUT
            echo "enable_iac=true" >> $GITHUB_OUTPUT
            echo "enable_provenance=true" >> $GITHUB_OUTPUT
            ;;
        esac

  # Static Application Security Testing (SAST)
  sast-analysis:
    name: SAST Analysis
    runs-on: ubuntu-latest
    needs: determine-security-level
    if: needs.determine-security-level.outputs.enable_sast == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [ python ]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety semgrep

    # GitHub CodeQL Analysis
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    # Python Security Scans
    - name: Bandit Security Linter
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt || true

    - name: Safety Dependency Check
      run: |
        safety check --json --output safety-report.json || true
        safety check || true

    - name: Semgrep Security Patterns
      run: |
        semgrep --config=auto --json --output=semgrep-report.json . || true
        semgrep --config=auto . || true

    - name: Upload SAST Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sast-reports
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json

  # Container Security Scanning
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    needs: [ determine-security-level, sast-analysis ]
    if: needs.determine-security-level.outputs.enable_container == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Application Images
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Trivy Container Security Scan
    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Trivy Container Image Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-image.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Upload Trivy Reports
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: |
          trivy-fs.sarif
          trivy-image.sarif

    # Push Images if Security Checks Pass
    - name: Push Images to Registry
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # Dynamic Application Security Testing (DAST)
  dast-testing:
    name: DAST Testing
    runs-on: ubuntu-latest
    needs: [ determine-security-level, container-security ]
    if: needs.determine-security-level.outputs.enable_dast == 'true' && (github.event_name == 'push' || github.event_name == 'schedule')
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Start Application Stack
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 30
        curl -f http://localhost:8000/health || exit 1

    # OWASP ZAP Baseline Scan
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        fail_action: false

    # OWASP ZAP Full API Scan
    - name: OWASP ZAP Full API Scan
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:8000/api/v1'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        fail_action: false

    - name: Upload ZAP Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-reports
        path: |
          report_html.html
          report_md.md

    - name: Cleanup Stack
      if: always()
      run: docker-compose down -v

  # Infrastructure as Code Security
  iac-security:
    name: Infrastructure Security
    runs-on: ubuntu-latest
    needs: determine-security-level
    if: needs.determine-security-level.outputs.enable_iac == 'true'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Checkov Infrastructure Scan
    - name: Checkov Infrastructure Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: .
        framework: dockerfile,terraform,kubernetes
        output_format: sarif
        output_file_path: checkov.sarif
        soft_fail: true

    # TFSec Terraform Security Scan
    - name: TFSec Security Scan
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        soft_fail: true
        format: json
        out: tfsec-report.json

    # Terrascan Policy Scan
    - name: Terrascan Policy Scan
      uses: accurics/terrascan-action@v1.5.0
      with:
        iac_type: 'dockerfile'
        iac_version: 'v1'
        policy_type: 'docker'
        only_warn: true

    - name: Upload IaC Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iac-reports
        path: |
          checkov.sarif
          tfsec-report.json

  # Code Provenance & Attestation
  provenance:
    name: Code Provenance
    runs-on: ubuntu-latest
    needs: [ determine-security-level, sast-analysis, container-security ]
    if: needs.determine-security-level.outputs.enable_provenance == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Build Provenance (SLSA)
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: |
          **/Dockerfile
          **/requirements.txt
          **/package.json

    - name: Generate Container Provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: sha256:${{ github.sha }}

  # Security Summary & Reporting
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ sast-analysis, container-security, dast-testing, iac-security, provenance ]
    if: always()
    steps:
    - name: Download All Reports
      uses: actions/download-artifact@v4
      with:
        path: security-reports

    - name: Generate Security Summary
      run: |
        echo "# Security Pipeline Summary" >> security-summary.md
        echo "" >> security-summary.md
        echo "**Pipeline Run**: ${{ github.run_number }}" >> security-summary.md
        echo "**Commit**: ${{ github.sha }}" >> security-summary.md
        echo "**Branch**: ${{ github.ref }}" >> security-summary.md
        echo "**Security Level**: ${{ env.SECURITY_LEVEL }}" >> security-summary.md

    - name: Upload Security Summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md

# Workflow Configuration
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

timeout-minutes: 45
