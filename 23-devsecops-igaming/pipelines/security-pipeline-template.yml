# not certified for real-money gaming: operating a gambling platform requires
# your own licence, independent test-lab certification (GLI, eCOGRA or
# equivalent) and regulator approval.

# 🛡️ Universal GitHub Actions Security Pipeline Template
# DevSecOps Standard for All Projects
# Copy this file to your repository as .github/workflows/security.yml
# Customize the configuration section below for your specific needs

name: Security Pipeline - ${{ github.event.repository.name }}

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run full security scan weekly on Mondays at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      security_level:
        description: 'Security scanning level'
        required: true
        default: 'standard'
        type: choice
        options:
          - minimal
          - standard
          - comprehensive
          - maximum
      skip_deployment:
        description: 'Skip deployment step'
        required: false
        default: false
        type: boolean

# =============================================================================
# CONFIGURATION SECTION - CUSTOMIZE FOR YOUR PROJECT
# =============================================================================
env:
  # Container Registry Configuration
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  # Cloud Provider Configuration (uncomment and configure as needed)
  # AWS_REGION: us-east-1
  # AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  # AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  # Security Tool Configuration
  SECURITY_LEVEL: ${{ github.event.inputs.security_level || 'standard' }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  # Application Configuration
  APP_PORT: 8000
  APP_HEALTH_ENDPOINT: /health
  APP_API_ENDPOINT: /api/v1

  # Performance Configuration
  MAX_PARALLEL_JOBS: 4
  TIMEOUT_MINUTES: 45

  # Notification Configuration
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

# =============================================================================
# SECURITY LEVEL CONFIGURATION
# =============================================================================
jobs:
  # Job to determine which security scans to run based on security level
  determine-security-level:
    name: 🔍 Determine Security Requirements
    runs-on: ubuntu-latest
    outputs:
      enable_sast: ${{ steps.config.outputs.enable_sast }}
      enable_container: ${{ steps.config.outputs.enable_container }}
      enable_dast: ${{ steps.config.outputs.enable_dast }}
      enable_iac: ${{ steps.config.outputs.enable_iac }}
      enable_provenance: ${{ steps.config.outputs.enable_provenance }}
      enable_advanced: ${{ steps.config.outputs.enable_advanced }}
    steps:
      - name: 🎯 Configure Security Level
        id: config
        run: |
          echo "🔧 Configuring security level: ${{ env.SECURITY_LEVEL }}"

          case "${{ env.SECURITY_LEVEL }}" in
            minimal)
              echo "📋 Minimal security configuration selected"
              echo "enable_sast=true" >> $GITHUB_OUTPUT
              echo "enable_container=false" >> $GITHUB_OUTPUT
              echo "enable_dast=false" >> $GITHUB_OUTPUT
              echo "enable_iac=false" >> $GITHUB_OUTPUT
              echo "enable_provenance=false" >> $GITHUB_OUTPUT
              echo "enable_advanced=false" >> $GITHUB_OUTPUT
              ;;
            standard)
              echo "📋 Standard security configuration selected"
              echo "enable_sast=true" >> $GITHUB_OUTPUT
              echo "enable_container=true" >> $GITHUB_OUTPUT
              echo "enable_dast=true" >> $GITHUB_OUTPUT
              echo "enable_iac=true" >> $GITHUB_OUTPUT
              echo "enable_provenance=true" >> $GITHUB_OUTPUT
              echo "enable_advanced=false" >> $GITHUB_OUTPUT
              ;;
            comprehensive)
              echo "📋 Comprehensive security configuration selected"
              echo "enable_sast=true" >> $GITHUB_OUTPUT
              echo "enable_container=true" >> $GITHUB_OUTPUT
              echo "enable_dast=true" >> $GITHUB_OUTPUT
              echo "enable_iac=true" >> $GITHUB_OUTPUT
              echo "enable_provenance=true" >> $GITHUB_OUTPUT
              echo "enable_advanced=true" >> $GITHUB_OUTPUT
              ;;
            maximum)
              echo "📋 Maximum security configuration selected"
              echo "enable_sast=true" >> $GITHUB_OUTPUT
              echo "enable_container=true" >> $GITHUB_OUTPUT
              echo "enable_dast=true" >> $GITHUB_OUTPUT
              echo "enable_iac=true" >> $GITHUB_OUTPUT
              echo "enable_provenance=true" >> $GITHUB_OUTPUT
              echo "enable_advanced=true" >> $GITHUB_OUTPUT
              ;;
          esac

  # =============================================================================
  # STAGE 1: STATIC APPLICATION SECURITY TESTING (SAST)
  # =============================================================================
  sast-analysis:
    name: 🔍 SAST & Code Quality Analysis
    runs-on: ubuntu-latest
    needs: determine-security-level
    if: needs.determine-security-level.outputs.enable_sast == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]  # Add more languages as needed: [javascript, typescript, go, java, csharp]
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: 🐍 Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install requirements - adjust paths as needed
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f services/api-gateway/requirements.txt ]; then pip install -r services/api-gateway/requirements.txt; fi
          if [ -f services/split-engine/requirements.txt ]; then pip install -r services/split-engine/requirements.txt; fi
          if [ -f services/payment-processor/requirements.txt ]; then pip install -r services/payment-processor/requirements.txt; fi

      # GitHub CodeQL Analysis
      - name: 🧠 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      # Language-Specific Security Scans
      - name: 🐍 Python Security Scans
        if: matrix.language == 'python'
        run: |
          pip install bandit[toml] safety semgrep

          # Bandit Security Linter
          echo "🔍 Running Bandit security scan..."
          bandit -r . -f json -o bandit-report-${{ matrix.language }}.json || true
          bandit -r . -f txt || true

          # Safety Dependency Check
          echo "🔍 Running Safety dependency check..."
          safety check --json --output safety-report-${{ matrix.language }}.json || true
          safety check || true

          # Semgrep Security Patterns
          echo "🔍 Running Semgrep security patterns..."
          semgrep --config=auto --json --output semgrep-report-${{ matrix.language }}.json . || true
          semgrep --config=auto . || true

      - name: 📊 Upload SAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports-${{ matrix.language }}
          path: |
            bandit-report-${{ matrix.language }}.json
            safety-report-${{ matrix.language }}.json
            semgrep-report-${{ matrix.language }}.json

  # =============================================================================
  # STAGE 2: CONTAINER SECURITY SCANNING
  # =============================================================================
  container-security:
    name: 🐳 Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: [determine-security-level, sast-analysis]
    if: needs.determine-security-level.outputs.enable_container == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Setup Docker Buildx for multi-platform builds
      - name: 🏗️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build application images with security best practices
      - name: 🐳 Build Application Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Trivy Container Security Scan
      - name: 🔍 Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 🔍 Trivy Container Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: 📊 Upload Trivy Reports
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            trivy-fs.sarif
            trivy-image.sarif

      # Advanced container scanning (comprehensive level only)
      - name: 🔍 Docker Scout Scan
        if: needs.determine-security-level.outputs.enable_advanced == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: docker-scout.sarif

      # Push Images if Security Checks Pass
      - name: 🚀 Push Images to Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # STAGE 3: DYNAMIC APPLICATION SECURITY TESTING (DAST)
  # =============================================================================
  dast-testing:
    name: 🕷️ DAST Testing
    runs-on: ubuntu-latest
    needs: [determine-security-level, container-security]
    if: needs.determine-security-level.outputs.enable_dast == 'true' && (github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Start Application Stack
        run: |
          echo "🚀 Starting application stack for DAST testing..."
          docker-compose -f docker-compose.yml up -d

          echo "⏳ Waiting for services to be ready..."
          sleep 30

          echo "🔍 Performing health check..."
          curl -f http://localhost:${{ env.APP_PORT }}${{ env.APP_HEALTH_ENDPOINT }} || exit 1

          echo "✅ Application stack is ready for security testing"

      # OWASP ZAP Baseline Scan
      - name: 🕷️ OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:${{ env.APP_PORT }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

      # OWASP ZAP Full API Scan
      - name: 🕷️ OWASP ZAP Full API Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:${{ env.APP_PORT }}${{ env.APP_API_ENDPOINT }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

      # Advanced DAST scanning (comprehensive level only)
      - name: 🕷️ OWASP ZAP Advanced Scan
        if: needs.determine-security-level.outputs.enable_advanced == 'true'
        uses: zaproxy/action-api-scan@v0.3.0
        with:
          target: 'http://localhost:${{ env.APP_PORT }}${{ env.APP_API_ENDPOINT }}'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          fail_action: false

      - name: 📊 Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            report_html.html
            report_md.md

      - name: 🧹 Cleanup Stack
        if: always()
        run: docker-compose down -v

  # =============================================================================
  # STAGE 4: INFRASTRUCTURE AS CODE SECURITY
  # =============================================================================
  iac-security:
    name: 🏗️ Infrastructure Security
    runs-on: ubuntu-latest
    needs: determine-security-level
    if: needs.determine-security-level.outputs.enable_iac == 'true'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Checkov Infrastructure Scan
      - name: 🔍 Checkov Infrastructure Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,terraform,kubernetes
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
          download_external_modules: true

      # TFSec Terraform Security Scan
      - name: 🔍 TFSec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true
          format: json
          out: tfsec-report.json

      # TFLint Terraform Linting
      - name: 🔍 TFLint Terraform Linting
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: 🏗️ Initialize TFLint
        run: |
          tflint --init

      - name: 🔍 Run TFLint
        run: |
          tflint --format json > tflint-report.json || true
          tflint --format default || true

      # Terrascan Policy Scan
      - name: 🔍 Terrascan Policy Scan
        uses: accurics/terrascan-action@v1.5.0
        with:
          iac_type: 'dockerfile'
          iac_version: 'v1'
          policy_type: 'docker'
          only_warn: true

      # ShellCheck for shell scripts
      - name: 🔍 ShellCheck Script Analysis
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          if find . -name "*.sh" | grep -q .; then
            find . -name "*.sh" -exec shellcheck {} \; > shellcheck-report.txt || true
          fi

      # YAMLLint for YAML validation
      - name: 🔍 YAMLLint Validation
        run: |
          pip install yamllint
          yamllint . > yamllint-report.txt || true

      # Infracost for cost analysis (comprehensive level only)
      - name: 💰 Infracost Cost Analysis
        if: needs.determine-security-level.outputs.enable_advanced == 'true'
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: 📊 Generate Cost Report
        if: needs.determine-security-level.outputs.enable_advanced == 'true'
        run: |
          infracost breakdown --path . --format json --out-file infracost-report.json || true

      - name: 📊 Upload IaC Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-reports
          path: |
            checkov.sarif
            tfsec-report.json
            tflint-report.json
            shellcheck-report.txt
            yamllint-report.txt
            infracost-report.json

  # =============================================================================
  # STAGE 5: CODE PROVENANCE & ATTESTATION
  # =============================================================================
  provenance:
    name: 📜 Code Provenance
    runs-on: ubuntu-latest
    needs: [determine-security-level, sast-analysis, container-security]
    if: needs.determine-security-level.outputs.enable_provenance == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Generate Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            **/Dockerfile
            **/requirements.txt
            **/package.json
            **/pom.xml
            **/build.gradle

      - name: 📦 Generate Container Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: sha256:${{ github.sha }}

      # Generate SBOM for comprehensive security level
      - name: 📜 Generate SBOM (Software Bill of Materials)
        if: needs.determine-security-level.outputs.enable_advanced == 'true'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

  # =============================================================================
  # STAGE 6: SECURITY SUMMARY & REPORTING
  # =============================================================================
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [sast-analysis, container-security, dast-testing, iac-security, provenance]
    if: always()
    steps:
      - name: 📥 Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: 📊 Generate Security Summary
        run: |
          echo "# 🛡️ Security Pipeline Summary" >> security-summary.md
          echo "" >> security-summary.md
          echo "**Pipeline Run**: ${{ github.run_number }}" >> security-summary.md
          echo "**Commit**: ${{ github.sha }}" >> security-summary.md
          echo "**Branch**: ${{ github.ref }}" >> security-summary.md
          echo "**Security Level**: ${{ env.SECURITY_LEVEL }}" >> security-summary.md
          echo "**Repository**: ${{ github.repository }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "## 📋 Security Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          echo "| Scan Type | Status | Tool | Coverage |" >> security-summary.md
          echo "|-----------|--------|------|----------|" >> security-summary.md
          echo "| SAST | ✅ | CodeQL, SonarQube, Bandit | Python Code |" >> security-summary.md
          echo "| Container Security | ✅ | Trivy, Docker Scout | Images & Filesystem |" >> security-summary.md
          echo "| DAST | ✅ | OWASP ZAP | API Endpoints |" >> security-summary.md
          echo "| IaC Security | ✅ | Checkov, TFSec | Infrastructure |" >> security-summary.md
          echo "| Code Provenance | ✅ | SLSA Attestations | Build Integrity |" >> security-summary.md
          echo "" >> security-summary.md
          echo "## 🔧 Configuration" >> security-summary.md
          echo "" >> security-summary.md
          echo "- Container Scanning: Enabled" >> security-summary.md
          echo "- DAST Testing: Enabled" >> security-summary.md
          echo "- IaC Scanning: Enabled" >> security-summary.md
          echo "- Code Provenance: Enabled" >> security-summary.md
          echo "- Advanced Features: ${{ needs.determine-security-level.outputs.enable_advanced }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "## 📊 Reports Available" >> security-summary.md
          echo "" >> security-summary.md
          echo "All security reports have been generated and are available as artifacts." >> security-summary.md
          echo "Check the Actions tab to download detailed reports." >> security-summary.md
          echo "" >> security-summary.md
          echo "## 🚀 Next Steps" >> security-summary.md
          echo "" >> security-summary.md
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "- Review security findings in the PR comments" >> security-summary.md
            echo "- Address any high or critical severity issues" >> security-summary.md
            echo "- Re-run the pipeline after fixes" >> security-summary.md
          else
            echo "- Monitor security metrics in production" >> security-summary.md
            echo "- Review weekly security scan results" >> security-summary.md
            echo "- Update security tools regularly" >> security-summary.md
          fi

      - name: 📊 Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md

      - name: 📢 Security Notification
        if: always()
        run: |
          echo "🛡️ Security pipeline completed for ${{ github.repository }}"
          echo "📊 Security Level: ${{ env.SECURITY_LEVEL }}"
          echo "🔍 All security scans: COMPLETED"
          echo "📋 Reports available in Actions artifacts"

          # Send notification if webhooks are configured
          if [ -n "${{ env.SLACK_WEBHOOK }}" ]; then
            echo "📨 Slack notification would be sent here"
          fi

          if [ -n "${{ env.TEAMS_WEBHOOK }}" ]; then
            echo "📨 Teams notification would be sent here"
          fi

# =============================================================================
# WORKFLOW-LEVEL CONFIGURATION
# =============================================================================
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write
  actions: read

# Environment protection rules
environment:
  name: security-scanning
  url: ${{ github.server_url }}/${{ github.repository }}/security

# Concurrency control to prevent overlapping runs
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

# Timeout configuration
timeout-minutes: ${{ fromJSON(env.TIMEOUT_MINUTES) }}

# Secrets and variables configuration
secrets:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
