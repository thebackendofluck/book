# Dependabot Configuration for DevSecOps Standard
# Automated dependency updates for security and maintenance

version: 2

# Update schedule configuration
updates:
# Python Dependencies
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "02:00"
    timezone: "Europe/Amsterdam"
  open-pull-requests-limit: 10
  commit-message:
    prefix: "security"
    prefix-development: "pip"
    include: "scope"
  labels:
  - "dependencies"
  - "security"
  - "python"
  target-branch: "main"
  versioning-strategy: "increase-if-necessary"

