- name: pg_hba.conf | Include envs/{{ target }} specific variables
  include_vars: "vars/envs/{{ target }}.yml"

- name: pg_hba.conf | Add custom line
  become: true
  lineinfile:
    path: /etc/postgresql/10/main/pg_hba.conf
    line: "{{ item.line }}"
  loop:
    - { line: '{{ line_1 }}'}
  notify: Reload Postgresql
