- name: Docker | Include {{ ansible_distribution }} specific variables
  include_vars: "vars/os/{{ ansible_distribution.split(' ', 1)[0]|lower }}.yml"

- name: Prune containers older than 14 days
  become: true
  shell: |
    docker container prune --force --filter "until=336h" || docker container prune --force
  register: container_cleanup_rhel

- name: Prune Images (including non-dangling images) older than 14 days
  become: true
  shell: |
    docker image prune -a --force --filter "until=336h" --filter="label!={{ persist_label }}" || docker image prune -a --force
  register: image_cleanup_rhel

- name: Install Logrotate
  include_tasks: "pkg_mgr/{{ ansible_pkg_mgr }}.yml"
