# Trivy / Grype scanner exclusion configuration for iGaming platforms
#
# These are known false positives specific to the gambling platform supply chain.
# Exclusions are deliberately narrow: each entry targets a specific CVE (Common
# Vulnerabilities and Exposures) or finding in a specific package so that real
# vulnerabilities in the same package are still reported.
#
# Review and re-validate every exclusion on each quarterly security review cycle.
# Reference: Chapter 23 — DevSecOps for iGaming
#
# Format: Trivy .trivyignore (one CVE per line, optional comment)
# Grype: reference this file via --only-fixed or --ignore-wontfix flags in your
#        CI pipeline; Grype uses a separate .grype/config.yaml (see below).

# ---------------------------------------------------------------------------
# Game provider SDKs — false positives in bundled vendor JS
# ---------------------------------------------------------------------------

# Evolution Gaming live casino SDK bundles an old lodash copy for IE11 compat.
# The CVE affects prototype-pollution, which is unexploitable in a server-side
# context.  Evolution confirmed patch timeline: Q3 next release.
CVE-2021-23337  # lodash < 4.17.21 in evolution-sdk-bundle

# Pragmatic Play RTP (Return to Player) calculator ships with an embedded copy
# of moment.js 2.29.1. The ReDoS (Regular Expression Denial of Service) vector
# requires attacker-controlled locale input — not possible in our integration.
CVE-2022-31129  # moment.js ReDoS — pragmatic-play-rtp-calc integration

# NetEnt game iframe wrapper uses jquery 1.x for legacy browser support.
# The XSS (Cross-Site Scripting) paths require direct DOM manipulation we do
# not exercise.
CVE-2019-11358  # jquery prototype pollution — netent-iframe-wrapper
CVE-2020-11022  # jquery XSS — netent-iframe-wrapper
CVE-2020-11023  # jquery XSS — netent-iframe-wrapper

# ---------------------------------------------------------------------------
# Payment gateway SDKs — vendor-locked versions
# ---------------------------------------------------------------------------

# Worldpay XML parser uses an old version of org.apache.commons:commons-text
# that includes the StringSubstitutor interpolation issue (Log4Shell-adjacent).
# Worldpay API calls are server-to-server only; no player-controlled input
# reaches the parser.  Vendor patch pending — tracked in JIRA PAYW-4182.
CVE-2022-42889  # commons-text StringLookup — worldpay-sdk

# Nuvei SDK depends on jackson-databind 2.13.x with a polymorphic deserialization
# gadget.  We use ObjectMapper with DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES
# and an explicit type allowlist, making the gadget chain inert.
CVE-2022-42003  # jackson-databind — nuvei-sdk
CVE-2022-42004  # jackson-databind — nuvei-sdk

# ---------------------------------------------------------------------------
# KYC / AML provider SDKs
# ---------------------------------------------------------------------------

# Onfido iOS SDK ships with a copy of OpenSSL 1.1.1n for on-device crypto.
# The ALPN (Application-Layer Protocol Negotiation) confusion CVE (CVE-2022-0778) is
# only triggerable during TLS negotiation from a malicious server — not our
# threat model for client SDK verification calls.
CVE-2022-0778   # OpenSSL infinite loop — onfido-ios-sdk

# Jumio identity verification SDK embeds libpng 1.6.37 for document scanning.
# The heap overflow requires a crafted PNG from an attacker — document images
# come directly from the player's camera/upload and are validated before
# processing.
CVE-2019-7317   # libpng heap overflow — jumio-doccheck-sdk

# ---------------------------------------------------------------------------
# Marketing and analytics tools
# ---------------------------------------------------------------------------

# Segment.io analytics SDK (node) — prototype pollution in deep merge utility.
# Our integration only passes scalar event properties; no nested user-supplied
# objects are merged.
CVE-2020-7774   # y18n prototype pollution — segment-analytics-node

# Braze SDK uses an old copy of OkHttp 3.x on Android.  The TLS stripping
# attack requires a network attacker — SDK traffic goes over certificate-pinned
# connections.
CVE-2023-0469   # OkHttp TLS stripping — braze-android-sdk

# ---------------------------------------------------------------------------
# Infrastructure / base images
# ---------------------------------------------------------------------------

# Alpine Linux 3.17 ships with a zlib version affected by an integer overflow.
# Exploiting this requires the attacker to supply a crafted compressed stream
# to our services.  All inbound compressed data comes from trusted providers
# over mTLS connections.  Alpine upstream has backported a fix; we will upgrade
# on the next base image cycle (tracked: INFRA-7291).
CVE-2022-37434  # zlib integer overflow — alpine:3.17

# Amazon Linux 2 kernel CVE for speculative execution — irrelevant in
# containerised workloads running on AWS-managed EC2 with hardware mitigations.
CVE-2022-23825  # AMD speculative execution — amzn2-kernel

# ---------------------------------------------------------------------------
# Go runtime — acceptable risk in controlled environments
# ---------------------------------------------------------------------------

# net/http HTTP/2 rapid reset attack (CVE-2023-44487).  All our Go services
# sit behind AWS ALB (Application Load Balancer) with HTTP/2 rapid reset mitigation
# enabled.  The ALB absorbs the attack before it reaches the application layer.
CVE-2023-44487  # HTTP/2 rapid reset — go-runtime (ALB mitigated)
CVE-2023-39325  # net/http rapid reset — go-runtime (ALB mitigated)

# ---------------------------------------------------------------------------
# Internal tooling — development and CI only, never in production images
# ---------------------------------------------------------------------------

# gitleaks used for secret scanning in CI — ships with a copy of go-git that
# has a known path traversal.  Only runs on source code, never on prod data.
CVE-2023-49569  # go-git path traversal — gitleaks (CI tool only)

# trivy itself — suppress findings about trivy's own bundled db client.
# If trivy is compromised the whole scanning chain is moot.
CVE-2023-47108  # otelgrpc — trivy (scanner itself)
