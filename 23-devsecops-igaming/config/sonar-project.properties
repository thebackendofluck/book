# SonarQube Configuration for DevSecOps Standard
# Universal security and code quality configuration

# Project Identification
sonar.projectKey=devsecops-universal-standard
sonar.projectName=Universal DevSecOps Security Standard
sonar.projectVersion=1.0.0
sonar.projectDescription=Comprehensive DevSecOps security pipeline with automated scanning, compliance validation, and continuous monitoring

# Source Code Configuration
sonar.sources=.
sonar.tests=tests,test,spec
sonar.binaries=build,dist,target

# Language Configuration (Multi-language support)
sonar.language=multi
sonar.python.version=3.11
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.typescript.file.suffixes=.ts,.tsx
sonar.java.file.suffixes=.java
sonar.go.file.suffixes=.go
sonar.php.file.suffixes=.php

# Exclusions (Security-focused)
sonar.exclusions=\
  **/migrations/**,\
  **/venv/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  **/bower_components/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.git/**,\
  **/.terraform/**,\
  **/*.tfstate*,\
  **/coverage/**,\
  **/docs/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/vendor/**,\
  **/third_party/**,\
  **/lib/**,\
  **/external/**,\
  **/generated/**,\
  **/proto/**,\
  **/protobuf/**

# Test Exclusions
sonar.test.exclusions=\
  **/test/**,\
  **/tests/**,\
  **/spec/**,\
  **/__tests__/**,\
  **/*test*.js,\
  **/*spec*.js,\
  **/*test*.py,\
  **/*spec*.py,\
  **/test_*.py,\
  **/*_test.py

# Coverage Configuration
sonar.coverage.exclusions=\
  **/test/**,\
  **/tests/**,\
  **/spec/**,\
  **/__tests__/**,\
  **/migrations/**,\
  **/config/**,\
  **/settings/**,\
  **/admin.py,\
  **/manage.py,\
  **/wsgi.py,\
  **/asgi.py,\
  **/urls.py,\
  **/routing.py

# Security Configuration
sonar.security.hotspots.include=\
  **/*.py,\
  **/*.js,\
  **/*.ts,\
  **/*.java,\
  **/*.go,\
  **/*.php,\
  **/*.cs,\
  **/*.rb,\
  **/*.scala,\
  **/*.kt

# Quality Gate Configuration
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Database Configuration (if using external DB)
# sonar.jdbc.url=jdbc:postgresql://localhost:5432/sonarqube
# sonar.jdbc.username=sonarqube
# sonar.jdbc.password=sonarqube

# Server Configuration
sonar.host.url=https://sonarcloud.io
sonar.login=${SONAR_TOKEN}
sonar.organization=${SONAR_ORGANIZATION}

# Analysis Parameters
sonar.scm.provider=git
sonar.scm.forceReloadAll=true
sonar.cpd.exclusions=**/test/**,**/tests/**

# Python-Specific Configuration
sonar.python.coverage.reportPaths=coverage.xml,coverage-reports/coverage-*.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt

# JavaScript/TypeScript Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.eslint.reportPaths=eslint-report.json
sonar.typescript.tslint.reportPaths=tslint-report.json

# Java Configuration
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=11
sonar.java.target=11
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/jacoco.exec

# Go Configuration
sonar.go.tests.reportPaths=test-report.xml
sonar.go.coverage.reportPaths=coverage.out
sonar.go.govet.reportPaths=govet-report.json
sonar.go.golint.reportPaths=golint-report.json

# PHP Configuration
sonar.php.tests.reportPath=test-report.xml
sonar.php.coverage.reportPaths=coverage.xml

# Security Hotspots
sonar.security.hotspots.include=\
  **/*.py,\
  **/*.js,\
  **/*.ts,\
  **/*.java,\
  **/*.go,\
  **/*.php,\
  **/*.cs,\
  **/*.rb,\
  **/*.scala,\
  **/*.kt

# Rule Configuration (Security-focused)
sonar.issue.enforceSeverity=true
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore test files for certain rules
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test/**/*.py

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test/**/*.py

sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/test/**/*.js

sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S100
sonar.issue.ignore.multicriteria.e4.resourceKey=**/test/**/*.ts

sonar.issue.ignore.multicriteria.e5.ruleKey=java:S100
sonar.issue.ignore.multicriteria.e5.resourceKey=**/test/**/*.java

# Advanced Security Settings
sonar.security.api.url=https://sonarcloud.io/api
sonar.security.api.timeout=30
sonar.security.hotspots.threshold=HIGH

# Performance Settings
sonar.analysis.mode=publish
sonar.scanner.metadataFilePath=.sonar/.sonar_report.json
sonar.scanner.dumpToFile=.sonar/sonar-dump.json

# Logging Configuration
sonar.log.level=INFO
sonar.log.rollingPolicy=time:yyyy-MM-dd
sonar.log.maxFiles=7

# Custom Rules for Financial/Gambling Applications
# These can be extended based on specific compliance requirements
sonar.customRules.financial=true
sonar.customRules.gambling=true
sonar.customRules.pciDss=true
sonar.customRules.gdpr=true
