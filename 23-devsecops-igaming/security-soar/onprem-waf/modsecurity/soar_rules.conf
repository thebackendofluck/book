# =============================================================================
# AcmeToCasino - ModSecurity SOAR Rules
# File: /etc/nginx/modsec/soar_rules/soar_rules.conf
#
# This file contains the baseline SOAR security rules for the AcmeToCasino
# iGaming platform.  Rules added at runtime by modsecurity_manager.py are
# written to soar_dynamic.conf (included below).
#
# Rule ID namespace:
#   9000000 - 9499999  Custom / SOAR-generated rules
#   9500000 - 9599999  Virtual patches
#   9600000 - 9699999  iGaming-specific fraud patterns
#   9700000 - 9799999  Rate limiting and anti-bot
#   9800000 - 9899999  Brute force protection
#   9900000 - 9999999  SQL injection enhancements
# =============================================================================

# ---------------------------------------------------------------------------
# Include SOAR-generated dynamic rules (populated by modsecurity_manager.py)
# ---------------------------------------------------------------------------
Include /etc/nginx/modsec/soar_rules/soar_dynamic.conf
Include /etc/nginx/modsec/soar_rules/virtual_patches.conf


# =============================================================================
# SECTION 1: Request Validation Basics
# =============================================================================

# Block requests with no User-Agent (bots, scanners, raw exploit tools)
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:9000100,\
    phase:1,\
    deny,status:400,\
    log,auditlog,\
    msg:'Missing User-Agent header',\
    severity:NOTICE,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'bot-detection'"

# Block requests with excessively long URIs (path traversal / scanner noise)
SecRule REQUEST_URI "@gt 2048" \
    "id:9000101,\
    phase:1,\
    deny,status:414,\
    log,auditlog,\
    msg:'Request URI too long - possible scanner',\
    severity:WARNING,\
    tag:'SOAR',\
    tag:'scanner-detection'"

# Block requests with excessively long individual argument values
SecRule ARGS "@gt 8192" \
    "id:9000102,\
    phase:2,\
    deny,status:400,\
    log,auditlog,\
    msg:'Argument value exceeds maximum length',\
    severity:WARNING,\
    tag:'SOAR',\
    tag:'input-validation'"

# Reject requests with null bytes in URI or body
SecRule REQUEST_URI|REQUEST_BODY "@rx \x00" \
    "id:9000103,\
    phase:2,\
    deny,status:400,\
    t:none,\
    log,auditlog,\
    msg:'Null byte injection attempt',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'injection'"


# =============================================================================
# SECTION 2: Anti-Bot Rules
# =============================================================================

# Block known automation / scraping frameworks (case-insensitive)
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(sqlmap|nikto|nessus|openvas|masscan|nmap|dirbuster|gobuster|wfuzz|hydra|medusa|burpsuite|ZAP|python-requests\/[01]\.|curl\/[0-6]\.|wget\/1\.[01]\.|zgrab|nuclei|acunetix|appscan)" \
    "id:9700100,\
    phase:1,\
    deny,status:403,\
    log,auditlog,\
    msg:'Known security scanner or attack tool User-Agent',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'bot-scanner'"

# Block known gambling fraud bots
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(bonusabuse|casinobot|slotbot|gamblingbot|freespin|bonushunter|casinocheat|betfarm|arbbot|surebetbot)" \
    "id:9700101,\
    phase:1,\
    deny,status:403,\
    log,auditlog,\
    msg:'Known iGaming fraud bot User-Agent',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'igaming-fraud',\
    tag:'bot'"

# Detect headless browser fingerprints
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(HeadlessChrome|PhantomJS|Selenium|puppeteer|playwright|webdriver)" \
    "id:9700102,\
    phase:1,\
    deny,status:403,\
    log,auditlog,\
    msg:'Headless browser / automation framework detected',\
    severity:ERROR,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'headless-browser'"

# Missing Accept header (typical of automated tools, not real browsers)
SecRule &REQUEST_HEADERS:Accept "@eq 0" \
    "id:9700103,\
    phase:1,\
    log,auditlog,\
    pass,\
    msg:'Missing Accept header - potential bot',\
    severity:NOTICE,\
    tag:'SOAR',\
    tag:'bot-detection'"


# =============================================================================
# SECTION 3: Brute Force Protection (Login Endpoints)
# =============================================================================

# Track failed login attempts per IP (phase 5 = logging phase)
# The actual rate enforcement is done by fail2ban reading the WAF audit log,
# but we add a secondary WAF-layer rate limit here.

# Flag POST to /api/*/auth/login or /api/*/login
SecRule REQUEST_METHOD "@streq POST" \
    "id:9800100,\
    phase:1,\
    chain,\
    log,auditlog,pass,\
    msg:'Login endpoint access - tracking',\
    severity:INFO,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'brute-force-track',\
    setvar:ip.login_attempts=+1,\
    expirevar:ip.login_attempts=300"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(auth/)?login" \
        "t:none,t:urlDecodeUni"

# Block IP after 10 failed logins within 5 minutes
SecRule IP:LOGIN_ATTEMPTS "@ge 10" \
    "id:9800101,\
    phase:1,\
    deny,status:429,\
    log,auditlog,\
    msg:'Brute force threshold exceeded on login endpoint',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'brute-force'"

# Password reset endpoint - separate (tighter) counter
SecRule REQUEST_METHOD "@streq POST" \
    "id:9800110,\
    phase:1,\
    chain,\
    log,auditlog,pass,\
    msg:'Password reset attempt - tracking',\
    severity:INFO,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'password-reset-track',\
    setvar:ip.pwreset_attempts=+1,\
    expirevar:ip.pwreset_attempts=3600"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(auth/)?(password.?reset|forgot.?password|reset.?password)" \
        "t:none,t:urlDecodeUni"

SecRule IP:PWRESET_ATTEMPTS "@ge 5" \
    "id:9800111,\
    phase:1,\
    deny,status:429,\
    log,auditlog,\
    msg:'Password reset rate limit exceeded',\
    severity:ERROR,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'password-reset-abuse'"

# Registration endpoint flood (account farm detection)
SecRule REQUEST_METHOD "@streq POST" \
    "id:9800120,\
    phase:1,\
    chain,\
    log,auditlog,pass,\
    msg:'Account registration - tracking',\
    severity:INFO,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'account-farm-track',\
    setvar:ip.reg_attempts=+1,\
    expirevar:ip.reg_attempts=3600"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(auth/)?(register|signup|create.?account)" \
        "t:none,t:urlDecodeUni"

SecRule IP:REG_ATTEMPTS "@ge 3" \
    "id:9800121,\
    phase:1,\
    deny,status:429,\
    log,auditlog,\
    msg:'Account registration rate limit exceeded - possible account farm',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'account-farm'"


# =============================================================================
# SECTION 4: SQL Injection Enhanced Patterns (iGaming Context)
# =============================================================================

# Standard OWASP CRS covers basic SQLi.  These rules target patterns
# observed in iGaming database schema attacks (player tables, transaction logs).

# Detect attempts to access iGaming-specific table names
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)(player(s|_accounts?|_balances?|_sessions?)|wallet(s|_transactions?)|bonus(es|_claims?|_abuse)|bet(s|_history|_transactions?)|casino_accounts?|payment_methods?)" \
    "id:9900100,\
    phase:2,\
    deny,status:400,\
    t:none,t:urlDecodeUni,t:lowercase,\
    log,auditlog,\
    msg:'SQL injection attempt targeting iGaming table names',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'sqli-igaming'"

# Detect UNION-based injection with iGaming schema keywords
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)union\s+(all\s+)?select.{0,100}(player|balance|wallet|bonus|transaction|bet)" \
    "id:9900101,\
    phase:2,\
    deny,status:400,\
    t:none,t:urlDecodeUni,t:removeComments,t:compressWhitespace,\
    log,auditlog,\
    msg:'UNION SELECT injection targeting iGaming data',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'sqli-union'"

# Detect stacked queries (common in PostgreSQL attacks against iGaming backends)
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)(;\s*(drop|truncate|delete|update|insert)\s+(table|into|from)\s)" \
    "id:9900102,\
    phase:2,\
    deny,status:400,\
    t:none,t:urlDecodeUni,t:removeComments,\
    log,auditlog,\
    msg:'Stacked query injection attempt',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'sqli-stacked'"

# Detect time-based blind injection (SLEEP, WAITFOR, pg_sleep)
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)(sleep\s*\(\s*\d+\s*\)|waitfor\s+delay\s+'|pg_sleep\s*\(\s*\d+\s*\)|benchmark\s*\(\s*\d+)" \
    "id:9900103,\
    phase:2,\
    deny,status:400,\
    t:none,t:urlDecodeUni,t:removeComments,\
    log,auditlog,\
    msg:'Time-based blind SQL injection detected',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'sqli-blind-time'"

# Detect boolean-based blind injection patterns
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)((\bor\b|\band\b)\s+[\w'\"]+\s*[=<>!]+\s*[\w'\"]+\s*(--|#|\/\*))" \
    "id:9900104,\
    phase:2,\
    deny,status:400,\
    t:none,t:urlDecodeUni,t:removeComments,t:compressWhitespace,\
    log,auditlog,\
    msg:'Boolean-based blind SQL injection detected',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'sqli-blind-bool'"


# =============================================================================
# SECTION 5: iGaming-Specific Fraud Pattern Rules
# =============================================================================

# Bonus abuse: detect requests that match bonus-hunting patterns
# (Checking for bonus codes being tried in bulk from the same IP)
SecRule REQUEST_METHOD "@streq POST" \
    "id:9600100,\
    phase:2,\
    chain,\
    log,auditlog,pass,\
    msg:'Bonus code attempt - tracking',\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'bonus-abuse-track',\
    setvar:ip.bonus_attempts=+1,\
    expirevar:ip.bonus_attempts=3600"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(bonus(es)?|promo(tion)?s?|coupon|voucher|free.?spin)" \
        "t:none,t:urlDecodeUni"

SecRule IP:BONUS_ATTEMPTS "@ge 20" \
    "id:9600101,\
    phase:2,\
    deny,status:429,\
    log,auditlog,\
    msg:'Bonus abuse pattern detected: excessive bonus endpoint requests',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'bonus-abuse'"

# Payment fraud: detect multiple payment method additions from same IP
SecRule REQUEST_METHOD "@streq POST" \
    "id:9600110,\
    phase:2,\
    chain,\
    log,auditlog,pass,\
    msg:'Payment method addition - tracking',\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'payment-fraud-track',\
    setvar:ip.payment_adds=+1,\
    expirevar:ip.payment_adds=3600"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(payment.?method|add.?card|deposit.?method|withdrawal.?method)" \
        "t:none,t:urlDecodeUni"

SecRule IP:PAYMENT_ADDS "@ge 5" \
    "id:9600111,\
    phase:2,\
    deny,status:429,\
    log,auditlog,\
    msg:'Multiple payment methods added from single IP - fraud indicator',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'payment-fraud'"

# Chip dumping detection: suspiciously rapid deposit-to-bet pattern
# (flag for SOAR review, do not auto-block)
SecRule REQUEST_METHOD "@streq POST" \
    "id:9600120,\
    phase:2,\
    chain,\
    log,auditlog,pass,\
    msg:'Rapid deposit activity - flagging for SOAR review',\
    severity:WARNING,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'chip-dump-track',\
    setvar:ip.deposit_count=+1,\
    expirevar:ip.deposit_count=600"
    SecRule REQUEST_URI "@rx (?i)/(api/[^/]+/)?(deposit|fund.?account|top.?up)" \
        "t:none,t:urlDecodeUni"

SecRule IP:DEPOSIT_COUNT "@ge 5" \
    "id:9600121,\
    phase:2,\
    log,auditlog,pass,\
    msg:'Potential chip dumping: 5+ deposits in 10 minutes from single IP',\
    severity:ERROR,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'chip-dumping'"

# Detect known chargeback-fraud parameter patterns in payment requests
SecRule ARGS:amount|ARGS:total|ARGS:payment_amount \
    "@rx ^\s*0+\.?0*\s*$" \
    "id:9600130,\
    phase:2,\
    deny,status:400,\
    log,auditlog,\
    msg:'Zero-value payment amount manipulation',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'payment-manipulation'"

# Negative value injection (attempt to get credits/refunds)
SecRule ARGS:amount|ARGS:total|ARGS:bet_amount|ARGS:stake \
    "@rx ^-" \
    "id:9600131,\
    phase:2,\
    deny,status:400,\
    log,auditlog,\
    msg:'Negative value injection in financial parameter',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'value-manipulation'"

# Detect attempts to enumerate player account IDs via sequential requests
SecRule REQUEST_URI \
    "@rx (?i)/(api/[^/]+/)?(player|user|account)/\d{1,10}($|/|\?)" \
    "id:9600140,\
    phase:1,\
    chain,\
    log,auditlog,pass,\
    msg:'Player account enumeration attempt - tracking',\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'account-enum-track',\
    setvar:ip.account_lookups=+1,\
    expirevar:ip.account_lookups=60"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none"

SecRule IP:ACCOUNT_LOOKUPS "@ge 30" \
    "id:9600141,\
    phase:1,\
    deny,status:429,\
    log,auditlog,\
    msg:'Account ID enumeration detected: 30+ account lookups in 60 seconds',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'account-enumeration'"


# =============================================================================
# SECTION 6: API Abuse Protection
# =============================================================================

# Generic API rate tracking per IP (all /api/ endpoints)
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:9700200,\
    phase:1,\
    log,auditlog,pass,\
    msg:'API request - tracking rate',\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'api-rate-track',\
    setvar:ip.api_requests=+1,\
    expirevar:ip.api_requests=60"

SecRule IP:API_REQUESTS "@ge 200" \
    "id:9700201,\
    phase:1,\
    deny,status:429,\
    log,auditlog,\
    msg:'API rate limit exceeded: 200+ requests per minute from single IP',\
    severity:WARNING,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'api-abuse'"

# Block requests attempting to access admin endpoints from non-admin IPs
# NOTE: Admin IP whitelist is managed separately in modsecurity.conf
SecRule REQUEST_URI \
    "@rx (?i)/(admin|administration|backoffice|cms|dashboard|management|ops|internal)" \
    "id:9700210,\
    phase:1,\
    log,auditlog,pass,\
    msg:'Admin endpoint access attempt',\
    severity:WARNING,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'admin-access',\
    setvar:ip.admin_attempts=+1,\
    expirevar:ip.admin_attempts=300"

SecRule IP:ADMIN_ATTEMPTS "@ge 5" \
    "id:9700211,\
    phase:1,\
    deny,status:403,\
    log,auditlog,\
    msg:'Repeated admin endpoint probing from single IP',\
    severity:CRITICAL,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'admin-probe'"

# Prevent HTTP method abuse on read-only endpoints
SecRule REQUEST_METHOD \
    "@rx ^(PUT|DELETE|PATCH)$" \
    "id:9700220,\
    phase:1,\
    chain,\
    log,auditlog,pass,\
    msg:'Destructive HTTP method on restricted endpoint - monitoring',\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'method-abuse'"
    SecRule REQUEST_URI \
        "@rx (?i)/(player|game|slot|roulette|blackjack|live-casino)/(list|catalog|info|detail|history)" \
        "t:none,t:urlDecodeUni"


# =============================================================================
# SECTION 7: Forensics and Compliance Logging
# =============================================================================

# Log all financial transactions for regulatory audit trail
# (audit-only, always log regardless of other rules)
SecRule REQUEST_URI \
    "@rx (?i)/(api/[^/]+/)?(deposit|withdraw|transfer|payment|transaction)" \
    "id:9000200,\
    phase:2,\
    log,auditlog,pass,\
    msg:'Financial transaction endpoint - regulatory audit log',\
    severity:INFO,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'compliance-audit',\
    tag:'financial-transaction'"

# Log all KYC-related endpoint access (GDPR / AML compliance)
SecRule REQUEST_URI \
    "@rx (?i)/(api/[^/]+/)?(kyc|identity.?verif|document.?upload|aml|pep.?check)" \
    "id:9000201,\
    phase:2,\
    log,auditlog,pass,\
    msg:'KYC/AML endpoint access - compliance audit log',\
    severity:INFO,\
    tag:'SOAR',\
    tag:'AcmeToCasino',\
    tag:'compliance-audit',\
    tag:'kyc-aml'"
