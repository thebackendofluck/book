# =============================================================================
# AcmeToCasino - fail2ban iGaming Jail Configuration
# File: /etc/fail2ban/jail.d/acmetocasino.conf
#
# Covers:
#   - Login brute force (multiple endpoints)
#   - API rate abuse
#   - Bonus abuse attempts
#   - Payment fraud patterns
#   - Account enumeration
#   - ModSecurity WAF trigger aggregation
#
# Custom filters live in: /etc/fail2ban/filter.d/acmetocasino-*.conf
# Custom actions live in: /etc/fail2ban/action.d/acmetocasino-soar.conf
#
# After installing, reload fail2ban:
#   fail2ban-client reload
# =============================================================================


# ---------------------------------------------------------------------------
# [DEFAULT] overrides for the iGaming context
# ---------------------------------------------------------------------------
[DEFAULT]
# Use nftables as the ban backend where available; falls back to iptables
banaction = nftables-multiport
banaction_allports = nftables-allports

# How long a ban lasts (seconds). 1 hour default; SOAR may extend via webhook.
bantime  = 3600
# Window over which maxretry is counted
findtime = 300
# Number of failures before banning
maxretry = 5

# Notify SOAR (n8n) on every ban AND unban event
# The acmetocasino-soar action fires a webhook; keep it in action list for all jails
action = %(action_)s
         acmetocasino-soar[category="%(name)s"]


# ---------------------------------------------------------------------------
# JAIL: Login brute force
# Watches nginx access log for POST failures to auth endpoints
# ---------------------------------------------------------------------------
[acmetocasino-login-bf]
enabled  = true
filter   = acmetocasino-login-bf
logpath  = /var/log/nginx/acmetocasino_access.log
           /var/log/nginx/modsec_audit.log
maxretry = 5
findtime = 300
bantime  = 3600
# SOAR escalation: ban for 24 hours if the same IP triggers again within 6 hours
bantime.increment    = true
bantime.multiplier   = 24
bantime.maxtime      = 86400
action   = %(action_mwl)s
           acmetocasino-soar[category="login-brute-force", severity="high"]


# ---------------------------------------------------------------------------
# JAIL: Password reset abuse
# ---------------------------------------------------------------------------
[acmetocasino-pwreset]
enabled  = true
filter   = acmetocasino-pwreset
logpath  = /var/log/nginx/acmetocasino_access.log
maxretry = 3
findtime = 3600
bantime  = 7200
action   = %(action_mwl)s
           acmetocasino-soar[category="password-reset-abuse", severity="medium"]


# ---------------------------------------------------------------------------
# JAIL: API abuse (global API rate exceeded)
# Triggered by WAF rule 9700201 log entries
# ---------------------------------------------------------------------------
[acmetocasino-api-abuse]
enabled  = true
filter   = acmetocasino-api-abuse
logpath  = /var/log/nginx/acmetocasino_access.log
           /var/log/nginx/modsec_audit.log
maxretry = 3
findtime = 60
bantime  = 1800
action   = %(action_mwl)s
           acmetocasino-soar[category="api-abuse", severity="medium"]


# ---------------------------------------------------------------------------
# JAIL: Bonus abuse
# Triggered by WAF rule 9600101 / custom application log entries
# ---------------------------------------------------------------------------
[acmetocasino-bonus-abuse]
enabled  = true
filter   = acmetocasino-bonus-abuse
logpath  = /var/log/nginx/modsec_audit.log
           /var/log/acmetocasino/app.log
maxretry = 2
findtime = 3600
bantime  = 86400
action   = %(action_mwl)s
           acmetocasino-soar[category="bonus-abuse", severity="high"]


# ---------------------------------------------------------------------------
# JAIL: Payment fraud patterns
# Multiple payment method additions, negative value injection attempts
# ---------------------------------------------------------------------------
[acmetocasino-payment-fraud]
enabled  = true
filter   = acmetocasino-payment-fraud
logpath  = /var/log/nginx/modsec_audit.log
           /var/log/acmetocasino/app.log
maxretry = 2
findtime = 3600
bantime  = 86400
action   = %(action_mwl)s
           acmetocasino-soar[category="payment-fraud", severity="critical"]


# ---------------------------------------------------------------------------
# JAIL: Account enumeration
# Triggered by WAF rule 9600141 or sequential player ID access pattern
# ---------------------------------------------------------------------------
[acmetocasino-account-enum]
enabled  = true
filter   = acmetocasino-account-enum
logpath  = /var/log/nginx/acmetocasino_access.log
           /var/log/nginx/modsec_audit.log
maxretry = 2
findtime = 120
bantime  = 7200
action   = %(action_mwl)s
           acmetocasino-soar[category="account-enumeration", severity="high"]


# ---------------------------------------------------------------------------
# JAIL: ModSecurity WAF rule triggers (aggregated high-severity hits)
# Bans IPs that trip critical WAF rules multiple times
# ---------------------------------------------------------------------------
[acmetocasino-waf-triggers]
enabled  = true
filter   = acmetocasino-waf-triggers
logpath  = /var/log/nginx/modsec_audit.log
maxretry = 5
findtime = 300
bantime  = 3600
action   = %(action_mwl)s
           acmetocasino-soar[category="waf-multi-trigger", severity="high"]


# ---------------------------------------------------------------------------
# JAIL: Scanner / exploit tool detection (WAF tag:scanner-detection)
# Zero-tolerance: single hit triggers an immediate 24-hour ban
# ---------------------------------------------------------------------------
[acmetocasino-scanner]
enabled  = true
filter   = acmetocasino-scanner
logpath  = /var/log/nginx/modsec_audit.log
maxretry = 1
findtime = 60
bantime  = 86400
action   = %(action_mwl)s
           acmetocasino-soar[category="scanner-detected", severity="critical"]


# ---------------------------------------------------------------------------
# JAIL: DDoS / connection flood (nftables rate-limit log entries)
# ---------------------------------------------------------------------------
[acmetocasino-ddos]
enabled  = true
filter   = acmetocasino-ddos
logpath  = /var/log/syslog
           /var/log/messages
maxretry = 10
findtime = 10
bantime  = 600
action   = nftables-allports
           acmetocasino-soar[category="ddos-flood", severity="critical"]


