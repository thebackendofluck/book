# =============================================================================
# ACTION DEFINITION
# File: /etc/fail2ban/action.d/acmetocasino-soar.conf
#
# This action sends a webhook to n8n whenever fail2ban bans or unbans an IP.
# The n8n workflow (security-soar-response) then:
#   1. Enriches the IP via threat intelligence
#   2. Creates a JIRA/Linear incident ticket
#   3. Pushes the ban to the SOAR firewall blocklist (cross-host)
#   4. Triggers further automated investigation playbooks
# =============================================================================

# [Definition]
# actionstart =
# actionstop  =
# actioncheck =
#
# # Called when fail2ban bans an IP
# actionban = curl -s -X POST \
#     -H "Content-Type: application/json" \
#     -H "X-SOAR-Token: %(soar_token)s" \
#     -d '{"event":"ban","ip":"<ip>","jail":"<name>","category":"%(category)s","severity":"%(severity)s","failures":<failures>,"bantime":<bantime>,"ts":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'"}' \
#     "%(soar_webhook_url)s" \
#     -o /dev/null --max-time 10 --retry 3
#
# # Called when fail2ban unbans an IP
# actionunban = curl -s -X POST \
#     -H "Content-Type: application/json" \
#     -H "X-SOAR-Token: %(soar_token)s" \
#     -d '{"event":"unban","ip":"<ip>","jail":"<name>","category":"%(category)s","ts":"'"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)"'"}' \
#     "%(soar_webhook_url)s" \
#     -o /dev/null --max-time 10 --retry 3
#
# [Init]
# # Override these in jail.local or via environment
# soar_webhook_url = http://n8n.internal:5678/webhook/fail2ban-soar
# soar_token       = REPLACE_WITH_SOAR_SHARED_SECRET
# category         = generic
# severity         = medium
