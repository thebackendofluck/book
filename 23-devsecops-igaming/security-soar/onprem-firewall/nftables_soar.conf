#!/usr/sbin/nft -f
# =============================================================================
# AcmeToCasino - nftables SOAR Integration Configuration
# Managed by: firewall_manager.py / SOAR platform
#
# This file owns the dedicated "soar" table.  Do NOT mix manually configured
# production rules into this table; place those in a separate "filter" table.
#
# Apply:   nft -f /etc/nftables/soar.conf
# Reload:  systemctl reload nftables
# Status:  nft list table inet soar
# =============================================================================

# ---------------------------------------------------------------------------
# Flush any previous SOAR table state before reloading
# ---------------------------------------------------------------------------
table inet soar
delete table inet soar

# ---------------------------------------------------------------------------
# SOAR table - full definition
# ---------------------------------------------------------------------------
table inet soar {

    # -----------------------------------------------------------------------
    # Block sets - populated at runtime by firewall_manager.py or SOAR
    # -----------------------------------------------------------------------

    # IPv4 individual IPs and CIDRs
    set blocklist {
        type ipv4_addr
        flags interval
        auto-merge
        size 1048576
        comment "SOAR-managed IPv4 block list"
    }

    # IPv6 individual IPs and CIDRs
    set blocklist6 {
        type ipv6_addr
        flags interval
        auto-merge
        size 1048576
        comment "SOAR-managed IPv6 block list"
    }

    # Temporary (time-limited) blocks – populated by fail2ban or SOAR TPOT
    # Elements expire after 1 hour automatically
    set tempblock {
        type ipv4_addr
        flags timeout
        timeout 1h
        size 65536
        comment "Ephemeral blocks: expire after 1 hour"
    }

    # Rate-limit tracking map: source IP -> packet counter
    # Used by the rate-limit chain below
    meter rl_meter {
        type ipv4_addr
        size 65536
        flags dynamic
    }

    # Known Tor exit node IPs (populated by threat feed script)
    set tor_exits {
        type ipv4_addr
        flags interval
        auto-merge
        size 16384
        comment "Tor exit node IPs - high-risk for iGaming fraud"
    }

    # Known VPN / datacenter ranges to flag (not block by default - logging only)
    set vpn_ranges {
        type ipv4_addr
        flags interval
        auto-merge
        size 65536
        comment "VPN / datacenter CIDRs - log and optionally challenge"
    }

    # -----------------------------------------------------------------------
    # INPUT chain - filters inbound packets
    # -----------------------------------------------------------------------
    chain input {
        type filter hook input priority -10
        policy accept

        # --- Connection tracking: allow established/related, drop invalid ---
        ct state established,related accept
        ct state invalid \
            log prefix "SOAR_INVALID: " level warn flags all \
            counter drop

        # --- SOAR permanent blocks (set-based, O(1) lookup) ---
        ip saddr @blocklist \
            log prefix "SOAR_DROP: " level warn \
            counter drop

        ip6 saddr @blocklist6 \
            log prefix "SOAR_DROP6: " level warn \
            counter drop

        # --- Temporary / ephemeral blocks ---
        ip saddr @tempblock \
            log prefix "SOAR_TMPBLOCK: " level info \
            counter drop

        # --- Tor exit node traffic - drop and alert ---
        ip saddr @tor_exits \
            log prefix "SOAR_TOR: " level notice \
            counter drop

        # --- VPN / datacenter ranges - log only (policy: review in SIEM) ---
        ip saddr @vpn_ranges \
            log prefix "SOAR_VPN: " level info \
            counter

        # --- Rate limiting: protect all services from flood attacks ---
        # Allow up to 100 new connections/sec per source IP, burst 200
        ip protocol tcp ct state new \
            meter rl_meter { ip saddr limit rate over 100/second burst 200 packets } \
            log prefix "SOAR_RATELIMIT: " level warn \
            counter drop

        # --- ICMP flood protection ---
        ip protocol icmp \
            limit rate over 20/second \
            log prefix "SOAR_ICMP_FLOOD: " level warn \
            counter drop

        # --- SYN flood protection ---
        tcp flags & (fin|syn|rst|ack) == syn \
            meter syn_meter { ip saddr limit rate over 50/second burst 100 packets } \
            log prefix "SOAR_SYN_FLOOD: " level warn \
            counter drop

        # --- UDP flood protection ---
        ip protocol udp \
            meter udp_meter { ip saddr limit rate over 200/second burst 400 packets } \
            log prefix "SOAR_UDP_FLOOD: " level warn \
            counter drop
    }

    # -----------------------------------------------------------------------
    # FORWARD chain - filters forwarded packets (if this host is a router/LB)
    # -----------------------------------------------------------------------
    chain forward {
        type filter hook forward priority -10
        policy accept

        ip saddr @blocklist  counter drop
        ip6 saddr @blocklist6 counter drop
        ip saddr @tempblock  counter drop
    }

    # -----------------------------------------------------------------------
    # OUTPUT chain - minimal egress controls
    # -----------------------------------------------------------------------
    chain output {
        type filter hook output priority 0
        policy accept

        # Log outbound connections to blocked destinations (C2 detection)
        ip daddr @blocklist \
            log prefix "SOAR_EGRESS_BLOCKED_DST: " level notice \
            counter
    }

    # -----------------------------------------------------------------------
    # DDoS mitigation chain - called from input for TCP
    # -----------------------------------------------------------------------
    chain ddos_protect {
        # Drop packets with invalid TCP flag combinations
        tcp flags & (fin|syn) == (fin|syn)          counter drop
        tcp flags & (syn|rst) == (syn|rst)           counter drop
        tcp flags & (fin|rst) == (fin|rst)           counter drop
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin counter drop
        tcp flags & (fin|syn|rst|psh|ack|urg) == (fin|psh|urg) counter drop
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 counter drop

        # Drop fragmented packets
        ip frag-off & 0x1fff != 0 counter drop
    }

    # -----------------------------------------------------------------------
    # iGaming application-layer chain
    # Port-specific rate limiting for casino API endpoints
    # -----------------------------------------------------------------------
    chain igaming_ports {
        type filter hook input priority -5
        policy accept

        # Login endpoint (port 443 TCP) - tighter rate limit to prevent brute force
        # SOAR will insert specific per-IP rules via firewall_manager.py
        tcp dport 443 ct state new \
            meter login_meter { ip saddr limit rate over 20/second burst 50 packets } \
            log prefix "SOAR_LOGIN_RATE: " level notice \
            counter drop

        # Payment API port (if separated) - very strict rate limit
        tcp dport 8443 ct state new \
            meter payment_meter { ip saddr limit rate over 5/second burst 10 packets } \
            log prefix "SOAR_PAYMENT_RATE: " level warn \
            counter drop

        # WebSocket game server
        tcp dport { 9000, 9001 } ct state new \
            meter ws_meter { ip saddr limit rate over 30/second burst 60 packets } \
            log prefix "SOAR_WS_RATE: " level info \
            counter drop
    }
}
