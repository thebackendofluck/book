# Checkov Configuration for iGaming Infrastructure Security
# Scans Terraform, Dockerfiles, Kubernetes manifests, and CI/CD pipelines

# Framework Configuration
framework:
  - terraform
  - terraform_plan
  - dockerfile
  - kubernetes
  - github_actions
  - secrets
  - openapi

# Output Configuration
output: cli
output_format: json
compact: false
quiet: false
summary-position: top

# Directory and File Configuration
directory:
  - .

# Skip paths not relevant for security scanning
skip-path:
  - .git/
  - .terraform/
  - .venv/
  - venv/
  - node_modules/
  - __pycache__/
  - "*.tfstate*"
  - examples/
  - test/
  - tests/
  - docs/
  - tmp/

# External Modules
download-external-modules: true
evaluate-variables: true

# Policy Configuration
use-enforcement-rules: true

# Skip specific checks if needed
skip-check: []

# Compliance Configuration -- map checks to regulatory frameworks
# relevant for iGaming (PCI DSS, SOC2, ISO 27001, GDPR)
compliance:
  - pci-dss
  - soc2
  - iso-27001
  - gdpr
  - nist
  - cis

# Secrets Scanning -- file types to scan for hardcoded secrets
secrets-scan-file-type:
  - .tf
  - .yaml
  - .yml
  - .json
  - .py
  - .js
  - .ts
  - .java
  - .go
  - .dockerfile
  - Dockerfile

# Performance Configuration
max-workers: 4
parallelism: 4

# Output File Configuration
output-file-path: checkov-results
output-file-format: json

# Branch Protection (for CI/CD integration)
branch: main
repo-root-for-plan-enrichment: .

# Logging
logging-level: INFO
log-file: checkov.log
