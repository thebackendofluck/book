# Test-rig deployment of the chapter-23 change-management harness.
# Binds to the host's LAN address only (never 0.0.0.0 — published ports bypass
# the host INPUT firewall): this is a disposable verification app, not a service.
services:
  ch23-harness:
    build: .
    container_name: ch23-change-management
    ports:
      - "127.0.0.1:8523:8000"
    restart: unless-stopped
