# ============================================================================
# AcmeToCasino — Wazuh SIEM Inventory
# ============================================================================
#
# Wazuh deployment for security monitoring of the casino platform.
# Manager runs all-in-one (indexer + manager + dashboard) on wazuh001.
# Agents are enrolled on all monitored hosts.
#
# Network: 10.0.10.0/24 (ops-host lab)
# ============================================================================

all:
  children:

    wazuh_manager:
      hosts:
        wazuh001:
          ansible_host: 10.0.10.26
          ansible_user: operator
          server_role: siem_manager
      vars:
        wazuh_version: "4.9"

    wazuh_agents:
      hosts:
        casino001:
          ansible_host: 10.0.10.24
          ansible_user: operator
          server_role: application
      vars:
        wazuh_manager_ip: 10.0.10.26
        wazuh_version: "4.9"
