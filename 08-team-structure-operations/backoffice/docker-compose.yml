# AcmetoCasino Portal - Docker Compose Orchestration
# Full microservices stack: DB, cache, message queue, API, auth, audit, frontend

version: "3.5"
services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - databaseNet

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    hostname: redis
    networks:
      - redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - kafkaNet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  kafka:
    build:
      context: ./
      dockerfile: kafka.Dockerfile
    ports:
      - "127.0.0.1:9092:9092"
    hostname: kafka
    environment:
      KAFKA_ADVERTISED_HOST_NAME: "kafka"
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "test:1:1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kafkaNet
    depends_on:
      - zookeeper
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Web API server: Express + WebSocket, proxies to Kafka microservices
  client_web_api:
    build:
      context: ./
      dockerfile: service.Dockerfile
    ports:
      - "127.0.0.1:4000:443"
    networks:
      - kafkaNet
      - external
      - redis
    depends_on:
      - kafka
    volumes:
      - ./services/client_web_api:/usr/src/app/service
      - ./services/services_shared/:/usr/src/app/services_shared
      - ./services/node_modules:/usr/src/app/node_modules
      - ./shared/:/usr/src/shared
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Authentication microservice: handles login, token refresh, session invalidation
  auth:
    build:
      context: ./
      dockerfile: service.Dockerfile
    networks:
      - kafkaNet
      - databaseNet
      - redis
    depends_on:
      - kafka
    volumes:
      - ./services/auth:/usr/src/app/service
      - ./services/services_shared/:/usr/src/app/services_shared
      - ./shared/:/usr/src/shared
      - ./services/node_modules:/usr/src/app/node_modules
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Audit microservice: logs all operations for compliance
  audit:
    build:
      context: ./
      dockerfile: service.Dockerfile
    networks:
      - kafkaNet
      - databaseNet
      - redis
    depends_on:
      - kafka
    volumes:
      - ./services/audit:/usr/src/app/service
      - ./services/services_shared/:/usr/src/app/services_shared
      - ./shared/:/usr/src/shared
      - ./services/node_modules:/usr/src/app/node_modules
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Vue.js PWA frontend
  pwa:
    build:
      context: ./pwa/
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    hostname: boclient
    volumes:
      - ./pwa/src/:/app/src
      - ./pwa/public/:/app/public
      - ./pwa/tests/:/app/tests
    networks:
      - kafkaNet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  db-data:
  redis-data:

networks:
  kafkaNet:
    ipam:
      driver: default
      config:
        - subnet: 10.22.0.0/16
  redis:
    name: redis
    ipam:
      driver: default
      config:
        - subnet: 10.33.0.0/16
  external:
  databaseNet:
    ipam:
      driver: default
      config:
        - subnet: 10.11.0.0/16
