# AcmetoCasino Portal - Redis Configuration
# Used for session storage, request-response state, and Kafka message coordination

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Security
requirepass acme_redis_dev_password

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF for session durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshots (backup)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
databases 16
hz 10
