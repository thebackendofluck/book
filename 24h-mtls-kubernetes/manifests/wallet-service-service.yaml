# Kubernetes Service object — ensure connections are load-balanced correctly
# For mTLS with persistent connections, session-affinity helps reuse connections
# but is not required. Stateless services should NOT use session affinity.
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: payments
  annotations:
    # For services using connection pools, hint to kube-proxy
    service.kubernetes.io/topology-mode: "Auto"
spec:
  selector:
    app: wallet-service
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  sessionAffinity: None  # Stateless — let kube-proxy distribute
