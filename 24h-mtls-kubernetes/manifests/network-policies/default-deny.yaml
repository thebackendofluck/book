# File: manifests/network-policies/default-deny.yaml
# Applied to every service namespace after initial rollout.
# Forces explicit allowlist per namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: player-service
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
    - Ingress
    - Egress
  ingress: []   # Deny all ingress by default
  egress:       # Allow DNS egress always; everything else must be explicit
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
