# File: manifests/network-policies/player-service-policy.yaml
# Explicit allowlist for player-service ingress and egress.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: player-service-ingress
  namespace: player-service
spec:
  podSelector:
    matchLabels:
      app: player-service
  policyTypes:
    - Ingress
  ingress:
    # Allow from API gateway namespace only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
      ports:
        - protocol: TCP
          port: 8443
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090  # metrics endpoint

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: player-service-egress
  namespace: player-service
spec:
  podSelector:
    matchLabels:
      app: player-service
  policyTypes:
    - Egress
  egress:
    # Allow calls to wallet-service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payments
          podSelector:
            matchLabels:
              app: wallet-service
      ports:
        - protocol: TCP
          port: 8443
    # Allow calls to game-engine
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: game-engine
          podSelector:
            matchLabels:
              app: game-engine
      ports:
        - protocol: TCP
          port: 8443
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
