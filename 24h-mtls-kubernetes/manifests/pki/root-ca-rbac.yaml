# File: manifests/pki/root-ca-rbac.yaml
---
# Only cert-manager's controller service account needs this secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: casino-root-ca-secret-access
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["casino-root-ca-key-pair"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-root-ca-access
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  kind: Role
  name: casino-root-ca-secret-access
  apiGroup: rbac.authorization.k8s.io
