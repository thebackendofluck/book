# File: manifests/pki/ca-bundle.yaml
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: casino-internal-ca-bundle
  namespace: cert-manager
spec:
  sources:
    - useDefaultCAs: false
    - secret:
        name: casino-root-ca-key-pair
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.crt
    namespaceSelector:
      matchLabels:
        mtls-enabled: "true"
