# File: manifests/pki/namespace-intermediate-ca.yaml
# Applied once per service namespace — parameterize NAMESPACE_NAME
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: intermediate-ca
  namespace: player-service
spec:
  isCA: true
  commonName: casino-intermediate-ca-player-service
  subject:
    organizations:
      - CasinoInfrastructure
    organizationalUnits:
      - player-service
  duration: 8760h   # 1 year
  renewBefore: 720h # Renew 30 days before expiry
  secretName: intermediate-ca-key-pair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: casino-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io

---
# Issuer scoped to this namespace only — pods in other namespaces cannot request certs from it
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: namespace-issuer
  namespace: player-service
spec:
  ca:
    secretName: intermediate-ca-key-pair
